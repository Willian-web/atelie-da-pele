};


// ============== ÁREA PROFISSIONAL e "MEUS AGENDAMENTOS" iguais ==============

const AdminArea = ({ appointments, refreshData, clients, blockedSlots, adminToken, onAdminSessionInvalid }) => {
    const [adminView, setAdminView] = useState('agenda'); // agenda | clients | report | blocks
    const [filter, setFilter] = useState('today'); // today | next | all
    const [filterDate, setFilterDate] = useState('');
    const [agendaClientSearch, setAgendaClientSearch] = useState('');
    const [blockManageDate, setBlockManageDate] = useState(() => getLocalTodayStr());
    const [reportStartDate, setReportStartDate] = useState('');
    const [reportEndDate, setReportEndDate] = useState('');
    const [reportData, setReportData] = useState(null);
    const [reportLoading, setReportLoading] = useState(false);
    const [reportError, setReportError] = useState('');
    const [clientEditModal, setClientEditModal] = useState(null);
    const [clientEditError, setClientEditError] = useState('');
    const [clientEditSaving, setClientEditSaving] = useState(false);
    const [manualPayModal, setManualPayModal] = useState(null); // { id, clientName, serviceName, total, paymentType, paidAmount, note, saving, error }
    const [settleBalanceModal, setSettleBalanceModal] = useState(null); // { id, clientName, serviceName, total, paidSoFar, remaining, note, saving, error }

    const todayStr = getLocalTodayStr();

    const adminFetch = async (url, options = {}) => {
        const headers = { ...(options.headers || {}) };
        if (adminToken) headers.Authorization = `Bearer ${adminToken}`;
        const res = await fetch(url, { ...options, headers });
        if (res.status === 401 && typeof onAdminSessionInvalid === 'function') {
            onAdminSessionInvalid();
        }
        return res;
    };

    const openEditClient = (c) => {
        setClientEditError('');
        setClientEditModal({
            id: c.id,
            name: c.name || '',
            phone: c.phone || '',
            address: c.address || '',
            email: String(c.email || '').trim()
        });
    };

    const saveClientEdit = async () => {
        if (!clientEditModal) return;
        setClientEditError('');
        const em = String(clientEditModal.email || '').trim().toLowerCase();
        if (!isValidEmailFormat(em)) {
            setClientEditError('Informe um e-mail válido.');
            return;
        }
        const cleanPhone = String(clientEditModal.phone || '').replace(/\D/g, '');
        if (!cleanPhone) {
            setClientEditError('Telefone inválido.');
            return;
        }
        if (!(clientEditModal.name || '').trim()) {
            setClientEditError('Nome é obrigatório.');
            return;
        }
        setClientEditSaving(true);
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/clients/${encodeURIComponent(clientEditModal.id)}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: (clientEditModal.name || '').trim(),
                    phone: cleanPhone,
                    address: (clientEditModal.address || '').trim(),
                    email: em
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setClientEditError(data.error || 'Não foi possível salvar.');
                return;
            }
            setClientEditModal(null);
            await refreshData();
        } catch {
            setClientEditError('Falha de rede ao salvar.');
        } finally {
            setClientEditSaving(false);
        }
    };

    const handleDeleteClientRecord = async (c) => {
        if (!window.confirm(`Remover o cadastro de "${(c.name || '').trim() || 'esta pessoa'}"? Esta ação não pode ser desfeita.`)) return;
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/clients/${encodeURIComponent(c.id)}`, { method: 'DELETE' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                alert(data.error || 'Não foi possível remover.');
                return;
            }
            await refreshData();
        } catch {
            alert('Falha de rede ao remover.');
        }
    };

    const formatBRL = (value) => {
        const n = Number(value || 0);
        return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    const getServiceName = (serviceId) => {
        const s = getServiceMeta(serviceId);
        return s ? s.name : (serviceId || 'Serviço');
    };

    const getServicePrice = (serviceId) => {
        const s = getServiceMeta(serviceId);
        return s ? s.price : null;
    };

    const sortedApps = useMemo(() => {
        return [...(appointments || [])].sort((a, b) => {
            const da = a.date || '';
            const db = b.date || '';
            if (da !== db) return da.localeCompare(db);
            return (parseTimeToMinutes(a.time) ?? 0) - (parseTimeToMinutes(b.time) ?? 0);
        });
    }, [appointments]);

    const adminBlockSlots = useMemo(
        () => generateTimeSlots(blockManageDate, appointments, blockedSlots || []),
        [blockManageDate, appointments, blockedSlots]
    );

    const filteredApps = useMemo(() => {
        const base = sortedApps;

        let list;
        if (filterDate) {
            list = base.filter((app) => (app.date || '') === filterDate);
        } else if (filter === 'today') {
            list = base.filter((app) => (app.date || '') === todayStr);
        } else if (filter === 'next') {
            list = base.filter((app) => (app.date || '') > todayStr);
        } else {
            list = base;
        }

        const needle = String(agendaClientSearch || '').trim().toLowerCase();
        if (!needle) return list;

        return list.filter((app) => {
            const name = String(app.clientName || app.client_name || '').trim().toLowerCase();
            return name.includes(needle);
        });
    }, [sortedApps, filter, filterDate, todayStr, agendaClientSearch]);

    const handleDelete = async (appointmentId) => {
        if (!appointmentId) return;
        if (!window.confirm('Tem certeza que deseja apagar este agendamento? Esta ação não pode ser desfeita.')) return;

        try {
            const res = await adminFetch(`${API_BASE_URL}/appointments/${appointmentId}`, { method: 'DELETE' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Erro ao apagar agendamento.');
            await refreshData();
        } catch (e) {
            alert(e.message || 'Erro ao apagar agendamento.');
        }
    };

    const handleCancelByAdmin = async (appointmentId) => {
        if (!appointmentId) return;
        const reason = window.prompt('Motivo do cancelamento (opcional):', 'Cancelado pela profissional');
        if (reason === null) return;

        try {
            const res = await adminFetch(`${API_BASE_URL}/appointments/${appointmentId}/cancel`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cancelledBy: 'admin',
                    cancelReason: (reason || '').trim() || 'Cancelado pela profissional'
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Erro ao cancelar agendamento.');
            await refreshData();
        } catch (e) {
            alert(e.message || 'Erro ao cancelar agendamento.');
        }
    };

    const openManualPayment = (app, serviceName, servicePrice) => {
        if (!app || !app.id) return;
        const clientName = app.clientName || app.client_name || 'Cliente';
        const total = (typeof servicePrice === 'number' && Number.isFinite(servicePrice)) ? servicePrice : null;
        setManualPayModal({
            id: app.id,
            clientName,
            serviceName: serviceName || 'Serviço',
            total,
            paymentType: 'partial',
            paidAmount: '',
            note: '',
            saving: false,
            error: ''
        });
    };

    const submitManualPayment = async () => {
        if (!manualPayModal || !manualPayModal.id) return;
        const type = String(manualPayModal.paymentType || '').trim().toLowerCase();
        const paidStr = String(manualPayModal.paidAmount || '').replace(',', '.').trim();
        const paidNum = paidStr ? Number(paidStr) : null;

        if (!['partial', 'full'].includes(type)) {
            setManualPayModal((m) => ({ ...m, error: 'Selecione o tipo de pagamento.' }));
            return;
        }

        if (type === 'partial') {
            if (paidNum == null || !Number.isFinite(paidNum) || paidNum <= 0) {
                setManualPayModal((m) => ({ ...m, error: 'Informe um valor pago válido para pagamento parcial.' }));
                return;
            }
        }

        const summaryLines = [
            `Confirmar pagamento manual?`,
            ``,
            `Agendamento: ${manualPayModal.clientName} — ${manualPayModal.serviceName}`,
            `Tipo: ${type === 'full' ? 'integral' : 'parcial (sinal)'}`
        ];
        if (type === 'partial') summaryLines.push(`Valor pago: R$ ${paidNum.toFixed(2).replace('.', ',')}`);
        if ((manualPayModal.note || '').trim()) summaryLines.push(`Obs.: ${(manualPayModal.note || '').trim()}`);

        if (!window.confirm(summaryLines.join('\n'))) return;

        setManualPayModal((m) => ({ ...m, saving: true, error: '' }));
        try {
            const body = {
                paymentType: type,
                note: (manualPayModal.note || '').trim() || undefined
            };
            if (type === 'partial') body.paidAmount = paidNum;

            const res = await adminFetch(`${API_BASE_URL}/admin/appointments/${encodeURIComponent(manualPayModal.id)}/manual-payment`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Erro ao confirmar pagamento manual.');

            setManualPayModal(null);
            await refreshData();
        } catch (e) {
            setManualPayModal((m) => ({ ...m, saving: false, error: e.message || 'Erro ao confirmar pagamento manual.' }));
        }
    };

    const canSettleRemainingBalance = (app) => {
        if (!app) return false;
        const st = String(app.status || '').trim();
        if (st !== 'confirmed' && st !== 'completed') return false;
        const pt = String(app.paymentType || app.payment_type || '').trim().toLowerCase();
        if (pt !== 'partial') return false;
        const rem = Number(app.remainingAmount ?? app.remaining_amount);
        return Number.isFinite(rem) && rem > 0.005;
    };

    const openSettleBalance = (app, serviceName, servicePrice) => {
        if (!app || !app.id) return;
        const paidSoFar = Number(app.paidAmount ?? app.paid_amount);
        const remaining = Number(app.remainingAmount ?? app.remaining_amount);
        const total = (typeof servicePrice === 'number' && Number.isFinite(servicePrice)) ? servicePrice : null;
        setSettleBalanceModal({
            id: app.id,
            clientName: app.clientName || app.client_name || 'Cliente',
            serviceName: serviceName || 'Serviço',
            total,
            paidSoFar: Number.isFinite(paidSoFar) ? paidSoFar : null,
            remaining: Number.isFinite(remaining) ? remaining : null,
            note: '',
            saving: false,
            error: ''
        });
    };

    const submitSettleRemaining = async () => {
        if (!settleBalanceModal || !settleBalanceModal.id) return;
        const rem = settleBalanceModal.remaining;
        if (rem == null || !Number.isFinite(rem) || rem <= 0) {
            setSettleBalanceModal((m) => ({ ...m, error: 'Sem saldo restante para quitar.' }));
            return;
        }
        const lines = [
            'Quitar saldo restante manualmente?',
            '',
            `${settleBalanceModal.clientName} — ${settleBalanceModal.serviceName}`,
            `Saldo a registrar: R$ ${rem.toFixed(2).replace('.', ',')}`,
            '(será somado ao valor já pago; saldo pendente ficará R$ 0,00)'
        ];
        if ((settleBalanceModal.note || '').trim()) lines.push(`Obs.: ${(settleBalanceModal.note || '').trim()}`);
        if (!window.confirm(lines.join('\n'))) return;

        setSettleBalanceModal((m) => ({ ...m, saving: true, error: '' }));
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/appointments/${encodeURIComponent(settleBalanceModal.id)}/settle-remaining-balance`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    note: (settleBalanceModal.note || '').trim() || undefined
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Erro ao quitar saldo restante.');
            setSettleBalanceModal(null);
            await refreshData();
        } catch (e) {
            setSettleBalanceModal((m) => ({ ...m, saving: false, error: e.message || 'Erro ao quitar saldo restante.' }));
        }
    };

    const fetchReport = async () => {
        setReportError('');
        setReportData(null);

        if (!reportStartDate || !reportEndDate) {
            setReportError('Informe a data inicial e a data final para buscar o relatório.');
            return;
        }

        setReportLoading(true);
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/report?start=${encodeURIComponent(reportStartDate)}&end=${encodeURIComponent(reportEndDate)}`);
            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
                throw new Error(data.error || 'Erro ao buscar relatório.');
            }

            setReportData(data);
        } catch (e) {
            setReportError(e.message || 'Erro ao buscar relatório.');
        } finally {
            setReportLoading(false);
        }
    };

    const handleAdminBlockSlot = async (time) => {
        const reason = window.prompt('Motivo do bloqueio (opcional)?');
        if (reason === null) return;
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/blocked-slots`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date: blockManageDate, time, reason: reason || undefined })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                alert(data.error || 'Não foi possível bloquear este horário.');
                return;
            }
            await refreshData();
        } catch (e) {
            console.error(e);
            alert('Erro de rede ao bloquear.');
        }
    };

    const handleAdminUnblockSlot = async (slotId) => {
        if (!window.confirm('Remover este bloqueio e liberar o horário?')) return;
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/blocked-slots/${slotId}`, { method: 'DELETE' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                alert(data.error || 'Não foi possível remover o bloqueio.');
                return;
            }
            await refreshData();
        } catch (e) {
            console.error(e);
            alert('Erro de rede ao remover bloqueio.');
        }
    };

    const renderAgenda = () => (
        <>
            <div className="filter-tabs admin-agenda-period-tabs" style={{marginBottom: '14px'}}>
                <button className={`tab-btn ${filter === 'today' ? 'active' : ''}`} onClick={() => setFilter('today')}>
                    Hoje
                </button>
                <button className={`tab-btn ${filter === 'next' ? 'active' : ''}`} onClick={() => setFilter('next')}>
                    Próximos
                </button>
                <button className={`tab-btn ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>
                    Todos
                </button>
            </div>

            <div style={{display: 'flex', gap: '12px', flexWrap: 'wrap', alignItems: 'flex-end', marginBottom: '18px'}}>
                <div style={{display: 'flex', flexDirection: 'column', gap: '6px', flex: '0 1 auto'}}>
                    <label style={{fontSize: '13px', color: 'var(--text-muted)'}}>Filtrar por data</label>
                    <input
                        type="date"
                        className="form-control"
                        value={filterDate}
                        onChange={e => setFilterDate(e.target.value)}
                        style={{maxWidth: '220px', width: '100%', minWidth: 0}}
                    />
                </div>
                <div style={{display: 'flex', flexDirection: 'column', gap: '6px', flex: '1 1 200px', minWidth: 'min(100%, 200px)'}}>
                    <label htmlFor="admin-agenda-client-search" style={{fontSize: '13px', color: 'var(--text-muted)'}}>Cliente</label>
                    <input
                        id="admin-agenda-client-search"
                        type="search"
                        className="form-control"
                        value={agendaClientSearch}
                        onChange={(e) => setAgendaClientSearch(e.target.value)}
                        placeholder="Buscar por nome do cliente"
                        autoComplete="off"
                        style={{ width: '100%', minWidth: 0 }}
                    />
                </div>
                <button
                    className="btn-cancel"
                    type="button"
                    onClick={() => {
                        setFilterDate('');
                        setAgendaClientSearch('');
                    }}
                    disabled={!filterDate && !String(agendaClientSearch || '').trim()}
                    style={{padding: '10px 14px', fontSize: '13px'}}
                >
                    Limpar filtros
                </button>
                {filterDate && (
                    <div style={{fontSize: '13px', color: 'var(--text-muted)', marginBottom: '2px', flex: '1 1 100%', width: '100%'}}>
                        Exibindo apenas: <strong>{new Date(filterDate + 'T12:00:00').toLocaleDateString('pt-BR')}</strong>
                    </div>
                )}
            </div>

            <div style={{display: 'flex', flexDirection: 'column', gap: '12px'}}>
                {filteredApps.length === 0 && (
                    <div className="alert" style={{background: '#f8fafc', border: '1px solid #e2e8f0', color: '#334155'}}>
                        Nenhum agendamento encontrado para esse filtro.
                    </div>
                )}

                {filteredApps.map(app => {
                    const clientName = app.clientName || app.client_name || 'Cliente';
                    const phone = app.clientPhone || app.client_phone || '';
                    const location = app.location || '';
                    const notes = app.notes || '';
                    const cancelReason = app.cancelReason || app.cancel_reason || '';
                    const serviceId = app.serviceId || app.service_id || '';
                    const serviceName = getServiceName(serviceId);
                    const servicePrice = getServicePrice(serviceId);
                    const servicePriceStr = (typeof servicePrice === 'number') ? formatPrice(servicePrice) : null;

                    const dateLabel = app.date
                        ? new Date(app.date + 'T12:00:00').toLocaleDateString('pt-BR')
                        : 'Sem data';

                    const mapsLink = 'https://www.google.com/maps/search/?api=1&query=Ateliê+da+Pele+Rua+Rio+Jaguaribe+274';

                    return (
                        <div key={app.id} style={{background: '#fcfcfc', border: '1px solid #ddd', padding: '16px', borderRadius: '10px', textAlign: 'left'}}>
                            <div style={{display: 'flex', justifyContent: 'space-between', gap: '10px', alignItems: 'flex-start', flexWrap: 'wrap'}}>
                                <div>
                                    <div style={{fontWeight: '700', marginBottom: '6px'}}>{clientName}</div>
                                    <div style={{fontSize: '13px', color: 'var(--text-muted)', marginBottom: '8px'}}>
                                        {serviceName}{servicePriceStr ? ` — ${servicePriceStr}` : ''}
                                    </div>
                                </div>
                                <div style={{display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap'}}>
                                    <StatusBadge status={app.status} />
                                    <div style={{fontSize: '13px', color: 'var(--text-muted)'}}>
                                        {dateLabel} • {app.time || 'Sem horário'}
                                    </div>
                                </div>
                            </div>

                            <div style={{display: 'grid', gridTemplateColumns: '1fr', gap: '10px', marginTop: '12px'}}>
                                <div style={{fontSize: '13px'}}>
                                    <strong>Telefone:</strong> {phone || 'N/A'}
                                    {phone && (
                                        <>
                                            {' '}•{' '}
                                            <a
                                                href={`https://wa.me/55${String(phone).replace(/\D/g, '')}`}
                                                target="_blank"
                                                rel="noreferrer"
                                                style={{color: '#0ea5e9', textDecoration: 'none'}}
                                            >
                                                Conversar
                                            </a>
                                        </>
                                    )}
                                </div>

                                {location && (
                                    <div style={{fontSize: '13px'}}>
                                        <strong>Endereço Cliente:</strong><br />{location}
                                    </div>
                                )}

                                <div style={{fontSize: '13px'}}>
                                    <strong>Local do atendimento:</strong><br />
                                    Ateliê da Pele — Rua Rio Jaguaribe, nº 274<br />
                                    <a href={mapsLink} target="_blank" rel="noreferrer" style={{display: 'inline-flex', alignItems: 'center', gap: '6px', marginTop: '6px', fontSize: '13px', color: '#0ea5e9', textDecoration: 'none'}}>
                                        <i className="fas fa-map-marked-alt"></i> Abrir no Google Maps
                                    </a>
                                </div>

                                {notes && (
                                    <div style={{fontSize: '13px'}}>
                                        <strong>Observações:</strong><br />{notes}
                                    </div>
                                )}

                                {cancelReason && (
                                    <div style={{fontSize: '13px', color: '#b91c1c'}}>
                                        <strong>Motivo do cancelamento:</strong><br />{cancelReason}
                                    </div>
                                )}
                            </div>

                            <div className="admin-agenda-actions">
                                <button className="btn-cancel" onClick={() => handleCancelByAdmin(app.id)} style={{padding: '10px 14px', fontSize: '13px'}}>
                                    Cancelar
                                </button>
                                {app.status === 'pending_payment' && (
                                    <button
                                        className="btn-cancel"
                                        onClick={() => openManualPayment(app, serviceName, servicePrice)}
                                        style={{padding: '10px 14px', fontSize: '13px', borderColor: 'rgba(111, 76, 165, 0.35)', color: 'var(--primary-color)'}}
                                    >
                                        <i className="fas fa-hand-holding-usd"></i> Confirmar pagamento manual
                                    </button>
                                )}
                                {canSettleRemainingBalance(app) && (
                                    <button
                                        type="button"
                                        className="btn-cancel"
                                        onClick={() => openSettleBalance(app, serviceName, servicePrice)}
                                        style={{padding: '10px 14px', fontSize: '13px', borderColor: 'rgba(61, 143, 101, 0.45)', color: 'var(--success, #3d8f65)'}}
                                    >
                                        <i className="fas fa-balance-scale"></i> Quitar saldo restante
                                    </button>
                                )}
                                <button className="btn-cancel" onClick={() => handleDelete(app.id)} style={{padding: '10px 14px', fontSize: '13px', borderColor: '#ef4444', color: '#ef4444'}}>
                                    Apagar
                                </button>
                            </div>
                        </div>
                    );
                })}
            </div>
        </>
    );

    const renderClients = () => (
        <div style={{display: 'flex', flexDirection: 'column', gap: '12px'}}>
            {(clients || []).length === 0 && (
                <div className="alert" style={{background: '#f8fafc', border: '1px solid #e2e8f0', color: '#334155'}}>
                    Nenhum cliente cadastrado ainda.
                </div>
            )}

            {(clients || []).slice().sort((a, b) => (a.name || '').localeCompare(b.name || '')).map(c => {
                const name = c.name || 'Cliente';
                const phone = c.phone || '';
                const address = c.address || '';
                const em = c.email || '';
                const cleanPhone = phone ? String(phone).replace(/\D/g, '') : '';
                const waLink = cleanPhone ? `https://wa.me/55${cleanPhone}` : null;

                return (
                    <div key={c.id || `${name}_${phone}`} style={{background: '#fcfcfc', border: '1px solid #ddd', padding: '16px', borderRadius: '10px', textAlign: 'left', display: 'flex', flexWrap: 'wrap', gap: '12px', justifyContent: 'space-between', alignItems: 'flex-start'}}>
                        <div style={{flex: '1 1 200px', minWidth: 0}}>
                            <div style={{fontWeight: '700', marginBottom: '6px'}}>{name}</div>
                            <div style={{fontSize: '13px', color: 'var(--text-muted)'}}>
                                <strong>Telefone:</strong> {phone || 'N/A'}
                            </div>
                            {em && (
                                <div style={{fontSize: '13px', color: 'var(--text-muted)', marginTop: '6px'}}>
                                    <strong>E-mail:</strong> {em}
                                </div>
                            )}
                            {address && (
                                <div style={{fontSize: '13px', color: 'var(--text-muted)', marginTop: '6px'}}>
                                    <strong>Endereço:</strong><br />{address}
                                </div>
                            )}
                        </div>
                        <div style={{display: 'flex', flexWrap: 'wrap', gap: '8px', alignItems: 'center'}}>
                            {waLink && (
                                <a href={waLink} target="_blank" rel="noreferrer" className="wa-btn" style={{marginTop: 0}}>
                                    <i className="fab fa-whatsapp"></i> Conversar
                                </a>
                            )}
                            <button type="button" className="btn-cancel" onClick={() => openEditClient(c)} style={{padding: '10px 14px', fontSize: '13px'}}>
                                <i className="fas fa-pen"></i> Editar
                            </button>
                            <button type="button" className="btn-cancel" onClick={() => handleDeleteClientRecord(c)} style={{padding: '10px 14px', fontSize: '13px', borderColor: '#ef4444', color: '#b91c1c'}}>
                                <i className="fas fa-trash-alt"></i> Apagar
                            </button>
                        </div>
                    </div>
                );
            })}
        </div>
    );

    const renderBlockedSlots = () => (
        <div style={{ padding: '14px 16px', borderRadius: '12px', border: '1px solid #e5e7eb', background: '#fafafa', textAlign: 'left' }}>
            <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'flex-end', gap: '12px', marginBottom: '8px' }}>
                <div>
                    <div style={{ fontSize: '13px', fontWeight: 800, color: '#0f172a', marginBottom: '6px' }}>Bloquear horários</div>
                    <div style={{ fontSize: '12px', color: '#64748b', lineHeight: 1.45, maxWidth: '520px' }}>
                        A grade respeita intervalo mínimo de <strong>1 hora</strong> entre agendamentos. Toque em um horário <strong>Livre</strong> para bloquear; em <strong>Bloqueado</strong> para liberar.
                    </div>
                </div>
                <div>
                    <label className="form-label" style={{ marginBottom: '6px', display: 'block' }}>Dia</label>
                    <input type="date" className="form-control" value={blockManageDate} onChange={(e) => setBlockManageDate(e.target.value)} style={{ maxWidth: '200px' }} />
                </div>
            </div>
            <div className="time-slots" style={{ marginTop: '10px' }}>
                {adminBlockSlots.map((slot, idx) => {
                    const blockRow = (blockedSlots || []).find(
                        (b) => b.date === blockManageDate && normalizeSlotTimeLabel(b.time) === slot.time
                    );
                    let label = 'Livre';
                    if (slot.isPast) label = 'Passado';
                    else if (slot.isBlockedManual) label = 'Bloqueado';
                    else if (slot.hasAppointmentAtTime) label = 'Agendado';
                    else if (!slot.available) label = 'Indisponível';

                    let className = 'time-slot';
                    if (slot.isPast) className += ' past-slot';
                    else if (slot.isBlockedManual) className += ' disabled';
                    else if (!slot.available) className += ' disabled';

                    const canTryBlock = !slot.isPast && !slot.isBlockedManual && !slot.hasAppointmentAtTime;

                    return (
                        <div
                            key={idx}
                            className={className}
                            title={
                                slot.isBlockedManual
                                    ? 'Clique para desbloquear'
                                    : canTryBlock
                                        ? 'Clique para bloquear'
                                        : slot.hasAppointmentAtTime
                                            ? 'Horário com agendamento'
                                            : ''
                            }
                            style={{
                                minWidth: '92px',
                                flexDirection: 'column',
                                alignItems: 'stretch',
                                gap: '4px',
                                padding: '8px 6px',
                                cursor:
                                    slot.isPast || slot.hasAppointmentAtTime
                                        ? 'default'
                                        : slot.isBlockedManual || canTryBlock
                                            ? 'pointer'
                                            : 'default',
                                borderColor: slot.isBlockedManual ? '#c4b5fd' : undefined,
                                background: slot.isBlockedManual ? '#f5f3ff' : undefined
                            }}
                            onClick={() => {
                                if (slot.isPast || slot.hasAppointmentAtTime) return;
                                if (slot.isBlockedManual) {
                                    if (blockRow && blockRow.id != null) handleAdminUnblockSlot(blockRow.id);
                                    return;
                                }
                                if (canTryBlock) handleAdminBlockSlot(slot.time);
                            }}
                        >
                            <span style={{ fontWeight: 800, fontSize: '14px' }}>{slot.time}</span>
                            <span
                                style={{
                                    fontSize: '10px',
                                    fontWeight: 700,
                                    color: slot.isBlockedManual ? '#5b21b6' : slot.hasAppointmentAtTime ? '#0369a1' : '#64748b',
                                    textTransform: 'uppercase',
                                    letterSpacing: '0.3px'
                                }}
                            >
                                {label}
                            </span>
                        </div>
                    );
                })}
            </div>
        </div>
    );

    const renderReport = () => {
        const summary = reportData?.summary || null;
        const items = Array.isArray(reportData?.items) ? reportData.items : [];

        const Card = ({ title, value, hint }) => (
            <div style={{background: '#fcfcfc', border: '1px solid #ddd', padding: '14px', borderRadius: '10px', textAlign: 'left', minWidth: 0, boxSizing: 'border-box'}}>
                <div style={{fontSize: '12px', color: 'var(--text-muted)', marginBottom: '6px', lineHeight: 1.35}}>{title}</div>
                <div style={{fontSize: '18px', fontWeight: '800'}}>{value}</div>
                {hint && <div style={{fontSize: '12px', color: 'var(--text-muted)', marginTop: '8px', lineHeight: 1.4}}>{hint}</div>}
            </div>
        );

        return (
            <div style={{textAlign: 'left'}}>
                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', gap: '12px', flexWrap: 'wrap', marginBottom: '14px'}}>
                    <h3 style={{margin: 0}}>Relatório de Faturamento</h3>
                    <div style={{display: 'flex', gap: '10px', flexWrap: 'wrap', alignItems: 'flex-end'}}>
                        <div style={{display: 'flex', flexDirection: 'column', gap: '6px'}}>
                            <label style={{fontSize: '13px', color: 'var(--text-muted)'}}>Data inicial</label>
                            <input type="date" className="form-control" value={reportStartDate} onChange={e => setReportStartDate(e.target.value)} style={{maxWidth: '190px'}} />
                        </div>
                        <div style={{display: 'flex', flexDirection: 'column', gap: '6px'}}>
                            <label style={{fontSize: '13px', color: 'var(--text-muted)'}}>Data final</label>
                            <input type="date" className="form-control" value={reportEndDate} onChange={e => setReportEndDate(e.target.value)} style={{maxWidth: '190px'}} />
                        </div>
                        <button className="btn-submit" onClick={fetchReport} style={{padding: '10px 14px', fontSize: '13px'}}>
                            Buscar
                        </button>
                    </div>
                </div>

                {reportLoading && (
                    <div className="alert" style={{background: '#f8fafc', border: '1px solid #e2e8f0', color: '#334155'}}>
                        Carregando...
                    </div>
                )}

                {!!reportError && (
                    <div className="alert alert-error" style={{marginBottom: '12px'}}>
                        {reportError}
                    </div>
                )}

                {summary && (
                    <>
                        <div style={{display: 'grid', gap: '12px', marginBottom: '16px', width: '100%', boxSizing: 'border-box', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 200px), 1fr))'}}>
                            <Card title="Total recebido" value={formatBRL(summary.totalRevenue)} hint="Soma do que já entrou: integral ou parcial (inclui sinal), em confirmados ou concluídos." />
                            <Card title="Valor a receber" value={formatBRL(summary.totalRemainingToReceive)} hint="Saldo pendente nesses agendamentos (em geral, após parcial/sinal)." />
                            <Card title="Agendamentos no período" value={String(summary.totalAppointments || 0)} />
                            <Card title="Clientes únicos" value={String(summary.uniqueClients || 0)} />
                        </div>

                        <div style={{background: '#fff', border: '1px solid #ddd', borderRadius: '10px', overflowX: 'auto', maxWidth: '100%', boxSizing: 'border-box'}}>
                            <table style={{width: '100%', borderCollapse: 'collapse', minWidth: '960px'}}>
                                <thead>
                                    <tr style={{background: '#f8fafc'}}>
                                        <th style={{textAlign: 'left', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Cliente</th>
                                        <th style={{textAlign: 'left', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Serviço</th>
                                        <th style={{textAlign: 'left', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Data</th>
                                        <th style={{textAlign: 'left', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Hora</th>
                                        <th style={{textAlign: 'left', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Status</th>
                                        <th style={{textAlign: 'left', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Tipo pagamento</th>
                                        <th style={{textAlign: 'right', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Valor total procedimento</th>
                                        <th style={{textAlign: 'right', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Valor pago</th>
                                        <th style={{textAlign: 'right', padding: '10px 18px 10px 10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Valor restante</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {items.length === 0 ? (
                                        <tr>
                                            <td colSpan="9" style={{padding: '12px', fontSize: '13px', color: 'var(--text-muted)'}}>
                                                Nenhum item no período.
                                            </td>
                                        </tr>
                                    ) : items.map((it, idx) => {
                                        const dateLabel = it.date ? new Date(it.date + 'T12:00:00').toLocaleDateString('pt-BR') : '-';
                                        const effPaid = (it.effectiveReceivedPaid === null || it.effectiveReceivedPaid === undefined) ? null : Number(it.effectiveReceivedPaid);
                                        const remainingAmount = (it.remainingAmount === null || it.remainingAmount === undefined) ? null : Number(it.remainingAmount);
                                        const paymentTypeRaw = (it.paymentType || '').toString().toLowerCase();
                                        const paymentType = paymentTypeRaw === 'partial'
                                            ? 'Parcial'
                                            : paymentTypeRaw === 'full'
                                                ? 'Total'
                                                : '-';

                                        const procTotal = (it.procedureTotal === null || it.procedureTotal === undefined) ? null : Number(it.procedureTotal);

                                        return (
                                            <tr key={it.id || idx} style={{borderBottom: '1px solid #f1f5f9'}}>
                                                <td style={{padding: '10px', fontSize: '13px'}}>{it.clientName || '-'}</td>
                                                <td style={{padding: '10px', fontSize: '13px'}}>{it.serviceName || it.serviceId || '-'}</td>
                                                <td style={{padding: '10px', fontSize: '13px'}}>{dateLabel}</td>
                                                <td style={{padding: '10px', fontSize: '13px'}}>{it.time || '-'}</td>
                                                <td style={{padding: '10px', fontSize: '13px'}}><StatusBadge status={it.status} /></td>
                                                <td style={{padding: '10px', fontSize: '13px'}}>{paymentType}</td>
                                                <td style={{padding: '10px', fontSize: '13px', textAlign: 'right'}}>{procTotal != null && Number.isFinite(procTotal) ? formatBRL(procTotal) : '—'}</td>
                                                <td style={{padding: '10px', fontSize: '13px', textAlign: 'right'}}>{effPaid != null && Number.isFinite(effPaid) && effPaid > 0 ? formatBRL(effPaid) : '—'}</td>
                                                <td style={{padding: '10px 18px 10px 10px', fontSize: '13px', textAlign: 'right'}}>{remainingAmount != null ? formatBRL(remainingAmount) : '-'}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </>
                )}
            </div>
        );
    };

    return (
        <div className="booking-section step-container" style={{textAlign: 'center'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', gap: '12px', alignItems: 'center', flexWrap: 'wrap', marginBottom: '16px'}}>
                <h2 style={{margin: 0}}>Painel Profissional</h2>
                <button className="btn-admin" onClick={refreshData}>
                    <i className="fas fa-sync-alt"></i> Atualizar
                </button>
            </div>

            <div className="filter-tabs" style={{justifyContent: 'center'}}>
                <button className={`tab-btn ${adminView === 'agenda' ? 'active' : ''}`} onClick={() => setAdminView('agenda')}>
                    Agenda Geral
                </button>
                <button className={`tab-btn ${adminView === 'clients' ? 'active' : ''}`} onClick={() => setAdminView('clients')}>
                    Radar de Clientes
                </button>
                <button className={`tab-btn ${adminView === 'report' ? 'active' : ''}`} onClick={() => setAdminView('report')}>
                    Relatório
                </button>
                <button className={`tab-btn ${adminView === 'blocks' ? 'active' : ''}`} onClick={() => setAdminView('blocks')}>
                    Bloquear horários
                </button>
            </div>

            <div style={{marginTop: '18px'}}>
                {adminView === 'agenda' && renderAgenda()}
                {adminView === 'clients' && renderClients()}
                {adminView === 'report' && renderReport()}
                {adminView === 'blocks' && renderBlockedSlots()}
            </div>

            {settleBalanceModal && (
                <div className="password-overlay" style={{zIndex: 10045}} role="dialog" aria-modal="true">
                    <div className="password-modal manual-payment-modal" style={{maxWidth: '520px', width: '100%', textAlign: 'left'}}>
                        <h3 style={{marginBottom: '12px', textAlign: 'center'}}>Quitar saldo restante</h3>
                        <div style={{fontSize: '13px', color: 'var(--text-muted)', marginBottom: '12px', lineHeight: 1.4, textAlign: 'center'}}>
                            Registre o pagamento do saldo (presencial, Pix manual, dinheiro ou transferência). O valor já pago (ex.: sinal) não será apagado — apenas somado.
                        </div>

                        <div style={{background: '#fff', border: '1px solid var(--border-color)', borderRadius: '12px', padding: '12px 14px', marginBottom: '12px'}}>
                            <div style={{fontWeight: 700, marginBottom: '6px'}}>{settleBalanceModal.clientName}</div>
                            <div style={{fontSize: '13px', color: 'var(--text-muted)', marginBottom: '8px'}}>
                                {settleBalanceModal.serviceName}
                                {typeof settleBalanceModal.total === 'number' ? ` — total ${formatPrice(settleBalanceModal.total)}` : ''}
                            </div>
                            <div style={{fontSize: '13px', lineHeight: 1.5}}>
                                {settleBalanceModal.paidSoFar != null && (
                                    <div><strong>Já pago:</strong> R$ {settleBalanceModal.paidSoFar.toFixed(2).replace('.', ',')}</div>
                                )}
                                {settleBalanceModal.remaining != null && (
                                    <div><strong>Saldo a quitar agora:</strong> R$ {settleBalanceModal.remaining.toFixed(2).replace('.', ',')}</div>
                                )}
                            </div>
                        </div>

                        <div className="form-group full-width" style={{marginBottom: 0}}>
                            <label className="form-label">Observação (opcional)</label>
                            <input
                                className="form-control"
                                placeholder="Ex.: Pago em dinheiro no atendimento"
                                value={settleBalanceModal.note}
                                onChange={(e) => setSettleBalanceModal((m) => ({ ...m, note: e.target.value, error: '' }))}
                            />
                        </div>

                        {settleBalanceModal.error && (
                            <div className="alert alert-error" style={{marginTop: '12px', marginBottom: 0, fontSize: '13px'}}>
                                {settleBalanceModal.error}
                            </div>
                        )}

                        <div className="modal-actions" style={{marginTop: '12px'}}>
                            <button type="button" className="btn-cancel" onClick={() => setSettleBalanceModal(null)} disabled={settleBalanceModal.saving}>
                                Cancelar
                            </button>
                            <button type="button" className="btn-submit" style={{flex: 1}} onClick={submitSettleRemaining} disabled={settleBalanceModal.saving}>
                                {settleBalanceModal.saving ? 'Salvando…' : 'Confirmar quitação'}
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {manualPayModal && (
                <div className="password-overlay" style={{zIndex: 10040}} role="dialog" aria-modal="true">
                    <div className="password-modal manual-payment-modal" style={{maxWidth: '520px', width: '100%', textAlign: 'left'}}>
                        <h3 style={{marginBottom: '12px', textAlign: 'center'}}>Confirmar pagamento manual</h3>
                        <div style={{fontSize: '13px', color: 'var(--text-muted)', marginBottom: '12px', lineHeight: 1.4, textAlign: 'center'}}>
                            Use quando a cliente pagou fora da InfinitePay (Pix manual, dinheiro, transferência, presencial).
                        </div>

                        <div style={{background: '#fff', border: '1px solid var(--border-color)', borderRadius: '12px', padding: '12px 14px', marginBottom: '12px'}}>
                            <div style={{fontWeight: 700, marginBottom: '6px'}}>{manualPayModal.clientName}</div>
                            <div style={{fontSize: '13px', color: 'var(--text-muted)'}}>
                                {manualPayModal.serviceName}
                                {typeof manualPayModal.total === 'number' ? ` — ${formatPrice(manualPayModal.total)}` : ''}
                            </div>
                        </div>

                        <div className="form-grid" style={{gap: '12px'}}>
                            <div className="form-group" style={{marginBottom: 0}}>
                                <label className="form-label">Tipo</label>
                                <select
                                    className="form-control"
                                    value={manualPayModal.paymentType}
                                    onChange={(e) => setManualPayModal((m) => ({ ...m, paymentType: e.target.value, error: '' }))}
                                >
                                    <option value="partial">Parcial (sinal / pago fora)</option>
                                    <option value="full">Integral (procedimento pago)</option>
                                </select>
                            </div>

                            {String(manualPayModal.paymentType) === 'partial' && (
                                <div className="form-group" style={{marginBottom: 0}}>
                                    <label className="form-label">Valor pago (R$)</label>
                                    <input
                                        inputMode="decimal"
                                        className="form-control"
                                        placeholder="Ex.: 30,00"
                                        value={manualPayModal.paidAmount}
                                        onChange={(e) => setManualPayModal((m) => ({ ...m, paidAmount: e.target.value, error: '' }))}
                                    />
                                </div>
                            )}

                            <div className="form-group full-width" style={{marginBottom: 0}}>
                                <label className="form-label">Observação (opcional)</label>
                                <input
                                    className="form-control"
                                    placeholder="Ex.: Pago via Pix manual"
                                    value={manualPayModal.note}
                                    onChange={(e) => setManualPayModal((m) => ({ ...m, note: e.target.value }))}
                                />
                            </div>
                        </div>

                        {manualPayModal.error && (
                            <div className="alert alert-error" style={{marginTop: '12px', marginBottom: 0, fontSize: '13px'}}>
                                {manualPayModal.error}
                            </div>
                        )}

                        <div className="modal-actions" style={{marginTop: '12px'}}>
                            <button type="button" className="btn-cancel" onClick={() => setManualPayModal(null)} disabled={manualPayModal.saving}>
                                Cancelar
                            </button>
                            <button type="button" className="btn-submit" style={{flex: 1}} onClick={submitManualPayment} disabled={manualPayModal.saving}>
                                {manualPayModal.saving ? 'Salvando…' : 'Confirmar pagamento'}
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {clientEditModal && (
                <div className="password-overlay" style={{zIndex: 10050}}>
                    <div className="password-modal" style={{maxWidth: '420px', width: '100%', textAlign: 'left'}}>
                        <h3 style={{marginBottom: '16px', textAlign: 'center'}}>Editar cliente</h3>
                        <div className="form-group full-width">
                            <label className="form-label">Nome</label>
                            <input type="text" className="form-control" value={clientEditModal.name} onChange={e => setClientEditModal({ ...clientEditModal, name: e.target.value })} />
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">WhatsApp (somente números)</label>
                            <input type="text" className="form-control" value={clientEditModal.phone} onChange={e => setClientEditModal({ ...clientEditModal, phone: e.target.value })} />
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">E-mail</label>
                            <input type="email" className="form-control" autoComplete="email" value={clientEditModal.email} onChange={e => setClientEditModal({ ...clientEditModal, email: e.target.value })} />
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">Endereço</label>
                            <input type="text" className="form-control" value={clientEditModal.address} onChange={e => setClientEditModal({ ...clientEditModal, address: e.target.value })} />
                        </div>
                        {clientEditError && <div className="alert alert-error" style={{marginBottom: '12px', fontSize: '13px'}}>{clientEditError}</div>}
                        <div className="modal-actions" style={{marginTop: '8px'}}>
                            <button type="button" className="btn-cancel" onClick={() => { setClientEditModal(null); setClientEditError(''); }} disabled={clientEditSaving}>Cancelar</button>
                            <button type="button" className="btn-submit" style={{flex: 1}} onClick={saveClientEdit} disabled={clientEditSaving}>{clientEditSaving ? 'Salvando…' : 'Salvar'}</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

const MyAppointmentsArea = ({ appointments, refreshData, clients, setView }) => {
    const [phoneInput, setPhoneInput] = useState('');
    const [filter, setFilter] = useState('next'); // next | all | past
    const [selfEditModal, setSelfEditModal] = useState(null);
    const [selfEditError, setSelfEditError] = useState('');
    const [selfEditSaving, setSelfEditSaving] = useState(false);
    const [selfEditBanner, setSelfEditBanner] = useState('');

    const cleanPhone = (p) => String(p || '').replace(/\D/g, '');
    const myPhone = cleanPhone(phoneInput);
    const todayStr = getLocalTodayStr();

    const myApps = useMemo(() => {
        if (!myPhone) return [];

        const list = (appointments || []).filter(a => {
            const apPhone = cleanPhone(a.clientPhone || a.client_phone);
            return apPhone && apPhone === myPhone;
        });

        const sorted = list.slice().sort((a, b) => {
            const da = a.date || '';
            const db = b.date || '';
            if (da !== db) return da.localeCompare(db);
            const ta = (a.time || '').toString();
            const tb = (b.time || '').toString();
            return ta.localeCompare(tb);
        });

        if (filter === 'all') return sorted;
        if (filter === 'past') return sorted.filter(a => (a.date || '') < todayStr);
        return sorted.filter(a => (a.date || '') >= todayStr);
    }, [appointments, myPhone, filter, todayStr]);

    const matchedClient = useMemo(() => {
        if (!myPhone) return null;
        const list = clients || [];
        let c = list.find((cl) => cleanPhone(cl.phone) === myPhone);
        if (!c && myApps.length) {
            const cid = myApps[0].clientId || myApps[0].client_id;
            if (cid) {
                const byId = list.find((cl) => cl.id === cid);
                const apPh = cleanPhone(myApps[0].clientPhone || myApps[0].client_phone);
                if (byId && apPh === myPhone) c = byId;
            }
        }
        return c || null;
    }, [clients, myPhone, myApps]);

    useEffect(() => {
        if (!selfEditBanner) return undefined;
        const t = setTimeout(() => setSelfEditBanner(''), 5000);
        return () => clearTimeout(t);
    }, [selfEditBanner]);

    const openSelfEdit = () => {
        if (!matchedClient || !myPhone) return;
        setSelfEditError('');
        setSelfEditBanner('');
        setSelfEditModal({
            id: matchedClient.id,
            name: matchedClient.name || '',
            phone: matchedClient.phone || '',
            email: String(matchedClient.email || '').trim(),
            address: matchedClient.address || '',
            verifyDigits: myPhone
        });
    };

    const saveSelfEdit = async () => {
        if (!selfEditModal) return;
        setSelfEditError('');
        const em = String(selfEditModal.email || '').trim().toLowerCase();
        if (!isValidEmailFormat(em)) {
            setSelfEditError('Informe um e-mail válido.');
            return;
        }
        const newDigits = cleanPhone(selfEditModal.phone);
        if (!newDigits) {
            setSelfEditError('O telefone é obrigatório para localizar seus agendamentos.');
            return;
        }
        if (!(selfEditModal.name || '').trim()) {
            setSelfEditError('Nome é obrigatório.');
            return;
        }
        setSelfEditSaving(true);
        try {
            const res = await fetch(`${API_BASE_URL}/clients/${encodeURIComponent(selfEditModal.id)}/self`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    verifyPhoneDigits: selfEditModal.verifyDigits,
                    name: (selfEditModal.name || '').trim(),
                    phone: newDigits,
                    address: (selfEditModal.address || '').trim(),
                    email: em
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setSelfEditError(data.error || 'Não foi possível salvar.');
                return;
            }
            setSelfEditModal(null);
            if (newDigits !== myPhone) {
                setPhoneInput(newDigits);
            }
            setSelfEditBanner('Cadastro atualizado com sucesso.');
            await refreshData();
        } catch {
            setSelfEditError('Falha de rede ao salvar.');
        } finally {
            setSelfEditSaving(false);
        }
    };

    return (
        <div className="booking-section step-container" style={{textAlign: 'center'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', gap: '12px', alignItems: 'center', flexWrap: 'wrap', marginBottom: '20px'}}>
                <h2 style={{margin: 0}}>Meus Agendamentos</h2>
                <div style={{display: 'inline-flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap', justifyContent: 'flex-end'}}>
                    {matchedClient && myPhone && (
                        <button
                            type="button"
                            className="refresh-btn"
                            onClick={openSelfEdit}
                            style={{
                                padding: '7px 12px',
                                borderRadius: '999px',
                                width: 'fit-content',
                                maxWidth: '100%',
                                opacity: 0.92
                            }}
                            aria-label="Editar cadastro"
                        >
                            <i className="fas fa-pen" aria-hidden="true"></i>
                            Editar cadastro
                        </button>
                    )}
                    <button className="btn-admin" onClick={refreshData}>
                        <i className="fas fa-sync-alt"></i> Atualizar
                    </button>
                </div>
            </div>

            <div style={{maxWidth: '520px', margin: '0 auto', textAlign: 'left', width: '100%', boxSizing: 'border-box', padding: '0 4px'}}>
                <label style={{fontSize: '13px', color: 'var(--text-muted)', display: 'block', marginBottom: '8px'}}>
                    Digite seu telefone para ver seus agendamentos
                </label>
                <input
                    type="text"
                    className="form-control"
                    value={phoneInput}
                    onChange={e => setPhoneInput(e.target.value)}
                    placeholder="Ex: (41) 99999-9999"
                    style={{ width: '100%', boxSizing: 'border-box' }}
                />

                <div className="filter-tabs" style={{marginTop: '18px', marginBottom: '18px', justifyContent: 'center'}}>
                    <button className={`tab-btn ${filter === 'next' ? 'active' : ''}`} onClick={() => setFilter('next')}>
                        Próximos
                    </button>
                    <button className={`tab-btn ${filter === 'past' ? 'active' : ''}`} onClick={() => setFilter('past')}>
                        Anteriores
                    </button>
                    <button className={`tab-btn ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>
                        Todos
                    </button>
                </div>
            </div>

            {selfEditBanner && (
                <div className="alert" style={{ background: '#ecfdf5', border: '1px solid #a7f3d0', color: '#065f46', maxWidth: '520px', margin: '0 auto 12px', fontSize: '14px' }}>
                    {selfEditBanner}
                </div>
            )}

            {!myPhone && (
                <div className="alert" style={{background: '#f8fafc', border: '1px solid #e2e8f0', color: '#334155'}}>
                    Informe seu telefone acima para carregar seus agendamentos.
                </div>
            )}

            {myPhone && myApps.length === 0 && (
                <div className="alert" style={{background: '#f8fafc', border: '1px solid #e2e8f0', color: '#334155'}}>
                    Nenhum agendamento encontrado para este telefone.
                </div>
            )}

            <div style={{display: 'flex', flexDirection: 'column', gap: '12px', marginTop: '10px', width: '100%', maxWidth: '100%', boxSizing: 'border-box'}}>
                {myApps.map(app => {
                    const clientName = app.clientName || app.client_name || 'Cliente';
                    const serviceId = app.serviceId || app.service_id || '';
                    const serviceName = getClientServiceTitleById(serviceId);
                    const dateLabel = app.date ? new Date(app.date + 'T12:00:00').toLocaleDateString('pt-BR') : '-';
                    const timeLabel = app.time || '-';
                    const location = app.location || '';
                    const notes = app.notes || '';
                    const cancelReason = app.cancelReason || app.cancel_reason || '';
                    const { paid, remaining, showRemaining } = resolveAppointmentPaidForDisplay(app);
                    const paidLabel = formatBRLFromNumber(paid != null ? paid : 0);
                    const remLabel = showRemaining && remaining != null ? formatBRLFromNumber(remaining) : null;

                    return (
                        <div key={app.id} style={{background: '#fcfcfc', border: '1px solid #ddd', padding: '16px', borderRadius: '10px', textAlign: 'left', maxWidth: '100%', boxSizing: 'border-box', wordBreak: 'break-word'}}>
                            <div style={{display: 'flex', justifyContent: 'space-between', gap: '10px', alignItems: 'flex-start', flexWrap: 'wrap'}}>
                                <div style={{ minWidth: 0, flex: '1 1 auto' }}>
                                    <div style={{fontWeight: '700', marginBottom: '6px'}}>{serviceName}</div>
                                    <div style={{fontSize: '13px', color: 'var(--text-muted)'}}>{dateLabel} • {timeLabel}</div>
                                    <div style={{fontSize: '13px', color: 'var(--text-muted)', marginTop: '6px'}}><strong>Cliente:</strong> {clientName}</div>
                                    {paidLabel && (
                                        <div style={{ fontSize: '13px', marginTop: '8px', color: 'var(--text-dark)' }}>
                                            <strong>Valor pago:</strong> {paidLabel}
                                            {remLabel && (
                                                <span style={{ display: 'block', marginTop: '4px' }}><strong>Saldo restante:</strong> {remLabel}</span>
                                            )}
                                        </div>
                                    )}
                                </div>
                                <StatusBadge status={app.status} />
                            </div>

                            {location && (
                                <div style={{fontSize: '13px', marginTop: '10px'}}>
                                    <strong>Endereço informado:</strong><br />{location}
                                </div>
                            )}

                            <div style={{fontSize: '13px', marginTop: '10px'}}>
                                <strong>Local do atendimento:</strong><br />
                                Ateliê da Pele — Rua Rio Jaguaribe, nº 274
                            </div>

                            {notes && (
                                <div style={{fontSize: '13px', marginTop: '10px'}}>
                                    <strong>Observações:</strong><br />{notes}
                                </div>
                            )}

                            {cancelReason && (
                                <div style={{fontSize: '13px', marginTop: '10px', color: '#b91c1c'}}>
                                    <strong>Motivo do cancelamento:</strong><br />{cancelReason}
                                </div>
                            )}
                        </div>
                    );
                })}
            </div>

            {selfEditModal && (
                <div className="password-overlay self-edit-overlay" style={{ zIndex: 10050, padding: '12px', alignItems: 'center', justifyContent: 'center', boxSizing: 'border-box' }} role="dialog" aria-modal="true" aria-labelledby="self-edit-title">
                    <div
                        className="password-modal"
                        style={{
                            maxWidth: 'min(420px, calc(100vw - 24px))',
                            width: '100%',
                            textAlign: 'left',
                            maxHeight: '90vh',
                            overflowY: 'auto',
                            boxSizing: 'border-box'
                        }}
                    >
                        <h3 id="self-edit-title" style={{ marginBottom: '16px', textAlign: 'center' }}>Editar cadastro</h3>
                        <div className="form-group full-width">
                            <label className="form-label">Nome</label>
                            <input type="text" className="form-control" value={selfEditModal.name} onChange={e => setSelfEditModal({ ...selfEditModal, name: e.target.value })} style={{ width: '100%', boxSizing: 'border-box' }} />
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">WhatsApp</label>
                            <input type="text" className="form-control" value={selfEditModal.phone} onChange={e => setSelfEditModal({ ...selfEditModal, phone: e.target.value })} style={{ width: '100%', boxSizing: 'border-box' }} />
                            <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '6px 0 0' }}>Necessário para buscar seus agendamentos; não pode ficar vazio.</p>
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">E-mail</label>
                            <input type="email" className="form-control" autoComplete="email" value={selfEditModal.email} onChange={e => setSelfEditModal({ ...selfEditModal, email: e.target.value })} style={{ width: '100%', boxSizing: 'border-box' }} />
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">Endereço</label>
                            <input type="text" className="form-control" value={selfEditModal.address} onChange={e => setSelfEditModal({ ...selfEditModal, address: e.target.value })} style={{ width: '100%', boxSizing: 'border-box' }} />
                        </div>
                        {selfEditError && <div className="alert alert-error" style={{ marginBottom: '12px', fontSize: '13px' }}>{selfEditError}</div>}
                        <div className="modal-actions" style={{ marginTop: '8px', flexWrap: 'wrap', gap: '8px' }}>
                            <button type="button" className="btn-cancel" onClick={() => { setSelfEditModal(null); setSelfEditError(''); }} disabled={selfEditSaving}>Cancelar</button>
                            <button type="button" className="btn-submit" style={{ flex: '1 1 140px', minWidth: 0 }} onClick={saveSelfEdit} disabled={selfEditSaving}>{selfEditSaving ? 'Salvando…' : 'Salvar'}</button>
                        </div>
                    </div>
                </div>
            )}

            <div style={{marginTop: '20px'}}>
                <button className="btn-admin" onClick={() => setView('client')}>
                    <i className="fas fa-arrow-left"></i> Voltar
                </button>
            </div>
        </div>
    );
};


// ============== ROOT APP ==============

function readBookingRestoreOrderNsu() {
    try {
        const u = new URL(window.location.href);
        if (u.searchParams.get('return') === 'booking') {
            return String(u.searchParams.get('order_nsu') || '').trim();
        }
    } catch (_) { /* ignore */ }
    return '';
}

const App = () => {
    const [view, setView] = useState('client');
    const [bookingRestoreOrderNsu, setBookingRestoreOrderNsu] = useState(() => readBookingRestoreOrderNsu());
    const clearBookingRestore = useCallback(() => {
        setBookingRestoreOrderNsu('');
    }, []);

    const [showPassword, setShowPassword] = useState(false);

    const readStoredAdminToken = () => {
        try {
            return sessionStorage.getItem(ADMIN_TOKEN_STORAGE_KEY) || '';
        } catch {
            return '';
        }
    };

    const [adminToken, setAdminToken] = useState(readStoredAdminToken);
    
    const [appointments, setAppointments] = useState([]);
    const [clients, setClients] = useState([]);
    const [blockedSlots, setBlockedSlots] = useState([]);
    const [adminWhatsApp, setAdminWhatsApp] = useState('');

    const handleAdminLoginSuccess = (token) => {
        try {
            sessionStorage.setItem(ADMIN_TOKEN_STORAGE_KEY, token);
        } catch (_) { /* ignore */ }
        setAdminToken(token);
        setShowPassword(false);
        setView('admin');
    };

    const handleAdminSessionInvalid = useCallback(() => {
        try {
            sessionStorage.removeItem(ADMIN_TOKEN_STORAGE_KEY);
        } catch (_) { /* ignore */ }
        setAdminToken('');
        setShowPassword(true);
    }, []);

    const refreshData = useCallback(async () => {
        const blkHeaders = adminToken ? { Authorization: `Bearer ${adminToken}` } : {};
        try {
            const resAps = await fetch(`${API_BASE_URL}/appointments`);
            if (resAps.ok) {
                const aps = await resAps.json();
                if (Array.isArray(aps)) {
                    setAppointments(aps);
                }
            }

            const resClis = await fetch(`${API_BASE_URL}/clients`);
            if (resClis.ok) {
                const cls = await resClis.json();
                if (Array.isArray(cls)) {
                    setClients(cls);
                }
            }

            const resBlk = await fetch(`${API_BASE_URL}/admin/blocked-slots`, { headers: blkHeaders });
            if (resBlk.status === 401) {
                if (adminToken) {
                    try {
                        sessionStorage.removeItem(ADMIN_TOKEN_STORAGE_KEY);
                    } catch (_) { /* ignore */ }
                    setAdminToken('');
                }
                setBlockedSlots([]);
            } else if (resBlk.ok) {
                const blk = await resBlk.json();
                setBlockedSlots(Array.isArray(blk) ? blk : []);
            } else {
                setBlockedSlots([]);
            }
        } catch(e) { 
            console.error(e);
        }
    }, [adminToken]);

    useEffect(() => {
        refreshData();
        (async () => {
            try {
                const res = await fetch(`${API_BASE_URL}/config/public`);
                if (res.ok) {
                    const j = await res.json();
                    setAdminWhatsApp(String(j.adminWhatsApp || '').replace(/\D/g, ''));
                }
            } catch (_) { /* ignore */ }
        })();

        const intervalId = setInterval(refreshData, 10000);
        return () => clearInterval(intervalId);
    }, [refreshData]);

    useEffect(() => {
        if (bookingRestoreOrderNsu) {
            setView('client');
        }
    }, [bookingRestoreOrderNsu]);

    const navigateTo = (tView) => {
        if (tView === 'admin' && view !== 'admin') {
            const t = readStoredAdminToken();
            if (t) {
                setAdminToken(t);
                setView('admin');
            } else {
                setShowPassword(true);
            }
        } else {
            setView(tView);
        }
    };

    return (
        <div className="container">
            <Header view={view} setView={navigateTo} />
            {showPassword && <PasswordModal onSuccess={handleAdminLoginSuccess} onCancel={() => setShowPassword(false)} />}
            <main>
                {view === 'client' && (
                    <ClientArea
                        appointments={appointments}
                        refreshData={refreshData}
                        clients={clients}
                        adminWhatsApp={adminWhatsApp}
                        blockedSlots={blockedSlots}
                        bookingRestoreOrderNsu={bookingRestoreOrderNsu}
                        onBookingRestoreConsumed={clearBookingRestore}
                    />
                )}
                {view === 'my_apps' && <MyAppointmentsArea appointments={appointments} refreshData={refreshData} clients={clients} setView={setView} />}
                {view === 'admin' && (
                    <AdminArea
                        appointments={appointments}
                        refreshData={refreshData}
                        clients={clients}
                        blockedSlots={blockedSlots}
                        adminToken={adminToken}
                        onAdminSessionInvalid={handleAdminSessionInvalid}
                    />
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
