                          ...completedAppInfo.app,
                          ...refreshedApp,
                          paymentUrl: refreshedApp.paymentUrl || completedAppInfo.app.paymentUrl
                      }
                    : completedAppInfo.app;
                const isConfirmed = liveApp.status === 'confirmed';
                const isCancelled = liveApp.status === 'cancelled';
                const isPending = liveApp.status === 'pending_payment';
                const dateStr = new Date(liveApp.date + 'T12:00:00').toLocaleDateString('pt-BR');

                const formatBRL = (value) => {
                    if (value === null || value === undefined || value === '') return null;
                    const n = Number(value);
                    if (!Number.isFinite(n)) return null;
                    return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                };

                const { scheduleHint: step4ScheduleHint } = formatAgendaServiceSummary(liveApp, catalogMetaLookupList);
                const lineItemsStep4 =
                    Array.isArray(liveApp?.serviceLineItems) && liveApp.serviceLineItems.length > 0
                        ? liveApp.serviceLineItems
                        : buildLineItemsFromAppointmentApp(liveApp, catalogMetaLookupList);
                const svcTotalFromApi =
                    liveApp?.paymentSummary?.totalServicePrice != null
                        ? Number(liveApp.paymentSummary.totalServicePrice)
                        : lineItemsStep4.reduce((s, li) => s + Number(li.price || 0), 0);
                const servicePriceBRL = formatBRL(
                    Number.isFinite(svcTotalFromApi) && svcTotalFromApi > 0
                        ? svcTotalFromApi
                        : completedAppInfo?.service?.price
                );

                const paymentType = liveApp?.paymentType || null;
                const paymentTypeLc = String(paymentType || '').toLowerCase();
                const apiPm = String(liveApp?.paymentMethod || '').toLowerCase();
                const amountChargedBRL = formatBRL(liveApp?.amountCharged);

                const svcPriceNum = Number(
                    liveApp?.paymentSummary?.totalServicePrice != null
                        ? liveApp.paymentSummary.totalServicePrice
                        : completedAppInfo?.service?.price
                );
                const isLocalBookingUi = apiPm === 'local' || paymentTypeLc === 'local';
                const checkoutIntegral =
                    !isLocalBookingUi &&
                    (apiPm === 'online' || paymentTypeLc === 'full' || isProcedurePriceAtOrBelowSignal(svcPriceNum));
                const dueNowDisplayBRL = amountChargedBRL || servicePriceBRL;

                return (
                <div className="booking-section step-container" style={{textAlign: 'center'}}>
                    {isPending && (
                        <>
                            <i className="fas fa-clock" style={{fontSize: '50px', color: '#f59e0b', margin: '0 auto 15px', display: 'block'}}></i>
                            <h2 style={{color: '#d97706', marginBottom: '10px'}}>Aguardando pagamento online</h2>
                            <p style={{color: 'var(--text-muted)', marginBottom: '20px'}}>
                                {checkoutIntegral ? (
                                    <>
                                        Finalize o pagamento do <strong>valor total</strong> dos procedimentos ({dueNowDisplayBRL || '—'}) via{' '}
                                        <strong>InfinitePay</strong>. Em geral o sistema libera o horário após cerca de <strong>15 minutos</strong> sem confirmação
                                        do pagamento.
                                    </>
                                ) : (
                                    <>
                                        Finalize o pagamento indicado ({dueNowDisplayBRL || '—'}) via <strong>InfinitePay</strong> dentro dos próximos 15
                                        minutos.
                                    </>
                                )}
                            </p>
                        </>
                    )}
                    {isConfirmed && (
                        <>
                            <i className="fas fa-check-circle" style={{fontSize: '50px', color: '#10b981', margin: '0 auto 15px', display: 'block'}}></i>
                            <h2 style={{color: '#059669', marginBottom: '10px'}}>Agendamento Confirmado!</h2>
                            <p style={{color: 'var(--text-muted)', marginBottom: '20px'}}>
                                {isLocalBookingUi
                                    ? 'Seu horário está garantido. O pagamento será feito presencialmente no dia do atendimento.'
                                    : 'Pagamento aprovado. Seu agendamento foi confirmado com sucesso.'}
                            </p>
                        </>
                    )}
                    {isCancelled && (
                        <>
                            <i className="fas fa-times-circle" style={{fontSize: '50px', color: '#ef4444', margin: '0 auto 15px', display: 'block'}}></i>
                            <h2 style={{color: '#dc2626', marginBottom: '10px'}}>Agendamento Cancelado</h2>
                            <p style={{color: 'var(--text-muted)', marginBottom: '20px'}}>O tempo limite esgotou ou houve falha no pagamento.</p>
                        </>
                    )}
                    
                    <div style={{background: '#fcfcfc', border: '1px solid #ddd', padding: '20px', borderRadius: '8px', textAlign: 'left', marginBottom: '25px', display: 'inline-block', maxWidth: '400px', width: '100%'}}>
                        <strong>{completedAppInfo.client.name}</strong><br/>
                        {lineItemsStep4.length > 0 ? (
                            <div style={{ marginBottom: '10px' }}>
                                <div style={{ fontSize: '13px', fontWeight: 700, color: 'var(--text-muted)', marginBottom: '6px' }}>Serviços</div>
                                {lineItemsStep4.map((li) => (
                                    <div key={li.id} style={{ fontSize: '14px', marginBottom: '4px' }}>
                                        • {(li.name && String(li.name)) || li.id} — {formatBRL(Number(li.price || 0))}
                                    </div>
                                ))}
                                <div style={{ fontSize: '15px', fontWeight: 700, marginTop: '8px', color: 'var(--text-dark)' }}>
                                    Total: {formatBRL(svcTotalFromApi)}
                                </div>
                                <div style={{ fontSize: '14px', marginTop: '10px', color: 'var(--text-dark)' }}>
                                    <strong>Forma de pagamento:</strong>{' '}
                                    {isLocalBookingUi
                                        ? 'Pagamento no local'
                                        : checkoutIntegral
                                          ? 'Pagar agora via InfinitePay (valor total)'
                                          : 'Conforme registro do agendamento'}
                                </div>
                            </div>
                        ) : (
                            <>
                                {getClientServiceCardTitle(completedAppInfo.service)} (
                                {formatBRL(Number(completedAppInfo.service?.price || 0))})<br/>
                            </>
                        )}
                        {step4ScheduleHint ? (
                            <div style={{ marginTop: '8px', fontSize: '14px', lineHeight: 1.5 }}>
                                <strong>Horários:</strong> {step4ScheduleHint}
                            </div>
                        ) : (
                            <>
                                Para: {dateStr} às {liveApp.time}
                                <br />
                            </>
                        )}
                        <div style={{marginTop: '10px'}}>
                            {liveApp.location && <span style={{display: 'block', marginBottom: '8px'}}><strong>Endereço Cliente:</strong><br/>{liveApp.location}</span>}
                            <div style={{display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: '8px'}}>
                                <span><strong>Local do atendimento:</strong><br/>Ateliê da Pele — Rua Rio Jaguaribe, nº 274</span>
                                <a href="https://www.google.com/maps/search/?api=1&query=Ateliê+da+Pele+Rua+Rio+Jaguaribe+274" target="_blank" rel="noreferrer" style={{display: 'inline-flex', alignItems: 'center', gap: '5px', fontSize: '13px', color: '#0ea5e9', textDecoration: 'none', background: '#f0f9ff', padding: '6px 12px', border: '1px solid #bae6fd', borderRadius: '20px'}}>
                                    <i className="fas fa-map-marked-alt"></i> Abrir no Google Maps
                                </a>
                            </div>
                        </div>
                    </div>

                    <div style={{ textAlign: 'center', marginBottom: '18px' }}>
                        <AtelieWhatsAppDiscreteLink adminWhatsApp={adminWhatsApp} />
                    </div>

                    {isPending && (
                        <div style={{marginBottom: '30px', background: '#e0f2fe', padding: '20px', borderRadius: '8px', maxWidth: '350px', margin: '0 auto 30px', width: '100%', boxSizing: 'border-box'}}>
                            <p style={{fontWeight: 'bold', fontSize: '18px', color: '#0369a1', marginBottom: '15px'}}>
                                Valor a pagar agora: {dueNowDisplayBRL || '—'}
                                {checkoutIntegral && (
                                    <span style={{ display: 'block', fontSize: '12px', fontWeight: 600, marginTop: '6px', opacity: 0.9 }}>
                                        (valor total dos procedimentos — InfinitePay)
                                    </span>
                                )}
                            </p>
                            <div
                                role="note"
                                style={{
                                    fontSize: '12px',
                                    lineHeight: 1.45,
                                    color: '#334155',
                                    background: 'rgba(255,255,255,0.75)',
                                    border: '1px solid #bae6fd',
                                    borderRadius: '8px',
                                    padding: '10px 12px',
                                    marginBottom: '14px',
                                    textAlign: 'left',
                                    maxWidth: '100%',
                                    boxSizing: 'border-box',
                                    wordBreak: 'break-word'
                                }}
                            >
                                <span style={{ display: 'block', color: '#0c4a6e', fontWeight: 600, marginBottom: '4px' }}>Informação</span>
                                <span style={{ display: 'block' }}>
                                    Política de cancelamento: pagamentos online ou valores já quitados poderão seguir reembolso integral mediante solicitação com até 48 horas de antecedência, conforme política do Ateliê. Após esse prazo, o valor poderá ser convertido em crédito para um novo agendamento, conforme disponibilidade.
                                </span>
                            </div>
                            <a href={liveApp.paymentUrl} target="_blank" rel="noreferrer" className="btn-submit pay-btn" style={{width: '100%', display: 'block', textDecoration: 'none', padding: '15px', boxSizing: 'border-box'}}>
                                <i className="fas fa-money-bill-wave"></i> Pagar agora via InfinitePay
                            </a>
                        </div>
                    )}

                    <div style={{display: 'flex', flexDirection: 'column', gap: '15px', alignItems: 'center'}}>
                        <button className="btn-admin" style={{margin: '0 auto'}} onClick={() => {
                            setStep(1);
                            setBookingData({date:'', time:'', notes:'', location:''});
                            setScheduleMode(null);
                            setPerServicePlan([]);
                            setSelectedServiceIds([]);
                            setServiceDetailOpenId(null);
                            setSelectedClient(null);
                            setCheckedTerms(false);
                            setCompletedAppInfo(null);
                        }}>Fazer novo ou Voltar ao início</button>
                    </div>
                </div>
                );
            })()}
        </div>
        {step !== 4 && <AtelieWhatsAppFloatingButton adminWhatsApp={adminWhatsApp} />}
        </>
    );
};


// ============== ÁREA PROFISSIONAL e "MEUS AGENDAMENTOS" iguais ==============

const AdminArea = ({
    appointments,
    refreshData,
    clients,
    blockedSlots,
    blockedFullDays,
    adminToken,
    onAdminSessionInvalid,
    onExitAdmin,
    catalogServicesClient
}) => {
    const [adminPanelRefreshing, setAdminPanelRefreshing] = useState(false);
    const [adminSidebarCollapsed, setAdminSidebarCollapsed] = useState(false);
    const [adminView, setAdminView] = useState('agenda'); // agenda | clients | report | blocks | campaigns | services
    const [filter, setFilter] = useState('today'); // today | next | all
    const [filterDate, setFilterDate] = useState('');
    const [agendaClientSearch, setAgendaClientSearch] = useState('');
    const [blockManageDate, setBlockManageDate] = useState(() => getLocalTodayStr());
    const [reportStartDate, setReportStartDate] = useState('');
    const [reportEndDate, setReportEndDate] = useState('');
    const [reportData, setReportData] = useState(null);
    const [reportLoading, setReportLoading] = useState(false);
    const [reportError, setReportError] = useState('');
    const [clientEditModal, setClientEditModal] = useState(null);
    const [clientEditError, setClientEditError] = useState('');
    const [clientEditSaving, setClientEditSaving] = useState(false);
    const [manualPayModal, setManualPayModal] = useState(null); // { id, clientName, serviceName, total, paymentType, paidAmount, note, saving, error }
    const [settleBalanceModal, setSettleBalanceModal] = useState(null); // { id, clientName, serviceName, total, paidSoFar, remaining, note, saving, error }
    const [confirmLocalPayModal, setConfirmLocalPayModal] = useState(null); // { id, clientName, serviceName, total, remaining, note, saving, error }
    const [servicesAdminList, setServicesAdminList] = useState([]);
    const [servicesAdminLoading, setServicesAdminLoading] = useState(false);
    const [servicesAdminError, setServicesAdminError] = useState('');
    const [serviceModal, setServiceModal] = useState(null);
    const [adminCampaigns, setAdminCampaigns] = useState([]);
    const [adminCampaignsLoading, setAdminCampaignsLoading] = useState(false);
    const [adminCampaignsError, setAdminCampaignsError] = useState('');
    const [campaignModal, setCampaignModal] = useState(null);
    /** Mobile ≤768px: Serviços e Campanhas em cards em vez de tabela. */
    const [adminCatalogCardsLayout, setAdminCatalogCardsLayout] = useState(() =>
        typeof window !== 'undefined' && window.matchMedia
            ? window.matchMedia('(max-width: 768px)').matches
            : false
    );

    const todayStr = getLocalTodayStr();

    useEffect(() => {
        if (typeof window === 'undefined' || !window.matchMedia) return undefined;
        const mq = window.matchMedia('(max-width: 768px)');
        const sync = () => setAdminCatalogCardsLayout(!!mq.matches);
        sync();
        if (mq.addEventListener) mq.addEventListener('change', sync);
        else mq.addListener(sync);
        window.addEventListener('resize', sync);
        window.addEventListener('orientationchange', sync);
        return () => {
            if (mq.removeEventListener) mq.removeEventListener('change', sync);
            else mq.removeListener(sync);
            window.removeEventListener('resize', sync);
            window.removeEventListener('orientationchange', sync);
        };
    }, []);

    useEffect(() => {
        if (adminView !== 'services' && adminView !== 'campaigns') return;
        if (typeof window === 'undefined' || !window.matchMedia) return;
        setAdminCatalogCardsLayout(window.matchMedia('(max-width: 768px)').matches);
    }, [adminView]);

    const adminFetch = async (url, options = {}) => {
        const headers = { ...(options.headers || {}) };
        if (adminToken) headers.Authorization = `Bearer ${adminToken}`;
        const res = await fetch(url, { ...options, headers });
        if (res.status === 401 && typeof onAdminSessionInvalid === 'function') {
            onAdminSessionInvalid();
        }
        return res;
    };

    const loadAdminServices = async () => {
        setServicesAdminLoading(true);
        setServicesAdminError('');
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/services`);
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setServicesAdminError(data.error || 'Não foi possível carregar os serviços.');
                setServicesAdminList([]);
                return [];
            }
            const list = Array.isArray(data) ? data : [];
            setServicesAdminList(list);
            return list;
        } catch (e) {
            setServicesAdminError(e.message || 'Erro de rede ao carregar serviços.');
            setServicesAdminList([]);
            return [];
        } finally {
            setServicesAdminLoading(false);
        }
    };

    useEffect(() => {
        if (adminView === 'services') {
            loadAdminServices();
        }
    }, [adminView, adminToken]);

    const loadAdminCampaigns = async () => {
        setAdminCampaignsLoading(true);
        setAdminCampaignsError('');
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/campaigns`);
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setAdminCampaignsError(data.error || 'Não foi possível carregar as campanhas.');
                setAdminCampaigns([]);
                return;
            }
            setAdminCampaigns(Array.isArray(data) ? data : []);
        } catch (e) {
            setAdminCampaignsError(e.message || 'Erro de rede ao carregar campanhas.');
            setAdminCampaigns([]);
        } finally {
            setAdminCampaignsLoading(false);
        }
    };

    useEffect(() => {
        if (adminView === 'campaigns') {
            loadAdminCampaigns();
            loadAdminServices();
        }
    }, [adminView, adminToken]);

    /** Campanhas: `active` pode vir como string do JSON legado — evita "Inativar" com campanha já inativa. */
    const isAdminCampaignRowActive = (c) => {
        if (!c) return false;
        const v = c.active;
        if (v === true || v === 1) return true;
        if (v === false || v === 0 || v == null) return false;
        const s = String(v).trim().toLowerCase();
        if (s === 'true' || s === '1' || s === 't' || s === 'on') return true;
        if (s === 'false' || s === '0' || s === 'f' || s === 'off' || s === '') return false;
        return Boolean(v);
    };

    const openEditClient = (c) => {
        setClientEditError('');
        setClientEditModal({
            id: c.id,
            name: c.name || '',
            phone: c.phone || '',
            address: c.address || '',
            email: String(c.email || '').trim()
        });
    };

    const saveClientEdit = async () => {
        if (!clientEditModal) return;
        setClientEditError('');
        const em = String(clientEditModal.email || '').trim().toLowerCase();
        if (!isValidEmailFormat(em)) {
            setClientEditError('Informe um e-mail válido.');
            return;
        }
        const cleanPhone = String(clientEditModal.phone || '').replace(/\D/g, '');
        if (!cleanPhone) {
            setClientEditError('Telefone inválido.');
            return;
        }
        if (!(clientEditModal.name || '').trim()) {
            setClientEditError('Nome é obrigatório.');
            return;
        }
        setClientEditSaving(true);
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/clients/${encodeURIComponent(clientEditModal.id)}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: (clientEditModal.name || '').trim(),
                    phone: cleanPhone,
                    address: (clientEditModal.address || '').trim(),
                    email: em
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setClientEditError(data.error || 'Não foi possível salvar.');
                return;
            }
            setClientEditModal(null);
            await refreshData();
        } catch {
            setClientEditError('Falha de rede ao salvar.');
        } finally {
            setClientEditSaving(false);
        }
    };

    const handleDeleteClientRecord = async (c) => {
        if (!window.confirm(`Remover o cadastro de "${(c.name || '').trim() || 'esta pessoa'}"? Esta ação não pode ser desfeita.`)) return;
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/clients/${encodeURIComponent(c.id)}`, { method: 'DELETE' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                alert(data.error || 'Não foi possível remover.');
                return;
            }
            await refreshData();
        } catch {
            alert('Falha de rede ao remover.');
        }
    };

    const formatBRL = (value) => {
        const n = Number(value || 0);
        return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    const sortedApps = useMemo(() => {
        return [...(appointments || [])].sort((a, b) => {
            const da = a.date || '';
            const db = b.date || '';
            if (da !== db) return da.localeCompare(db);
            return (parseTimeToMinutes(a.time) ?? 0) - (parseTimeToMinutes(b.time) ?? 0);
        });
    }, [appointments]);

    const adminCatalogLookup = useMemo(() => {
        if (Array.isArray(catalogServicesClient) && catalogServicesClient.length > 0) {
            return catalogServicesClient;
        }
        return null;
    }, [catalogServicesClient]);

    const adminBlockSlots = useMemo(
        () =>
            generateTimeSlots(
                blockManageDate,
                appointments,
                blockedSlots || [],
                blockedFullDays || [],
                [],
                adminCatalogLookup
            ),
        [blockManageDate, appointments, blockedSlots, blockedFullDays, adminCatalogLookup]
    );

    const filteredApps = useMemo(() => {
        const base = sortedApps;

        let list;
        if (filterDate) {
            list = base.filter((app) => (app.date || '') === filterDate);
        } else if (filter === 'today') {
            list = base.filter((app) => (app.date || '') === todayStr);
        } else if (filter === 'next') {
            list = base.filter((app) => (app.date || '') > todayStr);
        } else {
            list = base;
        }

        const needle = String(agendaClientSearch || '').trim().toLowerCase();
        if (!needle) return list;

        return list.filter((app) => {
            const name = String(app.clientName || app.client_name || '').trim().toLowerCase();
            return name.includes(needle);
        });
    }, [sortedApps, filter, filterDate, todayStr, agendaClientSearch]);

    const handleDelete = async (appointmentId) => {
        if (!appointmentId) return;
        if (!window.confirm('Tem certeza que deseja apagar este agendamento? Esta ação não pode ser desfeita.')) return;

        try {
            const res = await adminFetch(`${API_BASE_URL}/appointments/${appointmentId}`, { method: 'DELETE' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Erro ao apagar agendamento.');
            await refreshData();
        } catch (e) {
            alert(e.message || 'Erro ao apagar agendamento.');
        }
    };

    const handleCancelByAdmin = async (appointmentId) => {
        if (!appointmentId) return;
        const reason = window.prompt('Motivo do cancelamento (opcional):', 'Cancelado pela profissional');
        if (reason === null) return;

        try {
            const res = await adminFetch(`${API_BASE_URL}/appointments/${appointmentId}/cancel`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cancelledBy: 'admin',
                    cancelReason: (reason || '').trim() || 'Cancelado pela profissional'
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Erro ao cancelar agendamento.');
            await refreshData();
        } catch (e) {
            alert(e.message || 'Erro ao cancelar agendamento.');
        }
    };

    const openManualPayment = (app, serviceName, servicePrice) => {
        if (!app || !app.id) return;
        const clientName = app.clientName || app.client_name || 'Cliente';
        const total = (typeof servicePrice === 'number' && Number.isFinite(servicePrice)) ? servicePrice : null;
        const ptApp = String(app.paymentType || app.payment_type || '').trim().toLowerCase();
        const defaultType =
            String(app.status || '').trim() === 'pending_payment' && ptApp === 'full' ? 'full' : 'partial';
        setManualPayModal({
            id: app.id,
            clientName,
            serviceName: serviceName || 'Serviço',
            total,
            paymentType: defaultType,
            paidAmount: '',
            note: '',
            saving: false,
            error: ''
        });
    };

    const submitManualPayment = async () => {
        if (!manualPayModal || !manualPayModal.id) return;
        const type = String(manualPayModal.paymentType || '').trim().toLowerCase();
        const paidStr = String(manualPayModal.paidAmount || '').replace(',', '.').trim();
        const paidNum = paidStr ? Number(paidStr) : null;

        if (!['partial', 'full'].includes(type)) {
            setManualPayModal((m) => ({ ...m, error: 'Selecione o tipo de pagamento.' }));
            return;
        }

        if (type === 'partial') {
            if (paidNum == null || !Number.isFinite(paidNum) || paidNum <= 0) {
                setManualPayModal((m) => ({
                    ...m,
                    error: 'Informe um valor pago válido para registro histórico de valor parcial.'
                }));
                return;
            }
        }

        const summaryLines = [
            `Confirmar pagamento?`,
            ``,
            `Agendamento: ${manualPayModal.clientName} — ${manualPayModal.serviceName}`,
            `Tipo: ${type === 'full' ? 'integral (online / total)' : 'histórico de valor parcial'}`
        ];
        if (type === 'partial') summaryLines.push(`Valor pago: R$ ${paidNum.toFixed(2).replace('.', ',')}`);
        if ((manualPayModal.note || '').trim()) summaryLines.push(`Obs.: ${(manualPayModal.note || '').trim()}`);

        if (!window.confirm(summaryLines.join('\n'))) return;

        setManualPayModal((m) => ({ ...m, saving: true, error: '' }));
        try {
            const body = {
                paymentType: type,
                note: (manualPayModal.note || '').trim() || undefined
            };
            if (type === 'partial') body.paidAmount = paidNum;

            const res = await adminFetch(`${API_BASE_URL}/admin/appointments/${encodeURIComponent(manualPayModal.id)}/manual-payment`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Erro ao confirmar pagamento.');

            setManualPayModal(null);
            await refreshData();
        } catch (e) {
            setManualPayModal((m) => ({ ...m, saving: false, error: e.message || 'Erro ao confirmar pagamento.' }));
        }
    };

    const canConfirmLocalPaymentReceived = (app) => {
        if (!app) return false;
        const st = String(app.status || '').trim();
        if (st !== 'confirmed' && st !== 'completed') return false;
        const pt = String(app.paymentType || app.payment_type || '').trim().toLowerCase();
        const pm = String(app.paymentMethod || '').trim().toLowerCase();
        if (pt !== 'local' && pm !== 'local') return false;
        const rem = Number(app.remainingAmount ?? app.remaining_amount);
        return Number.isFinite(rem) && rem > 0.005;
    };

        const remaining = Number(app.remainingAmount ?? app.remaining_amount);
        const total = (typeof servicePrice === 'number' && Number.isFinite(servicePrice)) ? servicePrice : null;
        setConfirmLocalPayModal({
            id: app.id,
            clientName: app.clientName || app.client_name || 'Cliente',
            serviceName: serviceName || 'Serviço',
            total,
            remaining: Number.isFinite(remaining) ? remaining : null,
            note: '',
            saving: false,
            error: ''
        });
    };

        if (!confirmLocalPayModal || !confirmLocalPayModal.id || confirmLocalPayModal.saving) return;
        const lines = [
            'Confirmar recebimento presencial?',
            '',
            `${confirmLocalPayModal.clientName} — ${confirmLocalPayModal.serviceName}`,
            confirmLocalPayModal.remaining != null && Number.isFinite(confirmLocalPayModal.remaining)
                ? `Valor a registrar como recebido: R$ ${confirmLocalPayModal.remaining.toFixed(2).replace('.', ',')}`
                : ''
        ].filter(Boolean);
        if ((confirmLocalPayModal.note || '').trim()) lines.push(`Obs.: ${(confirmLocalPayModal.note || '').trim()}`);
        if (!window.confirm(lines.join('\n'))) return;

        setConfirmLocalPayModal((m) => ({ ...m, saving: true, error: '' }));
        try {
            const res = await adminFetch(
                `${API_BASE_URL}/admin/appointments/${encodeURIComponent(confirmLocalPayModal.id)}/confirm-local-payment-received`,
                {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ note: (confirmLocalPayModal.note || '').trim() || undefined })
                }
            );
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Erro ao registrar recebimento no local.');
            setConfirmLocalPayModal(null);
            await refreshData();
        } catch (e) {
            setConfirmLocalPayModal((m) => ({ ...m, saving: false, error: e.message || 'Erro ao registrar recebimento no local.' }));
        }
    };

    const canSettleRemainingBalance = (app) => {

        if (st !== 'confirmed' && st !== 'completed') return false;
        const pt = String(app.paymentType || app.payment_type || '').trim().toLowerCase();

                                cursor:
                                    slot.isPast || slot.hasAppointmentAtTime
                                        ? 'default'
                                        : slot.isBlockedManual || canTryBlock
                                            ? 'pointer'
                                            : 'default',
                                borderColor: slot.isBlockedManual ? '#c4b5fd' : undefined,
                                background: slot.isBlockedManual ? '#f5f3ff' : undefined
                            }}
                            onClick={() => {
                                if (slot.isPast || slot.hasAppointmentAtTime) return;
                                if (slot.isBlockedManual) {
                                    if (blockRow && blockRow.id != null) handleAdminUnblockSlot(blockRow.id);
                                    return;
                                }
                                if (canTryBlock) handleAdminBlockSlot(slot.time);
                            }}
                        >
                            <span style={{ fontWeight: 800, fontSize: '14px' }}>{slot.time}</span>
                            <span
                                style={{
                                    fontSize: '10px',
                                    fontWeight: 700,
                                    color: slot.isBlockedManual ? '#5b21b6' : slot.hasAppointmentAtTime ? '#0369a1' : '#64748b',
                                    textTransform: 'uppercase',
                                    letterSpacing: '0.3px'
                                }}
                            >
                                {label}
                            </span>
                        </div>
                    );
                })}
            </div>
        </div>
    );

    const handleAdminPanelRefresh = async () => {
        setAdminPanelRefreshing(true);
        try {
            await refreshData();
            if (adminView === 'services') {
                await loadAdminServices();
            }
            if (adminView === 'campaigns') {
                await loadAdminCampaigns();
                await loadAdminServices();
            }
        } finally {
            setAdminPanelRefreshing(false);
        }
    };

    const isoToDateInputValue = (iso) => {
        if (!iso) return '';
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return '';
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    };

    /** Início do dia local → ISO para `valid_from`. `undefined` = data inválida; `null` = vazio. */
    const dateInputToStartOfDayIsoOrNull = (dateStr) => {
        if (!dateStr || !String(dateStr).trim()) return null;
        const p = String(dateStr).trim().split('-');
        if (p.length !== 3) return undefined;
        const y = Number(p[0]);
        const mo = Number(p[1]);
        const da = Number(p[2]);
        if (!Number.isFinite(y) || !Number.isFinite(mo) || !Number.isFinite(da)) return undefined;
        const dt = new Date(y, mo - 1, da, 0, 0, 0, 0);
        if (Number.isNaN(dt.getTime())) return undefined;
        return dt.toISOString();
    };

    /** Fim do dia local → ISO para `valid_to`. */
    const dateInputToEndOfDayIsoOrNull = (dateStr) => {
        if (!dateStr || !String(dateStr).trim()) return null;
        const p = String(dateStr).trim().split('-');
        if (p.length !== 3) return undefined;
        const y = Number(p[0]);
        const mo = Number(p[1]);
        const da = Number(p[2]);
        if (!Number.isFinite(y) || !Number.isFinite(mo) || !Number.isFinite(da)) return undefined;
        const dt = new Date(y, mo - 1, da, 23, 59, 59, 999);
        if (Number.isNaN(dt.getTime())) return undefined;
        return dt.toISOString();
    };

    const formatCampaignValidityShort = (vf, vt) => {
        if (!vf && !vt) return '—';
        try {
            const fmt = (iso) =>
                iso
                    ? new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' })
                    : '…';
            return `${fmt(vf)} → ${fmt(vt)}`;
        } catch (_) {
            return '—';
        }
    };

    const openCreateCampaign = async () => {
        await loadAdminServices();
        setCampaignModal({
            mode: 'create',
            name: '',
            validFromStr: '',
            validToStr: '',
            category: 'Campanhas',
            assignIds: [],
            savingMeta: false,
            error: ''
        });
    };

    const openEditCampaign = async (c) => {
        const list = await loadAdminServices();
        const linked = (list || []).filter((s) => s.promotionalCampaign === c.id).map((s) => s.id);
        setCampaignModal({
            mode: 'edit',
            id: c.id,
            name: c.name || '',
            validFromStr: c.validFrom ? isoToDateInputValue(c.validFrom) : '',
            validToStr: c.validTo ? isoToDateInputValue(c.validTo) : '',
            category: c.category || 'Campanhas',
            assignIds: linked,
            savingMeta: false,
            error: ''
        });
    };

    const patchCampaignModal = (k, v) => {
        setCampaignModal((m) => (m ? { ...m, [k]: v, error: '' } : m));
    };

    const saveCampaignMeta = async () => {
        if (!campaignModal) return;
        const name = String(campaignModal.name || '').trim();
        if (!name) {
            setCampaignModal((m) => (m ? { ...m, error: 'Informe o nome da campanha.' } : m));
            return;
        }
        const vf = dateInputToStartOfDayIsoOrNull(campaignModal.validFromStr);
        const vt = dateInputToEndOfDayIsoOrNull(campaignModal.validToStr);
        if (campaignModal.validFromStr && String(campaignModal.validFromStr).trim() && vf === undefined) {
            setCampaignModal((m) => (m ? { ...m, error: 'Data inicial inválida.' } : m));
            return;
        }
        if (campaignModal.validToStr && String(campaignModal.validToStr).trim() && vt === undefined) {
            setCampaignModal((m) => (m ? { ...m, error: 'Data final inválida.' } : m));
            return;
        }
        if (vf && vt && new Date(vf).getTime() > new Date(vt).getTime()) {
            setCampaignModal((m) => (m ? { ...m, error: 'A data inicial deve ser anterior ou igual à data final.' } : m));
            return;
        }
        const ids = [...new Set((campaignModal.assignIds || []).map((x) => String(x || '').trim()).filter(Boolean))];
        if (ids.length === 0) {
            setCampaignModal((m) => (m ? { ...m, error: 'Selecione pelo menos um procedimento para a campanha.' } : m));
            return;
        }
        setCampaignModal((m) => (m ? { ...m, savingMeta: true, error: '' } : m));
        try {
            const bodyBase = {
                name,
                validFrom: vf,
                validTo: vt,
                category: String(campaignModal.category || 'Campanhas').trim() || 'Campanhas',
                serviceIds: ids
            };
            const body =
                campaignModal.mode === 'create'
                    ? { ...bodyBase, description: '', active: true }
                    : bodyBase;
            let res;
            if (campaignModal.mode === 'create') {
                res = await adminFetch(`${API_BASE_URL}/admin/campaigns`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
            } else {
                res = await adminFetch(`${API_BASE_URL}/admin/campaigns/${encodeURIComponent(campaignModal.id)}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
            }
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setCampaignModal((m) => (m ? { ...m, savingMeta: false, error: data.error || 'Não foi possível salvar.' } : m));
                return;
            }
            setCampaignModal(null);
            await loadAdminCampaigns();
            await loadAdminServices();
            await refreshData();
        } catch (e) {
            setCampaignModal((m) => (m ? { ...m, savingMeta: false, error: 'Erro de rede.' } : m));
        }
    };

    const toggleAssignServiceId = (sid) => {
        setCampaignModal((m) => {
            if (!m) return m;
            const id = String(sid || '').trim();
            if (!id) return m;
            const cur = Array.isArray(m.assignIds) ? m.assignIds : [];
            const i = cur.indexOf(id);
            const next = i >= 0 ? cur.filter((x) => x !== id) : [...cur, id];
            return { ...m, assignIds: next, error: '' };
        });
    };

    const inactivateCampaign = async (c) => {
        if (!c || !c.id) return;
        if (
            !window.confirm(
                `Inativar a campanha «${c.name}»? Os pacotes deixam de aparecer para novas clientes; agendamentos antigos permanecem intactos.`
            )
        ) {
            return;
        }
        const res = await adminFetch(`${API_BASE_URL}/admin/campaigns/${encodeURIComponent(c.id)}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ active: false })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            alert(data.error || 'Não foi possível inativar.');
            return;
        }
        await loadAdminCampaigns();
        await loadAdminServices();
        await refreshData();
    };

    const activateCampaign = async (c) => {
        if (!c || !c.id) return;
        if (!window.confirm(`Reativar a campanha «${c.name}»? Os pacotes voltam a poder aparecer para novas clientes (conforme validade).`)) {
            return;
        }
        const res = await adminFetch(`${API_BASE_URL}/admin/campaigns/${encodeURIComponent(c.id)}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ active: true })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            alert(data.error || 'Não foi possível ativar.');
            return;
        }
        await loadAdminCampaigns();
        await loadAdminServices();
        await refreshData();
    };

    const deleteCampaign = async (c) => {
        if (!c || !c.id) return;
        if (!window.confirm('Tem certeza que deseja apagar esta campanha? Ela não aparecerá mais para novos clientes.')) return;
        try {
            let res = await adminFetch(`${API_BASE_URL}/admin/campaigns/${encodeURIComponent(c.id)}`, { method: 'DELETE' });
            if (!res.ok && res.status === 405) {
                res = await adminFetch(`${API_BASE_URL}/admin/campaigns/${encodeURIComponent(c.id)}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ archived: true })
                });
            }
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                alert(data.error || 'Não foi possível apagar.');
                return;
            }
            if (campaignModal && campaignModal.mode === 'edit' && campaignModal.id === c.id) {
                setCampaignModal(null);
            }
            await loadAdminCampaigns();
            await loadAdminServices();
            await refreshData();
        } catch (e) {
            alert('Erro de rede.');
        }
    };

    const renderCampaigns = () => {

            const n = Number(p);
            if (!Number.isFinite(n)) return '—';

        };
        const linkedPackagesTotal = (campaignId) => {

            for (const s of servicesAdminList || []) {

                const n = Number(s.price);
                if (Number.isFinite(n)) sum += n;

            return sum;
        };

        const cidPick = campaignModal && campaignModal.mode === 'edit' ? campaignModal.id : null;
        const assignableCampaignServices = (servicesAdminList || []).filter((s) => {
            if (!s) return false;
            if (s.isPromotionalPackage) {
                const pc = String(s.promotionalCampaign || '').trim();
                if (!cidPick) return true;
                return !pc || pc === cidPick;
            }
            return true;

        return (

                <div
                    style={{

                        flexWrap: 'wrap',
                        justifyContent: 'space-between',
                        gap: '12px',
                        alignItems: 'flex-start',
                        marginBottom: '16px'
                    }}
                >
                    <div style={{ minWidth: 0, flex: '1 1 220px' }}>

                            Agrupe <strong>pacotes promocionais</strong> do catálogo. <strong>Inativar</strong> ou <strong>Apagar</strong> oculta para novas
                            clientes; agendamentos antigos permanecem intactos.
                        </p>
                    </div>
                    <button type="button" className="btn-submit" onClick={openCreateCampaign}>
                        <i className="fas fa-plus" aria-hidden="true" /> Nova campanha
                    </button>
                </div>

                {adminCampaignsError ? <div className="alert alert-error" style={{ marginBottom: '12px' }}>{adminCampaignsError}</div> : null}

                {adminCampaignsLoading ? (
                    <p style={{ color: 'var(--text-muted)' }}>Carregando…</p>
                ) : adminCatalogCardsLayout ? (
                    <div className="admin-catalog-card-list">
                        {adminCampaigns.length === 0 ? (
                            <p className="admin-catalog-empty">
                                Nenhuma campanha cadastrada. Use «Nova campanha» para criar.
                            </p>
                        ) : (
                            adminCampaigns.map((c) => {
                                const total = linkedPackagesTotal(c.id);
                                const nPack = c.linkedCount != null ? Number(c.linkedCount) : 0;
                                const rowActive = isAdminCampaignRowActive(c);
                                return (
                                    <article key={c.id} className="admin-catalog-card">
                                        <h4 className="admin-catalog-card__title">{c.name}</h4>
                                        <div className="admin-catalog-card__field">
                                            <span className="admin-catalog-card__label">Categoria</span>
                                            <div className="admin-catalog-card__value">{c.category || 'Campanhas'}</div>
                                        </div>
                                        <div className="admin-catalog-card__field">
                                            <span className="admin-catalog-card__label">Valor</span>
                                            <div className="admin-catalog-card__value">{fmtMoney(total)}</div>
                                            {nPack > 0 ? (
                                                <div className="admin-catalog-card__sub">
                                                    {nPack} pacote{nPack !== 1 ? 's' : ''}
                                                </div>
                                            ) : null}
                                        </div>
                                        <div className="admin-catalog-card__field">
                                            <span className="admin-catalog-card__label">Validade</span>
                                            <div className="admin-catalog-card__value">{formatCampaignValidityShort(c.validFrom, c.validTo)}</div>
                                        </div>
                                        <div className="admin-catalog-card__field">
                                            <span className="admin-catalog-card__label">Status</span>
                                            <div className="admin-catalog-card__value">{rowActive ? 'Ativa' : 'Inativa'}</div>
                                        </div>
                                        <div className="admin-catalog-card__actions">
                                            <button
                                                type="button"
                                                className="admin-campaigns-action-btn admin-campaigns-action-btn--edit"
                                                onClick={() => openEditCampaign(c)}
                                            >
                                                Editar
                                            </button>
                                            {rowActive ? (
                                                <button
                                                    type="button"
                                                    className="admin-campaigns-action-btn admin-campaigns-action-btn--inativar"
                                                    onClick={() => inactivateCampaign(c)}
                                                >
                                                    Inativar
                                                </button>
                                            ) : (
                                                <button
                                                    type="button"
                                                    className="admin-campaigns-action-btn admin-campaigns-action-btn--ativar"
                                                    onClick={() => activateCampaign(c)}
                                                >
                                                    Ativar
                                                </button>
                                            )}
                                            <button
                                                type="button"
                                                className="admin-campaigns-action-btn admin-campaigns-action-btn--apagar admin-catalog-card__btn-apagar"
                                                onClick={() => deleteCampaign(c)}
                                            >
                                                Apagar
                                            </button>
                                        </div>
                                    </article>
                                );
                            })
                        )}
                    </div>
                ) : (
                    <div
                        className="admin-services-table-wrap"
                        style={{
                            overflowX: 'auto',
                            WebkitOverflowScrolling: 'touch',
                            borderRadius: '10px',
                            border: '1px solid var(--border-color)',
                            background: 'var(--card-bg)',
                            maxWidth: '100%'
                        }}
                    >
                        <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 'min(100%, 720px)' }}>
                            <thead>
                                <tr style={{ background: 'rgba(111, 76, 165, 0.08)', textAlign: 'left' }}>
                                    <th style={{ padding: '10px 12px', fontSize: '12px' }}>Nome</th>
                                    <th style={{ padding: '10px 12px', fontSize: '12px' }}>Categoria</th>
                                    <th style={{ padding: '10px 12px', fontSize: '12px' }}>Valor</th>
                                    <th style={{ padding: '10px 12px', fontSize: '12px' }}>Ativa</th>
                                    <th style={{ padding: '10px 12px', fontSize: '12px' }}>Validade</th>
                                    <th className="admin-campaigns-table-actions-col" style={{ padding: '10px 12px', fontSize: '12px' }}>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                {adminCampaigns.length === 0 ? (
                                    <tr>
                                        <td colSpan={6} style={{ padding: '14px 12px', color: 'var(--text-muted)', fontSize: '13px' }}>
                                            Nenhuma campanha cadastrada. Use «Nova campanha» para criar.
                                        </td>
                                    </tr>
                                ) : (
                                    adminCampaigns.map((c) => {
                                        const total = linkedPackagesTotal(c.id);
                                        const nPack = c.linkedCount != null ? Number(c.linkedCount) : 0;
                                        const rowActive = isAdminCampaignRowActive(c);
                                        return (
                                            <tr key={c.id} style={{ borderTop: '1px solid var(--border-color)' }}>
                                                <td
                                                    style={{
                                                        padding: '10px 12px',
                                                        fontSize: '13px',
                                                        wordBreak: 'normal',
                                                        overflowWrap: 'break-word'
                                                    }}
                                                >
                                                    <div style={{ fontWeight: 700 }}>{c.name}</div>
                                                </td>
                                                <td
                                                    style={{
                                                        padding: '10px 12px',
                                                        fontSize: '13px',
                                                        wordBreak: 'normal',
                                                        overflowWrap: 'break-word'
                                                    }}
                                                >
                                                    {c.category || 'Campanhas'}
                                                </td>
                                                <td style={{ padding: '10px 12px', fontSize: '13px', whiteSpace: 'nowrap', verticalAlign: 'top' }}>
                                                    <div>{fmtMoney(total)}</div>
                                                    {nPack > 0 ? (
                                                        <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginTop: '4px' }}>
                                                            {nPack} pacote{nPack !== 1 ? 's' : ''}
                                                        </div>
                                                    ) : null}
                                                </td>
                                                <td style={{ padding: '10px 12px', fontSize: '13px', whiteSpace: 'nowrap' }}>
                                                    {rowActive ? 'Sim' : 'Não'}
                                                </td>
                                                <td
                                                    style={{
                                                        padding: '10px 12px',
                                                        fontSize: '12px',
                                                        whiteSpace: 'nowrap',
                                                        color: 'var(--text-muted)',
                                                        verticalAlign: 'top'
                                                    }}
                                                >
                                                    {formatCampaignValidityShort(c.validFrom, c.validTo)}
                                                </td>
                                                <td className="admin-campaigns-actions-cell admin-campaigns-table-actions-col">
                                                    <div className="admin-campaigns-actions-row">
                                                        <button
                                                            type="button"
                                                            className="admin-campaigns-action-btn admin-campaigns-action-btn--edit"
                                                            onClick={() => openEditCampaign(c)}
                                                        >
                                                            Editar
                                                        </button>
                                                        {rowActive ? (
                                                            <button
                                                                type="button"
                                                                className="admin-campaigns-action-btn admin-campaigns-action-btn--inativar"
                                                                onClick={() => inactivateCampaign(c)}
                                                            >
                                                                Inativar
                                                            </button>
                                                        ) : (
                                                            <button
                                                                type="button"
                                                                className="admin-campaigns-action-btn admin-campaigns-action-btn--ativar"

                                                            >
                                                                Ativar
                                                            </button>

                                                        <button

                                                            Apagar

                                                </td>
                                            </tr>
                                        );

                            </tbody>
                        </table>
                    </div>
                )}

                {campaignModal ? (
                <div className="password-overlay" style={{ zIndex: 10070 }} role="dialog" aria-modal="true">
                    <div
                        className="password-modal"
                        style={{
                            maxWidth: '560px',
                            width: '100%',
                            textAlign: 'left',
                            maxHeight: '90vh',
                            overflowY: 'auto',
                            overflowX: 'hidden',
                            boxSizing: 'border-box'
                        }}
                    >
                        <h3 style={{ marginBottom: '12px', textAlign: 'center' }}>
                            {campaignModal.mode === 'create' ? 'Nova campanha' : 'Editar campanha'}
                        </h3>
                        <div className="form-group full-width">
                            <label className="form-label">Nome *</label>
                            <input
                                className="form-control"
                                style={{ minWidth: 0, width: '100%', boxSizing: 'border-box' }}
                                value={campaignModal.name}
                                onChange={(e) => patchCampaignModal('name', e.target.value)}
                            />
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">Categoria</label>
                            <input
                                className="form-control"
                                style={{ minWidth: 0, width: '100%', boxSizing: 'border-box' }}
                                value={campaignModal.category}
                                onChange={(e) => patchCampaignModal('category', e.target.value)}
                            />
                        </div>
                        <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap', marginBottom: '4px' }}>
                            <div className="form-group full-width" style={{ flex: '1 1 200px', minWidth: 0 }}>

                                <input
                                    className="form-control"
                                    type="date"
                                    style={{ minWidth: 0, width: '100%', boxSizing: 'border-box' }}
                                    value={campaignModal.validFromStr}
                                    onChange={(e) => patchCampaignModal('validFromStr', e.target.value)}
                                />

                                    className="form-control"
                                    type="date"
                                    style={{ minWidth: 0, width: '100%', boxSizing: 'border-box' }}

                        <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '0 0 12px', lineHeight: 1.45 }}>

                        <div style={{ marginTop: '8px', marginBottom: '12px' }}>

                                }}
