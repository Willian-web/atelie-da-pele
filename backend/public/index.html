<body>
    <div id="root"></div>

    <script type="text/babel">
const { useState, useEffect, useMemo } = React;

// Link de Destino Oficial - Tenta o localhost caso esteja rodando local, senão vai pra Railway
const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:8080' : 'https://atelie-da-pele-production.up.railway.app';

const SERVICES = [
    { id: 'limpeza_pele', name: 'Limpeza de Pele', price: 119.90, category: 'Estética Facial', duration: 60 },
    { id: 'dep_intima', name: 'Depilação Íntima Completa', price: 59.90, category: 'Depilação', duration: 60 },
    { id: 'dep_axila', name: 'Depilação Axila', price: 29.90, category: 'Depilação', duration: 60 },
    { id: 'dep_buco', name: 'Depilação Buço', price: 29.90, category: 'Depilação', duration: 60 },
    { id: 'dep_completa', name: 'Depilação Completa', price: 129.90, category: 'Depilação', duration: 60 },
    { id: 'reflexologia', name: 'Reflexologia Podal', price: 89.90, category: 'Bem-Estar', duration: 60 }
];

const formatPrice = (price) => {
    return price.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
};

const formatPhoneWA = (phone) => {
    const digits = phone.replace(/\D/g, '');
    if (!digits) return '';
    return digits.startsWith('55') ? digits : '55' + digits;
};

const getLocalTodayStr = () => {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    return new Date(now.getTime() - offset).toISOString().split('T')[0];
};

// Generates timeslots and filters past times if it's today
const generateTimeSlots = (dateString, existingAppointments) => {
    if (!dateString) return [];
    
    const dateObj = new Date(dateString + 'T12:00:00');
    const dayOfWeek = dateObj.getDay(); 
    
    // Check if selected date is today
    const now = new Date();
    const todayStr = getLocalTodayStr();
    const isToday = dateString === todayStr;
    const currentTotalMinutes = now.getHours() * 60 + now.getMinutes();

    let slots = [];
    
    if (dayOfWeek === 0) {
        return [];
    } else if (dayOfWeek === 6) { // Sat
        let hour = 14; let min = 0;
        while (hour < 17 || (hour === 17 && min === 0)) {
            slots.push(`${hour.toString().padStart(2, '0')}:${min === 0 ? '00' : '30'}`);
            min += 30; if (min >= 60) { hour += 1; min = 0; }
        }
    } else { // Mon-Fri
        let hour = 13; let min = 0;
        while (hour < 19 || (hour === 19 && min <= 30)) {
            slots.push(`${hour.toString().padStart(2, '0')}:${min === 0 ? '00' : '30'}`);
            min += 30; if (min >= 60) { hour += 1; min = 0; }
        }
    }
    
    // Calcula os intervalos de tempo ocupados a partir da duração do serviço
    const bookedIntervals = existingAppointments
        .filter(app => app.date === dateString && app.status !== 'cancelled')
        .map(app => {
            const [h, m] = app.time.split(':');
            const startMins = parseInt(h) * 60 + parseInt(m);
            // Pega a duração do serviço atrelado, assumindo 60m caso não encontre
            const service = SERVICES.find(s => s.id === app.serviceId);
            const duration = service ? service.duration : 60;
            return { start: startMins, end: startMins + duration };
        });
        
    return slots.map(time => {
        const [hStr, mStr] = time.split(':');
        const slotStartMins = parseInt(hStr) * 60 + parseInt(mStr);
        // Cada bloco visual na tela tem o peso de 30 minutos
        const slotEndMins = slotStartMins + 30; 
        
        const isPast = isToday && slotStartMins <= currentTotalMinutes;
        
        // Verifica se há colisão geométrica matemática de tempo
        // Slot cruza com um agendamento já feito?
        const isBooked = bookedIntervals.some(booked => 
            slotStartMins < booked.end && slotEndMins > booked.start
        );
        
        return {
            time,
            available: !isBooked && !isPast,
            isPast: isPast,
            isBooked: isBooked
        };
    });
};

    const checkPassword = () => { pwd === '1234' ? onSuccess() : (setError(true), setPwd('')); };
    return (

const AdminArea = ({ appointments, setAppointments, clients, config, setConfig }) => {
    const [adminView, setAdminView] = useState('agenda'); // agenda, clientes
    const [filter, setFilter] = useState('all'); // all, today, next
    const [profPhoneInput, setProfPhoneInput] = useState(config.profPhone || '');
    
    const todayStr = getLocalTodayStr();

    const handleDelete = (id) => {
        if(window.confirm('Tem certeza que deseja apagar DEFINITIVAMENTE esse agendamento? Esta ação não pode ser desfeita.')) {
            fetch(`${API_BASE_URL}/appointments/${id}`, { method: 'DELETE' })
                .then(() => {
                    const updated = appointments.filter(a => a.id !== id);
                    setAppointments(updated);
                })
                .catch(e => console.error(e));
        }
    };

    const handleCancelByAdmin = (id) => {
        const reason = window.prompt('Deseja realmente cancelar este agendamento? Qual o motivo? (Opcional)');
        if(reason !== null) {
            fetch(`${API_BASE_URL}/appointments/${id}/cancel`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cancelledBy: 'admin', cancelReason: reason })
            })
            .then(res => res.json())
            .then(updatedApp => {
                const updated = appointments.map(a => a.id === id ? updatedApp : a);
                setAppointments(updated);
            })
            .catch(e => console.error(e));
        }
    };

    const saveConfig = () => {
        const newConfig = { ...config, profPhone: profPhoneInput };
        setConfig(newConfig);
        localStorage.setItem('atelie_config', JSON.stringify(newConfig));
        alert('Telefone atualizado com sucesso!');
    };

    let filteredApps = appointments;
    if (filter === 'today') {
        filteredApps = appointments.filter(a => a.date === todayStr);
    } else if (filter === 'next') {
        filteredApps = appointments.filter(a => a.date > todayStr);
    }

    const sortedApps = [...filteredApps].sort((a, b) => new Date(a.date + 'T' + a.time) - new Date(b.date + 'T' + b.time));

    return (
        <div className="booking-section step-container">
            <h2 className="section-title">Painel da Profissional</h2>
            
            <div style={{marginBottom: '25px', padding: '15px', backgroundColor: '#f9f9f9', borderRadius: '8px', border: '1px solid #eee'}}>
                <label className="form-label">Telefone da Profissional p/ WhatsApp</label>
                <div style={{display: 'flex', gap: '10px'}}>
                    <input type="text" className="form-control" value={profPhoneInput} onChange={e => setProfPhoneInput(e.target.value)} placeholder="Ex: 11999999999" style={{maxWidth: '300px'}} />
                    <button className="btn-submit" onClick={saveConfig} style={{width: 'auto', padding: '10px 20px'}}>Salvar</button>
                </div>
            </div>

            <div className="filter-tabs" style={{marginBottom: '10px', display: 'flex', gap: '10px', borderBottom: '1px solid #eee', paddingBottom: '15px'}}>
                <button className={`tab-btn ${adminView === 'agenda' ? 'active' : ''}`} onClick={() => setAdminView('agenda')} style={{fontWeight: '500', display: 'flex', gap: '8px', alignItems: 'center'}}><i className="fas fa-calendar-alt"></i> Agenda</button>
                <button className={`tab-btn ${adminView === 'clientes' ? 'active' : ''}`} onClick={() => setAdminView('clientes')} style={{fontWeight: '500', display: 'flex', gap: '8px', alignItems: 'center'}}><i className="fas fa-users"></i> Clientes</button>
            </div>

            {adminView === 'agenda' ? (
                <>
                    <div className="filter-tabs" style={{marginTop: '15px'}}>
                        <button className={`tab-btn ${filter === 'today' ? 'active' : ''}`} onClick={() => setFilter('today')}>Hoje</button>
                        <button className={`tab-btn ${filter === 'next' ? 'active' : ''}`} onClick={() => setFilter('next')}>Próximos</button>
                        <button className={`tab-btn ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>Todos</button>
                    </div>
                    
                    <div className="appointments-list">
                        {sortedApps.length === 0 ? (
                            <div className="empty-state"><i className="fas fa-box-open"></i><p>Nenhum agendamento encontrado.</p></div>
                        ) : (
                            sortedApps.map(app => {
                                const service = SERVICES.find(s => s.id === app.serviceId) || {name: 'Serviço Removido', price: 0};
                                const dateStr = new Date(app.date + 'T12:00:00').toLocaleDateString('pt-BR');
                                const isToday = app.date === todayStr;
                                const isCancelled = app.status === 'cancelled';
                                const isPast = new Date(app.date + 'T' + app.time) < new Date();
                                return (
                                    <div key={app.id} className="appointment-item" style={isCancelled ? {opacity: 0.6, borderLeft: '4px solid #ef4444'} : (isToday ? {borderLeft: '4px solid var(--primary-color)'} : {})}>
                                        <div className="appointment-info" style={{flex: 1}}>
                                            <div className="appointment-cliente">{app.clientName} {isCancelled && <span style={{color: '#ef4444', fontSize: '14px', fontWeight: 'bold'}}>(Cancelado)</span>}</div>
                                            <div className="appointment-details">
                                                <div className="detail-badge"><i className="far fa-clock"></i> {dateStr} às {app.time}</div>
                                                <div className="detail-badge"><i className="fas fa-spa"></i> {service.name}</div>
                                                <div className="detail-badge"><i className="fas fa-phone"></i> {app.clientPhone}</div>
                                            </div>
                                            {app.notes && <div className="obs-text"><strong>Obs:</strong> {app.notes}</div>}
                                            {isCancelled && app.cancelReason && <div className="obs-text" style={{color: '#ef4444'}}><strong>Motivo Cancelamento:</strong> {app.cancelReason}</div>}
                                        </div>
                                        <div className="appointment-actions" style={{display: 'flex', gap: '8px', flexDirection: 'column'}}>
                                            {!isCancelled && !isPast && (
                                                <button className="btn-delete" style={{borderColor: '#f59e0b', color: '#f59e0b'}} onClick={() => handleCancelByAdmin(app.id)} title="Cancelar Horário"><i className="fas fa-times"></i></button>
                                            )}
                                            <button className="btn-delete" onClick={() => handleDelete(app.id)} title="Apagar Permanentemente"><i className="fas fa-trash-alt"></i></button>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </>
            ) : (
                <div className="appointments-list" style={{marginTop: '15px'}}>
                    {(!clients || clients.length === 0) ? (
                        <div className="empty-state"><i className="fas fa-users-slash"></i><p>Nenhuma cliente cadastrada ainda.</p></div>
                    ) : (
                        clients.map(client => (
                            <div key={client.id} className="appointment-item" style={{alignItems: 'center'}}>
                                <div className="appointment-info" style={{flex: 1}}>
                                    <div className="appointment-cliente" style={{color: 'var(--primary-color)', fontSize: '1.2rem', marginBottom: '8px'}}><i className="fas fa-user-circle" style={{marginRight: '8px'}}></i> {client.name}</div>
                                    <div className="appointment-details">
                                        <div className="detail-badge"><i className="fab fa-whatsapp"></i> {client.phone}</div>
                                        {client.address && <div className="detail-badge"><i className="fas fa-map-marker-alt"></i> {client.address}</div>}
                                    </div>
                                </div>
                                <div className="appointment-actions">
                                    <a href={`https://wa.me/55${client.phone}`} target="_blank" className="btn-cancel" style={{color: '#25D366', borderColor: '#25D366', padding: '8px 16px', fontSize: '14px', display: 'inline-flex', alignItems: 'center', gap: '8px', textDecoration: 'none'}}>
                                        <i className="fab fa-whatsapp" style={{fontSize: '18px'}}></i> Conversar
                                    </a>
                                </div>
                            </div>
                        ))
                    )}
                </div>
            )}
        </div>
    );
};

const MyAppointmentsArea = ({ appointments, setAppointments, clients, setView }) => {
    const [loginPhone, setLoginPhone] = useState('');
    const [loggedInUser, setLoggedInUser] = useState(null);
    const [loginError, setLoginError] = useState('');

    const handleCancelAppointment = (id) => {
        if(window.confirm('Deseja realmente cancelar este agendamento?')) {
            fetch(`${API_BASE_URL}/appointments/${id}/cancel`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cancelledBy: 'client', cancelReason: 'Cancelado pelo cliente' })
            })
            .then(res => res.json())
            .then(updatedApp => {
                const updated = appointments.map(a => a.id === id ? updatedApp : a);
                setAppointments(updated);
            })
            .catch(e => console.error(e));
        }
    };

    const handleLogin = () => {
        const cleanLogin = loginPhone.replace(/\D/g, '');
        const c = clients.find(cl => cl.phone.replace(/\D/g, '') === cleanLogin);
        if(c) {
            setLoggedInUser(c); setLoginError('');
        } else {
            setLoginError('Cliente não encontrada. Verifique se o telefone está correto.');
        }
    };

    if (!loggedInUser) {
        return (
            <div className="booking-section step-container">
                <button className="btn-admin" onClick={() => setView('client')} style={{marginBottom: '20px'}}><i className="fas fa-arrow-left"></i> Voltar</button>
                <h2 className="section-title">Acessar Meus Agendamentos</h2>
                <div className="form-group">
                    <label className="form-label">Qual o seu WhatsApp? (Apenas números)</label>
                    <input type="text" className="form-control" value={loginPhone} onChange={e => setLoginPhone(e.target.value)} placeholder="Ex: 11999999999" />
                    {loginError && <div style={{color: 'var(--danger)', fontSize: '13px', marginTop: '8px'}}>{loginError}</div>}
                    <button className="btn-submit" style={{marginTop: '15px'}} onClick={handleLogin}>Visualizar Agendamentos</button>
                </div>
            </div>
        );
    }

    const myApps = appointments.filter(a => a.clientId === loggedInUser.id).sort((a,b) => new Date(b.date + 'T' + b.time) - new Date(a.date + 'T' + a.time));

    return (
        <div className="booking-section step-container">
            <button className="btn-admin" onClick={() => setView('client')} style={{marginBottom: '20px'}}><i className="fas fa-arrow-left"></i> Voltar pro Início</button>
            <h2 className="section-title">Olá, {loggedInUser.name.split(' ')[0]}!</h2>
            <p style={{color: 'var(--text-muted)'}}>Aqui está o seu histórico de horários no Ateliê da Pele.</p>
            <div className="appointments-list" style={{marginTop: '20px'}}>
                {myApps.length === 0 ? (
                    <div className="empty-state"><i className="fas fa-calendar-times"></i><p>Nenhum histórico encontrado para você.</p></div>
                ) : (
                    myApps.map(app => {
                        const service = SERVICES.find(s => s.id === app.serviceId) || {name: 'Serviço Removido', price: 0};
                        const dateStr = new Date(app.date + 'T12:00:00').toLocaleDateString('pt-BR');
                        const isPast = new Date(app.date + 'T' + app.time) < new Date();
                        const isCancelled = app.status === 'cancelled';
                        return (
                            <div key={app.id} className="appointment-item" style={isCancelled ? {opacity: 0.6, borderLeft: '4px solid #ef4444'} : (isPast ? {opacity: 0.6} : {borderLeft: '4px solid var(--primary-color)'})}>
                                <div className="appointment-info" style={{flex: 1}}>
                                    <div className="appointment-details">
                                        <div className="detail-badge"><i className="far fa-clock"></i> {dateStr} às {app.time} {isPast && !isCancelled && <span style={{fontWeight: 'bold'}}>(Concluído)</span>} {isCancelled && <span style={{color: '#ef4444', fontWeight: 'bold'}}>(Cancelado)</span>}</div>
                                        <div className="detail-badge"><i className="fas fa-spa"></i> {service.name}</div>
                                    </div>
                                </div>
                                {!isPast && !isCancelled && (
                                    <button className="btn-cancel" onClick={() => handleCancelAppointment(app.id)} title="Cancelar Agendamento" style={{background: 'transparent', border: '1px solid #ef4444', color: '#ef4444', padding: '5px 10px', borderRadius: '4px', cursor: 'pointer'}}>
                                        Cancelar
                                    </button>
                                )}
                            </div>
                        );
                    })
                )}
            </div>
        </div>
    );
};

// Flow: 
// step 1: choose service, date, time
// step 2: identity (select or register client)
// step 3: success (whatsapp buttons)
const ClientArea = ({ appointments, setAppointments, clients, setClients, config }) => {
    const [step, setStep] = useState(1);
    
    // Step 1 Data
    const [selectedService, setSelectedService] = useState('');
    const [bookingData, setBookingData] = useState({ date: '', time: '', notes: '' });
    const [availableTimes, setAvailableTimes] = useState([]);
    
    // Step 2 Data
    const [loginPhone, setLoginPhone] = useState('');
    const [loginError, setLoginError] = useState('');
    const [selectedClient, setSelectedClient] = useState(null);
    const [newClient, setNewClient] = useState({ name: '', phone: '', address: '' });
    const [isCreatingNew, setIsCreatingNew] = useState(false);

    // Step 3 Data
    const [completedAppInfo, setCompletedAppInfo] = useState(null);

    const todayStr = getLocalTodayStr();

    useEffect(() => {
        if (bookingData.date) {
            setAvailableTimes(generateTimeSlots(bookingData.date, appointments));
            setBookingData(prev => ({...prev, time: ''}));
        } else {
            setAvailableTimes([]);
        }
    }, [bookingData.date, appointments]);

    const handleStep1Submit = (e) => {
        e.preventDefault();
        if(!selectedService || !bookingData.date || !bookingData.time) return;
        setStep(2);
    };

    const handleCreateClient = () => {
        if(!newClient.name || !newClient.phone) {
            alert('Nome e Telefone são obrigatórios para cadastro.');
            return;
        }
        const cleanPhone = newClient.phone.replace(/\D/g, '');
        const clientObj = { id: Date.now().toString(), name: newClient.name, phone: cleanPhone, address: newClient.address };
        const updated = [...clients, clientObj];
        setClients(updated);
        localStorage.setItem('atelie_clients', JSON.stringify(updated));
        setSelectedClient(clientObj);
        setIsCreatingNew(false);
        setStep(3); // Avança pra confirmação dedicada
    };

    const [isLoading, setIsLoading] = useState(false);
    const [apiError, setApiError] = useState('');

    const handleConfirmBooking = async () => {
        if(!selectedClient) {
            alert('Selecione um cliente para prosseguir.');
            return;
        }

        setIsLoading(true);
        setApiError('');
        
        try {
            const dateStrBR = new Date(bookingData.date + 'T12:00:00').toLocaleDateString('pt-BR');
            const serviceName = SERVICES.find(s=>s.id === selectedService)?.name || 'Serviço';
            const price = formatPrice(SERVICES.find(s=>s.id === selectedService)?.price || 0);

            // POST to backend Node.js (Com endereço Dinâmico)
            const response = await fetch(`${API_BASE_URL}/appointments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    serviceId: selectedService,
                    clientId: selectedClient.id,
                    clientName: selectedClient.name,
                    clientPhone: selectedClient.phone,
                    date: bookingData.date,
                    time: bookingData.time,
                    notes: bookingData.notes
                })
            });

            if (!response.ok) {
                throw new Error('Falha no servidor ao enviar requisição.');
            }

            const data = await response.json();
            console.log('Sucesso na API de Agendamento:', data);

            const updatedApps = [...appointments, data];
            setAppointments(updatedApps);
            
            setCompletedAppInfo({ 
                service: SERVICES.find(s=>s.id === selectedService), 
                app: data, 
                client: selectedClient
            });
            setStep(4); // Avança para a nova tela de sucesso

        } catch (error) {
            console.error('Erro no agendamento:', error);
            setApiError('Não foi possível gerar mensagens via Backend (Node offline?). Agendamento NÃO salvo.');
        } finally {
            setIsLoading(false);
        }
    };


    const resetFlow = () => {
        setSelectedService(''); setBookingData({ date: '', time: '', notes: '' });
        setSelectedClient(null); setNewClient({name:'', phone:'', address:''});
        setStep(1);
    };

    return (
        <div>
            {/* STEP 1 */}
            {step === 1 && (
                <div className="booking-section step-container">
                    <h2 className="section-title">O que você deseja cuidar hoje?</h2>
                    <div className="services-grid">
                        {SERVICES.map(s => (
                            <div key={s.id} className={`service-card ${selectedService === s.id ? 'selected' : ''}`} onClick={() => setSelectedService(s.id)}>
                                <div className="service-card-header">
                                    <h3>{s.name}</h3><i className="fas fa-check-circle service-check"></i>
                                </div>
                                <div style={{fontSize: '13px', color: 'var(--text-muted)'}}>{s.category}</div>
                                <div className="service-price">{formatPrice(s.price)}</div>
                            </div>
                        ))}
                    </div>

                    <form onSubmit={handleStep1Submit} className="form-grid" style={{marginTop: '40px'}}>
                        <div className="form-group full-width">
                            <label className="form-label">Escolha a Data *</label>
                            <input type="date" className="form-control" min={todayStr} value={bookingData.date} onChange={e => setBookingData({...bookingData, date: e.target.value})} required />
                            {bookingData.date && new Date(bookingData.date + 'T12:00:00').getDay() === 0 && (
                                <div className="day-closed-msg"><i className="fas fa-door-closed"></i> Fechado aos domingos. Escolha outra data.</div>
                            )}
                        </div>
                        
                        <div className="form-group full-width">
                            <label className="form-label">Horários Disponíveis *</label>
                            {!bookingData.date ? (
                                <div style={{color: 'var(--text-muted)', fontSize: '14px'}}>Selecione uma data para ver os horários.</div>
                            ) : availableTimes.length === 0 ? (
                                <div style={{color: 'var(--danger)', fontSize: '14px'}}>Nenhum horário selecionável hoje.</div>
                            ) : (
                                <div className="time-slots">
                                    {availableTimes.map((slot, idx) => {
                                        let className = "time-slot";
                                        if (slot.isPast) className += " past-slot";
                                        else if (!slot.available) className += " disabled";
                                        if (bookingData.time === slot.time) className += " selected";
                                        
                                        return (
                                            <div key={idx} className={className} 
                                                onClick={() => { if(slot.available && !slot.isPast) setBookingData({...bookingData, time: slot.time}); }}
                                                title={slot.isPast ? "Horário já passou" : slot.isBooked ? "Horário ocupado" : "Disponível"}
                                            >
                                                {slot.time} {slot.isPast && <i className="fas fa-history" style={{marginLeft: '4px', fontSize: '10px'}}></i>}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                        
                        <div className="form-group full-width">
                            <label className="form-label">Observações (Opcional)</label>
                            <textarea className="form-control" placeholder="Algo que devemos saber antes?" value={bookingData.notes} onChange={e => setBookingData({...bookingData, notes: e.target.value})}></textarea>
                        </div>

                        <div className="form-group full-width">
                            <button type="submit" className="btn-submit" disabled={!selectedService || !bookingData.date || !bookingData.time}>
                                Continuar <i className="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </form>
                </div>
            )}

            {/* STEP 2 */}
            {step === 2 && (
                <div className="booking-section step-container">
                    <button className="btn-admin" onClick={() => setStep(1)} style={{marginBottom: '20px'}}><i className="fas fa-arrow-left"></i> Voltar</button>
                    <h2 className="section-title">Identificação da Cliente</h2>
                    
                    {!isCreatingNew ? (
                        <>
                            <div className="form-group" style={{background: '#f9f9f9', padding: '15px', borderRadius: '8px', border: '1px solid var(--border-color)'}}>
                                <label className="form-label" style={{fontWeight: 600}}>Já sou cliente (Seu WhatsApp)</label>
                                <input type="text" className="form-control" placeholder="Apenas números (Ex: 11999999999)..." value={loginPhone} onChange={e => setLoginPhone(e.target.value)} />
                                {loginError && <div style={{color: 'var(--danger)', fontSize: '13px', marginTop: '8px'}}>{loginError}</div>}
                                <button className="btn-submit" style={{marginTop: '15px', width: '100%'}} onClick={() => {
                                    const cleanLogin = loginPhone.replace(/\D/g, '');
                                    const c = clients.find(cl => cl.phone.replace(/\D/g, '') === cleanLogin);
                                    if(c) {
                                        setSelectedClient(c); setLoginError('');
                                        setStep(3); // Avança pra Confirmação
                                    } else {
                                        setLoginError('Cliente não encontrada. Verifique o número ou selecione "Sou Nova Aqui".');
                                    }
                                }}>Avançar</button>
                            </div>
                            
                            <div style={{textAlign: 'center', margin: '20px 0'}}>ou</div>
                            <button className="btn-submit" style={{background: 'var(--secondary-color)', color: 'var(--text-dark)', width: '100%'}} onClick={() => setIsCreatingNew(true)}>
                                <i className="fas fa-user-plus"></i> Sou Nova Aqui (Cadastrar)
                            </button>
                        </>
                    ) : (
                        <div className="form-grid" style={{background: '#f9f9f9', padding: '20px', borderRadius: '8px', border: '1px solid var(--border-color)'}}>
                            <div className="form-group full-width" style={{marginBottom: '5px'}}>
                                <h3 style={{fontSize: '18px', color: 'var(--text-dark)'}}>Nova Cliente</h3>
                                <p style={{fontSize: '13px', color: 'var(--text-muted)'}}>Bem-vinda ao Ateliê! Preencha seus dados rápidos para criar sua conta conosco.</p>
                            </div>
                            <div className="form-group full-width"><label className="form-label">Nome Completo *</label><input type="text" className="form-control" value={newClient.name} onChange={e=>setNewClient({...newClient, name: e.target.value})}/></div>
                            <div className="form-group"><label className="form-label">Telefone (WhatsApp) *</label><input type="text" className="form-control" placeholder="Ex: 11999999999" value={newClient.phone} onChange={e=>setNewClient({...newClient, phone: e.target.value})}/></div>
                            <div className="form-group"><label className="form-label">Endereço (Opcional)</label><input type="text" className="form-control" value={newClient.address} onChange={e=>setNewClient({...newClient, address: e.target.value})}/></div>
                            <div className="form-group full-width" style={{display:'flex', gap:'10px', marginTop: '10px'}}>
                                <button className="btn-cancel" onClick={() => setIsCreatingNew(false)}>Voltar</button>
                                <button className="btn-submit" style={{flex: 1}} onClick={handleCreateClient}>Salvar Cadastro</button>
                            </div>
                        </div>
                    )}
                </div>
            )}

            {/* STEP 3 - CONFIRMAÇÃO */}
            {step === 3 && selectedClient && (
                <div className="booking-section step-container" style={{textAlign: 'center'}}>
                    <div style={{display: 'flex', justifyContent: 'flex-start', marginBottom: '20px'}}>
                        <button className="btn-admin" onClick={() => setStep(2)}><i className="fas fa-arrow-left"></i> Voltar</button>
                    </div>
                    
                    <h2 className="section-title" style={{marginBottom: '10px'}}>Confirme seu Agendamento</h2>
                    <p style={{fontSize: '18px', color: 'var(--text-dark)', marginBottom: '30px'}}>Olá <strong>{selectedClient.name.split(' ')[0]}</strong>, quase lá!</p>

                    <div style={{background: '#fcfcfc', padding: '25px', borderRadius: '12px', textAlign: 'left', marginBottom: '30px', display: 'inline-block', maxWidth: '400px', width: '100%', border: '1px solid var(--border-color)', boxShadow: '0 2px 8px rgba(0,0,0,0.03)'}}>
                        <div style={{marginBottom: '15px', fontSize: '16px'}}><strong style={{color: 'var(--primary-color)'}}>Serviço:</strong> {SERVICES.find(s=>s.id === selectedService)?.name}</div>
                        <div style={{marginBottom: '15px', fontSize: '16px'}}><strong style={{color: 'var(--primary-color)'}}>Data:</strong> {new Date(bookingData.date + 'T12:00:00').toLocaleDateString('pt-BR')}</div>
                        <div style={{marginBottom: '15px', fontSize: '16px'}}><strong style={{color: 'var(--primary-color)'}}>Horário:</strong> {bookingData.time}</div>
                        <div style={{fontSize: '16px'}}><strong style={{color: 'var(--primary-color)'}}>Valor total:</strong> {formatPrice(SERVICES.find(s=>s.id === selectedService)?.price || 0)}</div>
                    </div>

                    <div style={{display: 'flex', flexDirection: 'column', alignItems: 'center'}}>
                        <button className="btn-submit" onClick={handleConfirmBooking} disabled={isLoading} style={{width: '100%', maxWidth: '400px', padding: '16px', fontSize: '18px'}}>
                            {isLoading ? <><i className="fas fa-spinner fa-spin"></i> Confirmando...</> : 'Confirmar Agendamento'}
                        </button>
                        {apiError && <div className="alert alert-error" style={{marginTop: '20px'}}>{apiError}</div>}
                    </div>
                </div>
            )}

            {/* STEP 4 - SUCESSO/WHATSAPP */}
            {step === 4 && completedAppInfo && (
                <div className="booking-section step-container" style={{textAlign: 'center'}}>
                    <i className="fas fa-check-circle" style={{fontSize: '60px', color: 'var(--success)', marginBottom: '20px'}}></i>
                    <h2 style={{color: 'var(--text-dark)', marginBottom: '10px'}}>Agendamento Registrado!</h2>
                    <p style={{color: 'var(--text-muted)', marginBottom: '30px'}}>O horário já está reservado no nosso sistema.</p>
                    
                    <div style={{background: '#f9f9f9', padding: '20px', borderRadius: '12px', textAlign: 'left', marginBottom: '20px', display: 'inline-block', maxWidth: '400px', width: '100%'}}>
                        <strong>{completedAppInfo.client.name}</strong><br/>
                        Serviço: {completedAppInfo.service.name}<br/>
                        {new Date(completedAppInfo.app.date + 'T12:00:00').toLocaleDateString('pt-BR')} às {completedAppInfo.app.time}
                    </div>

                    <div style={{marginBottom: '30px'}}>
                        <p style={{fontWeight: '500', marginBottom: '15px'}}>Para agilizar seu atendimento, mande um oi no nosso WhatsApp:</p>
                        <a 
                            href={`https://wa.me/55${config.profPhone || '41984928985'}?text=${encodeURIComponent(`Olá, sou o(a) ${completedAppInfo.client.name.split(' ')[0]} e fiz um agendamento no Ateliê da Pele e gostaria de confirmar.\n\n*Serviço:* ${completedAppInfo.service.name}\n*Data:* ${new Date(completedAppInfo.app.date + 'T12:00:00').toLocaleDateString('pt-BR')}\n*Horário:* ${completedAppInfo.app.time}\n*Valor:* ${formatPrice(completedAppInfo.service.price)}`)}`}
                            target="_blank" 
                            className="wa-btn" 
                            style={{margin: '0 auto', fontSize: '16px', display: 'flex', justifyContent: 'center', maxWidth: '300px'}}
                        >
                            <i className="fab fa-whatsapp" style={{fontSize: '20px'}}></i>
                            Avisar no WhatsApp
                        </a>
                    </div>

                    <div style={{display: 'block'}}>
                        <button className="btn-admin" style={{margin: '0 auto'}} onClick={resetFlow}>Fazer novo agendamento</button>
                    </div>
                </div>
            )}
        </div>
    );
};

const App = () => {
    const [view, setView] = useState('client'); 
    const [showPassword, setShowPassword] = useState(false);
    
    // Global Storage States
    const [appointments, setAppointments] = useState([]);
    const [clients, setClients] = useState([]);
    const [config, setConfig] = useState({ profPhone: '' });

    useEffect(() => {
        fetch(`${API_BASE_URL}/appointments`)
            .then(res => res.json())
            .then(data => setAppointments(data))
            .catch(e => console.error("Error fetching appointments:", e));

        try {
            const savedClients = localStorage.getItem('atelie_clients');
            if (savedClients) setClients(JSON.parse(savedClients));

            const savedConfig = localStorage.getItem('atelie_config');
            if (savedConfig) setConfig(JSON.parse(savedConfig));
        } catch (e) { console.error("Error load localstorage", e); }
    }, []);

    const navigateTo = (tView) => {
        if (tView === 'admin' && view !== 'admin') setShowPassword(true);
        else setView(tView);
    };

    return (
        <div className="container">
            <Header view={view} setView={navigateTo} />
            {showPassword && <PasswordModal onSuccess={() => { setShowPassword(false); setView('admin'); }} onCancel={() => setShowPassword(false)} />}
            <main>
                {view === 'client' && <ClientArea appointments={appointments} setAppointments={setAppointments} clients={clients} setClients={setClients} config={config} />}
                {view === 'my_apps' && <MyAppointmentsArea appointments={appointments} setAppointments={setAppointments} clients={clients} setView={setView} />}
                {view === 'admin' && <AdminArea appointments={appointments} setAppointments={setAppointments} clients={clients} config={config} setConfig={setConfig} />}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
