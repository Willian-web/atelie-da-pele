/** Valores financeiros já normalizados pela API (paidAmount, paymentSummary); só formatação para “Meus Agendamentos”. */
const resolveAppointmentPaidForDisplay = (app) => {
    const ps = app && app.paymentSummary;
    let paid = ps != null && ps.paidAmount != null ? Number(ps.paidAmount) : NaN;
    if (!Number.isFinite(paid)) {
        paid = Number(app.paidAmount ?? app.paid_amount);
    }
    if (!Number.isFinite(paid)) paid = null;

    const remRaw = app.remainingAmount ?? (ps && ps.remainingAmount);
    const rem = remRaw != null ? Number(remRaw) : NaN;
    const remaining = Number.isFinite(rem) ? rem : null;

    const pType = String(app.paymentType || '').toLowerCase();
    const showRemaining = pType === 'partial' && remaining != null && remaining > 0.005;

    return { paid, remaining: showRemaining ? remaining : null, showRemaining };
};

const getLocalTodayStr = () => {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    return new Date(now.getTime() - offset).toISOString().split('T')[0];
};

/** Alinhado ao backend: duração na grade e intervalo mínimo entre inícios. */
const DEFAULT_APPOINTMENT_DURATION_MIN = 60;
const MIN_START_GAP_MINUTES = 60;

const normalizeSlotTimeLabel = (t) => {
    if (t == null) return null;
    const s = String(t).trim();
    const m = s.match(/^(\d{1,2}):(\d{2})/);
    if (!m) return null;
    const hh = String(m[1]).padStart(2, '0');
    return `${hh}:${m[2]}`;
};

const parseTimeToMinutes = (timeStr) => {
    const n = normalizeSlotTimeLabel(timeStr);
    if (!n) return null;
    const [h, mm] = n.split(':').map(Number);
    if (!Number.isFinite(h) || !Number.isFinite(mm)) return null;
    return h * 60 + mm;
};

/**
 * Grade de horários: ocupação por duração do serviço, intervalo mínimo de 1h entre inícios,
 * bloqueios manuais (blocked_slots).
 */
const generateTimeSlots = (dateString, existingAppointments, blockedSlotsList = []) => {
    if (!dateString) return [];

    const dateObj = new Date(dateString + 'T12:00:00');
    const dayOfWeek = dateObj.getDay();

    const now = new Date();
    const todayStr = getLocalTodayStr();
    const isToday = dateString === todayStr;
    const currentTotalMinutes = now.getHours() * 60 + now.getMinutes();

    let slots = [];
    if (dayOfWeek === 0) return [];
    else if (dayOfWeek === 6) {
        let hour = 14; let min = 0;
        while (hour < 17 || (hour === 17 && min === 0)) {
            slots.push(`${hour.toString().padStart(2, '0')}:${min === 0 ? '00' : '30'}`);
            min += 30; if (min >= 60) { hour += 1; min = 0; }
        }
    } else {
        let hour = 13; let min = 0;
        while (hour < 19 || (hour === 19 && min <= 30)) {
            slots.push(`${hour.toString().padStart(2, '0')}:${min === 0 ? '00' : '30'}`);
            min += 30; if (min >= 60) { hour += 1; min = 0; }
        }
    }

    const blockedSet = new Set(
        (blockedSlotsList || [])
            .filter((b) => b.date === dateString)
            .map((b) => normalizeSlotTimeLabel(b.time))
            .filter(Boolean)
    );

    const activeApps = existingAppointments.filter(
        (app) => app.date === dateString && ['pending_payment', 'confirmed', 'completed'].includes(app.status)
    );

    const bookedIntervals = activeApps
        .map((app) => {
            const startMins = parseTimeToMinutes(app.time);
            if (startMins == null) return null;
            const service = getServiceMeta(app.serviceId);
            const duration =
                service && typeof service.duration === 'number' ? service.duration : DEFAULT_APPOINTMENT_DURATION_MIN;
            return { start: startMins, end: startMins + duration };
        })
        .filter(Boolean);

    return slots.map((time) => {
        const slotStartMins = parseTimeToMinutes(time);
        if (slotStartMins == null) {
            return {
                time,
                available: false,
                isPast: false,
                isBooked: true,
                isBlockedManual: false,
                hasAppointmentAtTime: false
            };
        }
        const slotEndMins = slotStartMins + 30;
        const isPast = isToday && slotStartMins <= currentTotalMinutes;
        const isBlockedManual = blockedSet.has(time);

        const isOverlapBooked = bookedIntervals.some(
            (booked) => slotStartMins < booked.end && slotEndMins > booked.start
        );

        const tooCloseToStart = activeApps.some((app) => {
            const S = parseTimeToMinutes(app.time);
            if (S == null || slotStartMins == null) return false;
            return Math.abs(slotStartMins - S) < MIN_START_GAP_MINUTES;
        });

        const isBooked = isOverlapBooked || tooCloseToStart;
        const isUnavailable = isPast || isBlockedManual || isBooked;

        return {
            time,
            available: !isUnavailable,
            isPast,
            isBooked,
            isBlockedManual,
            hasAppointmentAtTime: activeApps.some((a) => normalizeSlotTimeLabel(a.time) === time)
        };
    });
};

const PasswordModal = ({ onSuccess, onCancel }) => {
    const [pwd, setPwd] = useState('');
    const [showPwd, setShowPwd] = useState(false);
    const [errorMsg, setErrorMsg] = useState('');
    const [loading, setLoading] = useState(false);

    const submit = async () => {
        setErrorMsg('');
        setLoading(true);
        try {
            const res = await fetch(`${API_BASE_URL}/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setPwd('');
                setErrorMsg(data.error || 'Não foi possível acessar. Tente novamente.');
                return;
            }
            if (!data.token) {
                setErrorMsg('Resposta inválida do servidor.');
                return;
            }
            setPwd('');
            onSuccess(data.token);
        } catch {
            setPwd('');
            setErrorMsg('Falha de conexão. Verifique a internet e tente de novo.');
        } finally {
            setLoading(false);
        }
    };

    return (
        <div className="password-overlay">
            <div className="password-modal">
                <i className="fas fa-shield-alt" style={{fontSize: '40px', color: 'var(--primary-color)', marginBottom: '15px'}}></i>
                <h3 style={{marginBottom: '20px'}}>Administração</h3>
                {errorMsg && <div className="alert alert-error" style={{padding: '8px', marginBottom: '15px', fontSize: '13px'}}>{errorMsg}</div>}
                <div className="password-field-wrap" style={{ width: '100%', marginBottom: '12px' }}>
                    <input type={showPwd ? 'text' : 'password'} className="form-control password-input" placeholder="Senha do painel" value={pwd} onChange={e => setPwd(e.target.value)} onKeyDown={e => e.key === 'Enter' && !loading && submit()} autoFocus disabled={loading} autoComplete="current-password" />
                    <button type="button" className="password-toggle-eye" onClick={() => setShowPwd((v) => !v)} disabled={loading} aria-label={showPwd ? 'Ocultar senha' : 'Mostrar senha'} title={showPwd ? 'Ocultar senha' : 'Mostrar senha'}>
                        <i className={`fas ${showPwd ? 'fa-eye-slash' : 'fa-eye'}`} aria-hidden />
                    </button>
                </div>
                <div className="modal-actions"><button className="btn-cancel" onClick={onCancel} disabled={loading}>Voltar</button><button className="btn-submit" style={{flex: 1}} onClick={submit} disabled={loading}>{loading ? 'Validando…' : 'Acessar'}</button></div>
            </div>
        </div>
    );
};

const StatusBadge = ({ status }) => {
    switch (status) {
        case 'pending_payment': return <span className="status-badge st-pending"><i className="fas fa-clock"></i> Aguardando Pagamento</span>;
        case 'confirmed': return <span className="status-badge st-confirmed"><i className="fas fa-check"></i> Confirmado</span>;
        case 'cancelled': return <span className="status-badge st-cancelled"><i className="fas fa-times"></i> Cancelado</span>;
        case 'completed': return <span className="status-badge st-completed"><i className="fas fa-flag-checkered"></i> Concluído</span>;
        default: return null;
    }
}

    }, [selectedService]);

    const handleCreateClient = async () => {
        setNewClientFormError('');
        if (!newClient.name || !newClient.phone) {
            setNewClientFormError('Nome e telefone são obrigatórios.');
            return;
        }
        if (!isValidEmailFormat(newClient.email)) {
            setNewClientFormError('Informe um e-mail válido. Usaremos para enviar a confirmação após o pagamento.');
            return;
        }
        const cleanPhone = newClient.phone.replace(/\D/g, '');
        
        setIsLoading(true);
        try {
            const res = await fetch(`${API_BASE_URL}/clients`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: Date.now().toString(),
                    name: newClient.name,
                    phone: cleanPhone,
                    address: newClient.address,
                    email: newClient.email.trim().toLowerCase()
                })
            });
            const data = await res.json();
            if (!res.ok) {
                setNewClientFormError(data.error || 'Não foi possível salvar seu cadastro.');
                return;
            }
            
            setSelectedClient(data);
            setClientEmailForBooking(String(data.email || newClient.email.trim()).toLowerCase());
            setIsCreatingNew(false);
            setStep(3);
            refreshData();
        } catch (e) {
            setNewClientFormError('Falha de conexão ao registrar. Tente novamente.');
        }
        setIsLoading(false);
    };

    const handleConfirmBooking = async () => {
        const serviceId = selectedService;
        const serviceObj = SERVICES.find((s) => s.id === serviceId);
        const forceFull = serviceObj && Number(serviceObj.price) <= FIXED_SIGNAL_AMOUNT;
        const payType = forceFull || paymentType === 'full' ? 'full' : 'partial';

        if (!checkedTerms) {
            return alert(
                payType === 'full'
                    ? 'Você precisa aceitar os termos de pagamento do valor total.'
                    : 'Você precisa aceitar os termos de pagamento do sinal.'
            );
        }

        const emailTrim = clientEmailForBooking.trim().toLowerCase();
        if (!isValidEmailFormat(emailTrim)) {
            setApiError('Informe um e-mail válido. Enviaremos a confirmação do agendamento para esse endereço após o pagamento.');
            return;
        }

        setIsLoading(true);
        setApiError('');
        
        try {
            if (!serviceObj) {
                throw new Error('Selecione um procedimento válido.');
            }

            const response = await fetch(`${API_BASE_URL}/appointments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    serviceId: serviceId,
                    clientId: selectedClient.id,
                    clientName: selectedClient.name,
                    clientPhone: selectedClient.phone,
                    clientEmail: emailTrim,
                    date: bookingData.date,
                    time: bookingData.time,
                    notes: bookingData.notes,
                    location: bookingData.location,
                    paymentType: payType
                })
            });

            const data = await response.json();
            
            if (!response.ok) {
                if(response.status === 409) {
                    throw new Error('Alguém reservou este mesmo horário há poucos segundos! Por favor, escolha outro.');
                }
                throw new Error(data.error || 'Falha no servidor ao agendar.');
            }

            setCompletedAppInfo({ service: serviceObj, app: data, client: selectedClient });
            refreshData();
            setStep(4);

        } catch (error) {
            setApiError(error.message);
        } finally {
            setIsLoading(false);
        }
    };

    const priceObj = SERVICES.find(s=>s.id === selectedService);
    const adiantamento = formatPrice(FIXED_SIGNAL_AMOUNT);
    const forceFullPayment = priceObj && Number(priceObj.price) <= FIXED_SIGNAL_AMOUNT;
    const effectiveFull = forceFullPayment || paymentType === 'full';

    return (
        <div>
            {step === 1 && (
                <div className="booking-section step-container">
                    <h2 className="section-title">O que deseja agendar?</h2>
                    <div className="service-category-chips" role="tablist" aria-label="Filtrar por categoria">
                        {serviceCategoryChips.map((label) => (
                            <button
                                key={label}
                                type="button"
                                role="tab"
                                aria-selected={serviceCatFilter === label}
                                className={`service-category-chip${serviceCatFilter === label ? ' active' : ''}`}
                                onClick={() => setServiceCatFilter(label)}
                            >
                                {label}
                            </button>
                        ))}
                    </div>
                    <div className="services-grid">
                        {servicesForGrid.map((s) => {
                            const detailsOpen = serviceDetailOpenId === s.id;
                            return (
                                <div
                                    key={s.id}
                                    role="button"
                                    tabIndex={0}
                                    className={`service-card ${selectedService === s.id ? 'selected' : ''}`}
                                    onClick={() => {
                                        setSelectedService(s.id);
                                        setServiceDetailOpenId(null);
                                    }}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter' || e.key === ' ') {
                                            e.preventDefault();
                                            setSelectedService(s.id);
                                            setServiceDetailOpenId(null);
                                        }
                                    }}
                                >
                                    <div className="service-card-header">
                                        <h3>{getClientServiceCardTitle(s)}</h3>
                                        <i className="fas fa-check-circle service-check" aria-hidden />
                                    </div>
                                    <div
                                        style={{
                                            fontSize: '11px',
                                            fontWeight: 600,
                                            color: 'var(--text-muted)',
                                            textTransform: 'uppercase',
                                            letterSpacing: '0.07em',
                                            marginTop: '2px'
                                        }}
                                    >
                                        {s.category}
                                    </div>
                                    <div className="service-price">{formatPrice(s.price)}</div>
                                    <div style={{ marginTop: 'auto', paddingTop: '12px' }}>
                                        <button
                                            type="button"
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                setServiceDetailOpenId((prev) => (prev === s.id ? null : s.id));
                                            }}
                                            aria-expanded={detailsOpen}
                                            style={{
                                                border: 'none',
                                                background: 'transparent',
                                                padding: '4px 0',
                                                margin: 0,
                                                fontSize: '12px',
                                                fontWeight: 600,
                                                color: 'var(--brand-primary)',
                                                cursor: 'pointer',
                                                textDecoration: 'none',
                                                borderBottom: '1px solid rgba(166, 120, 180, 0.35)',
                                                fontFamily: 'inherit'
                                            }}
                                        >
                                            {detailsOpen ? 'Ocultar detalhes' : 'Ver detalhes'}
                                        </button>
                                        {detailsOpen && (s.detail || s.summary || (s.cardTitle && s.name && s.cardTitle !== s.name)) ? (
                                            <div
                                                style={{
                                                    marginTop: '10px',
                                                    fontSize: '13px',
                                                    color: 'var(--text-muted)',
                                                    lineHeight: 1.5,
                                                    textAlign: 'left'
                                                }}
                                            >
                                                {s.cardTitle && s.name && s.cardTitle !== s.name && (
                                                    <p style={{ margin: '0 0 10px', fontSize: '12px', color: 'var(--text-dark)' }}>
                                                        <strong>Procedimento:</strong> {s.name}
                                                    </p>
                                                )}
                                                {s.summary && <p style={{ margin: '0 0 8px' }}>{s.summary}</p>}
                                                {s.detail && <p style={{ margin: 0 }}>{s.detail}</p>}
                                            </div>
                                        ) : null}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <form onSubmit={e => { e.preventDefault(); if(selectedService && bookingData.date && bookingData.time) setStep(2); }} className="form-grid" style={{marginTop: '40px'}}>
                        <div className="form-group full-width">
                            <label className="form-label">Data Escolhida *</label>
                            <input type="date" className="form-control" min={todayStr} value={bookingData.date} onChange={e => setBookingData({...bookingData, date: e.target.value})} required />
                        </div>
                        
                        <div className="form-group full-width">
                            <label className="form-label">Horários Ofertados *</label>
                            {!bookingData.date ? <div style={{color: 'var(--text-muted)', fontSize: '14px'}}>Escolha a data acima primeiro.</div> : 
                                availableTimes.length === 0 ? <div style={{color: 'var(--danger)', fontSize: '14px'}}>Nenhum horário livre.</div> : 
                                <div className="time-slots">
                                    {availableTimes.map((slot, idx) => {
                                        let className = "time-slot";
                                        if (slot.isPast) className += " past-slot";
                                        else if (!slot.available) className += " disabled";
                                        if (bookingData.time === slot.time) className += " selected";
                                        return (
                                            <div key={idx} className={className} 
                                                onClick={() => { if(slot.available && !slot.isPast) setBookingData({...bookingData, time: slot.time}); }}
                                            >
                                                {slot.time} {slot.isPast && <i className="fas fa-history" style={{marginLeft: '4px', fontSize: '10px'}}></i>}
                                            </div>
                                        );
                                    })}
                                </div>
                            }
                        </div>

                        <div className="form-group full-width">
                            <label className="form-label">Endereço do Local (Opcional, se a domicílio)</label>
                            <input type="text" className="form-control" placeholder="Rua, Número, Bairro/Complemento" value={bookingData.location} onChange={e => setBookingData({...bookingData, location: e.target.value})} />
                        </div>
                        
                        <div className="form-group full-width">
                            <label className="form-label">Detalhes da Sessão</label>
                            <textarea className="form-control" placeholder="Algo que devemos saber antes?" value={bookingData.notes} onChange={e => setBookingData({...bookingData, notes: e.target.value})}></textarea>
                        </div>

                        <div className="form-group full-width">
                            <button type="submit" className="btn-submit" disabled={!selectedService || !bookingData.date || !bookingData.time}>Prosseguir à Identificação <i className="fas fa-arrow-right"></i></button>
                        </div>
                    </form>
                </div>
            )}

            {step === 2 && (
                <div className="booking-section step-container">
                    <button className="btn-admin" onClick={() => setStep(1)} style={{marginBottom: '20px'}}><i className="fas fa-arrow-left"></i> Voltar Modificar Dia</button>
                    <h2 className="section-title">Sua Identificação</h2>
                    
                    {!isCreatingNew ? (
                        <>
                            <div className="form-group" style={{background: '#f9f9f9', padding: '15px', borderRadius: '8px', border: '1px solid var(--border-color)'}}>
                                <label className="form-label" style={{fontWeight: 600}}>Já sou cliente (Número do seu WhatsApp)</label>
                                <input type="text" className="form-control" placeholder="Ex: 11999999999..." value={loginPhone} onChange={e => setLoginPhone(e.target.value)} />
                                {loginError && <div style={{color: 'var(--danger)', fontSize: '13px', marginTop: '8px'}}>{loginError}</div>}
                                <button className="btn-submit" style={{marginTop: '15px', width: '100%'}} onClick={() => {
                                    const cleanLogin = loginPhone.replace(/\D/g, '');
                                    const c = clients.find(cl => cl.phone.replace(/\D/g, '') === cleanLogin);
                                    if(c) {
                                        setSelectedClient(c); setLoginError('');
                                        setStep(3);
                                    } else {
                                        setLoginError('Número não encontrado. Tente cadastrar logo abaixo.');
                                    }
                                }}>Acessar com meu número</button>
                            </div>
                            
                            <div style={{textAlign: 'center', margin: '20px 0', color: 'var(--text-muted)'}}>ou criar novo</div>
                            <button className="btn-submit" style={{background: 'var(--secondary-color)', color: 'var(--text-dark)', width: '100%'}} onClick={() => setIsCreatingNew(true)}>
                                <i className="fas fa-user-plus"></i> Cadastro de 1 Minuto
                            </button>
                        </>
                    ) : (
                        <div className="form-grid" style={{background: '#f9f9f9', padding: '20px', borderRadius: '8px', border: '1px solid var(--border-color)'}}>
                            <div className="form-group full-width" style={{marginBottom: '5px'}}>
                                <h3 style={{fontSize: '18px', color: 'var(--text-dark)'}}>Novo Perfil</h3>
                                <p style={{fontSize: '13px', color: 'var(--text-muted)'}}>Rapidamente configure seus dados que serão salvos no sistema para agilizar na próxima vez.</p>
                            </div>
                            <div className="form-group full-width"><label className="form-label">Nome Completo *</label><input type="text" className="form-control" value={newClient.name} onChange={e=>setNewClient({...newClient, name: e.target.value})}/></div>
                            <div className="form-group"><label className="form-label">Seu Contato (WhatsApp) *</label><input type="text" className="form-control" placeholder="Apenas Números" value={newClient.phone} onChange={e=>setNewClient({...newClient, phone: e.target.value})}/></div>
                            <div className="form-group full-width"><label className="form-label">E-mail *</label><input type="email" autoComplete="email" className="form-control" placeholder="seu@email.com" value={newClient.email} onChange={e=>setNewClient({...newClient, email: e.target.value})}/><p style={{fontSize: '12px', color: 'var(--text-muted)', margin: '6px 0 0'}}>Para a confirmação após o pagamento.</p></div>
                            <div className="form-group"><label className="form-label">Endereço Residencial</label><input type="text" className="form-control" value={newClient.address} onChange={e=>setNewClient({...newClient, address: e.target.value})}/></div>
                            {newClientFormError && <div className="form-group full-width" style={{color: 'var(--danger)', fontSize: '13px'}}>{newClientFormError}</div>}
                            <div className="form-group full-width" style={{display:'flex', gap:'10px', marginTop: '10px'}}>
                                <button className="btn-cancel" onClick={() => setIsCreatingNew(false)} disabled={isLoading}>Desistir</button>
                                <button className="btn-submit" style={{flex: 1}} onClick={handleCreateClient} disabled={isLoading}>{isLoading ? 'Salvando BD...' : 'Finalizar Perfil'}</button>
                            </div>
                        </div>
                    )}
                </div>
            )}

            {step === 3 && selectedClient && (
                <div className="booking-section step-container" style={{textAlign: 'center'}}>
                    <div style={{display: 'flex', justifyContent: 'flex-start', marginBottom: '20px'}}>
                        <button className="btn-admin" onClick={() => setStep(2)}><i className="fas fa-arrow-left"></i> Modificar Identidade</button>
                    </div>
                    
                    <h2 className="section-title" style={{marginBottom: '10px'}}>Confirme seu Horário</h2>
                    <p style={{fontSize: '18px', color: 'var(--text-dark)', marginBottom: '20px'}}>Por favor <strong>{selectedClient.name.split(' ')[0]}</strong>, verifique atentamente.</p>

                    <div style={{background: '#fcfcfc', padding: '25px', borderRadius: '12px', textAlign: 'left', marginBottom: '20px', display: 'inline-block', maxWidth: '400px', width: '100%', border: '1px solid var(--border-color)', boxShadow: '0 2px 8px rgba(0,0,0,0.03)'}}>
                        <div style={{marginBottom: '10px', fontSize: '15px'}}><strong style={{color: 'var(--primary-color)'}}>Serviço:</strong> {getClientServiceCardTitle(priceObj)}</div>
                        <div style={{marginBottom: '10px', fontSize: '15px'}}><strong style={{color: 'var(--primary-color)'}}>Agendamento para:</strong> {new Date(bookingData.date + 'T12:00:00').toLocaleDateString('pt-BR')} às {bookingData.time}</div>
                        {bookingData.location && <div style={{marginBottom: '10px', fontSize: '15px'}}><strong style={{color: 'var(--primary-color)'}}>Endereço Cliente:</strong> {bookingData.location}</div>}
                        <div style={{marginBottom: '10px', fontSize: '15px'}}><strong style={{color: 'var(--primary-color)'}}>Local do atendimento:</strong> Ateliê da Pele — Rua Rio Jaguaribe, nº 274</div>
                        <div style={{fontSize: '16px', borderTop: '1px solid #ddd', paddingTop: '10px', marginTop: '15px'}}><strong style={{color: '#00A676'}}>Valor do procedimento:</strong> {formatPrice(priceObj.price)}</div>
                        <div style={{fontSize: '16px', color: '#eab308', fontWeight: 'bold'}}>
                            {effectiveFull ? (
                                <><strong style={{color: '#eab308'}}>Pagamento agora (integral):</strong> {formatPrice(priceObj.price)}</>
                            ) : (
                                <><strong style={{color: '#eab308'}}>Pagamento agora (sinal):</strong> {adiantamento}</>
                            )}
                        </div>
                    </div>

                    <div className="form-group full-width" style={{maxWidth: '400px', margin: '0 auto 16px', textAlign: 'left'}}>
                        <label className="form-label">E-mail para confirmação *</label>
                        <input type="email" autoComplete="email" className="form-control" placeholder="seu@email.com" value={clientEmailForBooking} onChange={e => setClientEmailForBooking(e.target.value)} />
                        <p style={{fontSize: '12px', color: 'var(--text-muted)', margin: '6px 0 0'}}>Enviaremos um resumo amigável assim que o pagamento for confirmado.</p>
                    </div>

                    {/* Bloco UI: Escolher tipo de pagamento */}
                    <div className="payment-type-group">
                        {forceFullPayment ? (
                            <div style={{ fontSize: '13px', lineHeight: 1.45, color: 'var(--text-muted)', padding: '10px 12px', borderRadius: '8px', border: '1px solid var(--border-color)', background: '#f8fafc' }}>
                                Este procedimento é confirmado com <strong style={{ color: 'var(--text-dark)' }}>pagamento integral</strong> agora ({formatPrice(priceObj.price)}).
                            </div>
                        ) : (
                            <>
                                <div>
                                    <label>
                                        <input
                                            type="radio"
                                            name="paymentType"
                                            className="payment-type-radio"
                                            value="partial"
                                            checked={paymentType === "partial"}
                                            onChange={() => setPaymentType("partial")}
                                        />
                                        Pagar apenas o sinal ({adiantamento})
                                    </label>
                                </div>
                                <div style={{marginTop: '8px'}}>
                                    <label>
                                        <input
                                            type="radio"
                                            name="paymentType"
                                            className="payment-type-radio"
                                            value="full"
                                            checked={paymentType === "full"}
                                            onChange={() => setPaymentType("full")}
                                        />
                                        Pagar o valor total ({formatPrice(priceObj?.price || 0)})
                                    </label>
                                </div>
                                {paymentType === "partial" ? (
                                    <div className="payment-type-desc">
                                        Você pagará <strong>{adiantamento}</strong> agora e o restante no dia.
                                    </div>
                                ) : (
                                    <div className="payment-type-desc">
                                        Você pagará o valor total do serviço agora.
                                    </div>
                                )}
                            </>
                        )}
                    </div>

                    <div style={{background: '#fff3cd', border: '1px solid #ffeeba', padding: '15px', borderRadius: '8px', maxWidth: '400px', margin: '0 auto 20px', textAlign: 'left'}}>
                        <label style={{display: 'flex', gap: '10px', alignItems: 'flex-start', cursor: 'pointer', fontSize: '14px', color: '#856404'}}>
                            <input type="checkbox" checked={checkedTerms} onChange={e => setCheckedTerms(e.target.checked)} style={{marginTop: '3px', transform: 'scale(1.2)'}} />
                            <span>
                                {effectiveFull ? (
                                    <>
                                        <strong>Estou ciente</strong> de que o agendamento só será confirmado em definitivo após o <strong>pagamento integral</strong> do procedimento na próxima tela via InfinitePay. <br/><br/>
                                        <i className="fas fa-exclamation-triangle"></i> Sem o pagamento em até 15 minutos, o horário será cancelado e o espaço liberado para outra pessoa.
                                    </>
                                ) : (
                                    <>
                                        <strong>Estou ciente</strong> de que o agendamento só será confirmado em definitivo após o pagamento do sinal na próxima tela via InfinitePay. <br/><br/>
                                        <i className="fas fa-exclamation-triangle"></i> Sem o pagamento em até 15 minutos, o horário será cancelado e o espaço liberado para outra pessoa.
                                    </>
                                )}
                            </span>
                        </label>
                    </div>

                    <div style={{display: 'flex', flexDirection: 'column', alignItems: 'center'}}>
                        <button className="btn-submit" onClick={handleConfirmBooking} disabled={isLoading || !checkedTerms} style={{width: '100%', maxWidth: '400px', padding: '16px', fontSize: '18px', opacity: !checkedTerms ? 0.5 : 1}}>
                            {isLoading ? <><i className="fas fa-spinner fa-spin"></i> Gerando pagamento...</> : 'Solicitar Horário & Ir ao Pagamento'}
                        </button>
                        {apiError && <div className="alert alert-error" style={{marginTop: '20px'}}>{apiError}</div>}
                    </div>
                </div>
            )}

            {/* Restante igual */}
            {step === 4 && completedAppInfo && (() => {
                const liveApp = appointments.find(a => a.id === completedAppInfo.app.id) || completedAppInfo.app;
                const isConfirmed = liveApp.status === 'confirmed';
                const isCancelled = liveApp.status === 'cancelled';
                const isPending = liveApp.status === 'pending_payment';
                const dateStr = new Date(liveApp.date + 'T12:00:00').toLocaleDateString('pt-BR');

                const formatBRL = (value) => {
                    if (value === null || value === undefined || value === '') return null;
                    const n = Number(value);
                    if (!Number.isFinite(n)) return null;
                    return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                };

                const safeFirstName = (fullName) => {
                    const name = (fullName || '').trim();
                    if (!name) return 'Cliente';
                    return name.split(/\s+/)[0] || 'Cliente';
                };

                const clientName = completedAppInfo?.client?.name || 'Cliente';
                const serviceName = getClientServiceCardTitle(completedAppInfo?.service) || 'Serviço';
                const servicePriceBRL = formatBRL(completedAppInfo?.service?.price);

                const paymentType = liveApp?.paymentType || null;
                const amountChargedBRL = formatBRL(liveApp?.amountCharged);
                const remainingAmountBRL = formatBRL(liveApp?.remainingAmount);
                const captureMethod = liveApp?.captureMethod || null;

                const svcPriceNum = Number(completedAppInfo?.service?.price);
                const checkoutIntegral =
                    String(paymentType || '').toLowerCase() === 'full' || isProcedurePriceAtOrBelowSignal(svcPriceNum);
                const dueNowDisplayBRL = amountChargedBRL || servicePriceBRL;

                const baseLines = [
                    `Olá! Sou ${safeFirstName(clientName)} e fiz um agendamento no Ateliê da Pele. Gostaria de confirmar.`,
                    ``,
                    `Cliente: ${clientName}`,
                    `Serviço: ${serviceName}`,
                    `Data: ${dateStr}`,
                    `Horário: ${liveApp.time}`
                ];

                const paymentLines = (() => {
                    if (checkoutIntegral) {
                        return [
                            ``,
                            `Pagamento: integral (valor total do procedimento)`,
                            amountChargedBRL ? `Valor cobrado/pago: ${amountChargedBRL}` : null,
                            captureMethod ? `Registro: ${captureMethod}` : null
                        ].filter(Boolean);
                    }

                    if (paymentType === 'partial') {
                        return [
                            ``,
                            `Pagamento: parcial (sinal)`,
                            amountChargedBRL ? `Valor pago agora: ${amountChargedBRL}` : null,
                            remainingAmountBRL ? `Valor restante (para o dia do atendimento): ${remainingAmountBRL}` : null,
                            captureMethod ? `Forma de pagamento: ${captureMethod}` : null,
                            `O valor restante será acertado no atendimento, presencialmente.`
                        ].filter(Boolean);
                    }

                    if (paymentType === 'full') {
                        return [
                            ``,
                            `Pagamento: total`,
                            `Procedimento totalmente pago.`,
                            amountChargedBRL ? `Valor pago: ${amountChargedBRL}` : null,
                            captureMethod ? `Forma de pagamento: ${captureMethod}` : null
                        ].filter(Boolean);
                    }

                    // Fallback compatível com o comportamento atual
                    return [
                        ``,
                        servicePriceBRL ? `Valor: ${servicePriceBRL}` : null
                    ].filter(Boolean);
                })();

                const whatsappMsg = [...baseLines, ...paymentLines].join('\n');
                const adminWaDigits = String(adminWhatsApp || '').replace(/\D/g, '');
                const zapLink = adminWaDigits
                    ? `https://wa.me/${adminWaDigits}?text=${encodeURIComponent(whatsappMsg)}`
                    : null;

                return (
                <div className="booking-section step-container" style={{textAlign: 'center'}}>
                    {isPending && (
                        <>
                            <i className="fas fa-clock" style={{fontSize: '50px', color: '#f59e0b', margin: '0 auto 15px', display: 'block'}}></i>
                            <h2 style={{color: '#d97706', marginBottom: '10px'}}>Horário Bloqueado Aguardando Pagamento</h2>
                            <p style={{color: 'var(--text-muted)', marginBottom: '20px'}}>
                                {checkoutIntegral

                                Valor a pagar agora: {dueNowDisplayBRL || adiantamento}

                                style={{
                                    fontSize: '12px',
                                    lineHeight: 1.45,
                                    color: '#334155',
                                    background: 'rgba(255,255,255,0.75)',
                                    border: '1px solid #bae6fd',
                                    borderRadius: '8px',
                                    padding: '10px 12px',
                                    marginBottom: '14px',
                                    textAlign: 'left',
                                    maxWidth: '100%',
                                    boxSizing: 'border-box',
                                    wordBreak: 'break-word'
                                }}
                            >
                                <span style={{ display: 'block', color: '#0c4a6e', fontWeight: 600, marginBottom: '4px' }}>Informação</span>
                                <span style={{ display: 'block' }}>
                                    Política de cancelamento: pagamentos realizados como sinal ou valor integral poderão ser reembolsados integralmente caso o cancelamento seja solicitado com até 48 horas de antecedência. Após esse prazo, o valor poderá ser convertido em crédito para um novo agendamento, conforme disponibilidade.
                                </span>
                            </div>
                            <a href={liveApp.paymentUrl} target="_blank" rel="noreferrer" className="btn-submit pay-btn" style={{width: '100%', display: 'block', textDecoration: 'none', padding: '15px', boxSizing: 'border-box'}}>
                                <i className="fas fa-money-bill-wave"></i> Pagar via InfinitePay

                    {isConfirmed && adminWaDigits && zapLink && (

                                <i className="fab fa-whatsapp" style={{fontSize: '24px'}}></i> Enviar mensagem no WhatsApp
                            </a>

                    {isConfirmed && !adminWaDigits && (
                        <div style={{marginBottom: '30px', textAlign: 'center', color: 'var(--text-muted)', fontSize: '14px', maxWidth: '420px', marginLeft: 'auto', marginRight: 'auto', lineHeight: 1.5}}>
                            O link automático do WhatsApp não está disponível. Defina a variável <strong>ADMIN_WHATSAPP</strong> no servidor (somente números, com DDI) e atualize a página.
                        </div>
                    )}

                    <div style={{display: 'flex', flexDirection: 'column', gap: '15px', alignItems: 'center'}}>
                        <button className="btn-admin" style={{margin: '0 auto'}} onClick={() => {
                            setStep(1);
                            setBookingData({date:'', time:'', notes:'', location:''});
                            setSelectedService('');
                            setServiceDetailOpenId(null);
                            setSelectedClient(null);
                            setCheckedTerms(false);
                            setCompletedAppInfo(null);
                        }}>Fazer novo ou Voltar ao início</button>

            })()}
