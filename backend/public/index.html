<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="description" content="Agendamento online para os melhores tratamentos estéticos.">

    <style>
        .filter-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 8px 16px; border: 1px solid var(--border-color); background: var(--card-bg); border-radius: 8px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .tab-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .wa-btn { display: inline-flex; align-items: center; gap: 8px; background: #25D366; color: white; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 500; margin-top: 10px; transition: 0.2s; }
        .wa-btn:hover { background: #128C7E; transform: translateY(-2px); }
        .pay-btn { background: #00A676; color: white !important; font-weight: bold; border: none; }
        .pay-btn:hover { background: #00875F; }
        .past-slot { opacity: 0.4; text-decoration: line-through; pointer-events: none; background: #f3f4f6; border-color: #e5e7eb; }
        .step-container { animation: fadeIn 0.4s ease; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-left: 8px; text-transform: none; letter-spacing: 0.01em; }
        /* Contato WhatsApp oficial — opcional, fora do fluxo de confirmação */
        .atelie-wa-float {
            position: fixed;
            z-index: 50;
            bottom: max(16px, env(safe-area-inset-bottom, 0px));
            right: max(16px, env(safe-area-inset-right, 0px));
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: #334155;
            color: #f8fafc;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 6px 22px rgba(15, 23, 42, 0.2);
            max-width: min(calc(100vw - 28px), 280px);
            box-sizing: border-box;
            border: 1px solid rgba(148, 163, 184, 0.45);
        }
        .atelie-wa-float:hover { background: #1e293b; color: #fff; }
        .atelie-wa-float .fab { font-size: 22px; color: #25D366; flex-shrink: 0; }
        .atelie-wa-float__label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Desktop/tablet: alinhar ao bloco central (~mesma largura máx. do .container--wide), sem colar na borda da janela */
        @media (min-width: 900px) {
            .atelie-wa-float {
                right: calc(max(0px, (100vw - min(1220px, calc(100vw - 24px))) / 2) + 14px);
                bottom: max(20px, env(safe-area-inset-bottom, 0px));
            }
        }
        @media (min-width: 600px) and (max-width: 899px) {
            .atelie-wa-float {
                right: max(20px, env(safe-area-inset-right, 0px));
            }
        }
        @media (max-width: 768px) {
            .atelie-wa-float {
                padding: 11px 12px;
                bottom: max(12px, env(safe-area-inset-bottom, 0px));
                right: max(12px, env(safe-area-inset-right, 0px));
            }
            .atelie-wa-float__label { display: none; }
            .atelie-wa-float .fab { font-size: 20px; }
        }
        .atelie-wa-discrete {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .atelie-wa-discrete:hover { color: #475569; }
        .atelie-wa-discrete .fab { font-size: 16px; color: #25D366; }
        .report-table-wrap { width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; border: 1px solid var(--border-color); background: var(--card-bg); }
        .admin-report-table { min-width: 720px; }
        .admin-report-table th, .admin-report-table td { vertical-align: middle; }
        .report-col-nowrap { white-space: nowrap; }
        .report-col-service { min-width: 140px; max-width: 280px; white-space: normal; word-break: break-word; }
        .report-col-client { min-width: 120px; max-width: 220px; word-break: break-word; }
        .report-kpi-value { white-space: nowrap; }
        /* Filtros de período — Relatório de Faturamento (somente visual / mobile) */

            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 10px;
        }

            flex: 0 1 auto;

        .report-filters-row .report-filters-search {

        /* Explicação sequência vs separados — etapa de agendamento (somente leitura visual) */

        .schedule-mode-help__block {

        .st-cancelled { background: #f8d7da; color: #721c24; }

        /* Meus Agendamentos — card compacto, badge sem overflow horizontal */

        .my-app-procedures-box {

        .my-app-card-footer-actions .btn-cancel,

            flex: 0 1 auto;

        @media (max-width: 520px) {
            .my-app-procedure-actions,
            .my-app-card-footer-actions {

            .my-app-procedure-actions .my-app-btn-secondary,
            .my-app-card-footer-actions .btn-cancel,
            .my-app-card-footer-actions .my-app-btn-secondary {

        /* Local do ateliê + Google Maps — Agenda Geral (admin) e Meus Agendamentos */
        .appointment-location {
            font-size: 13px;
            max-width: 100%;
            box-sizing: border-box;
            overflow-wrap: anywhere;
        }
        .appointment-location__address {
            display: block;
        }
        .appointment-map-link {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 13px;
            color: #0ea5e9;
            text-decoration: none;
            max-width: 100%;
            width: 100%;
            box-sizing: border-box;
            flex-wrap: wrap;
            row-gap: 4px;
        }
        .appointment-map-link i {
            flex-shrink: 0;
        }
        .my-app-card__cancel {
            width: 100%;
            max-width: 100%;

            word-break: break-word;

        .refresh-btn { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .refresh-btn:hover { background: var(--secondary-color); }
        /* Adicionando um espacinho para o grupo de opção de pagamento, se precisar depois */

        .payment-type-radio { margin-right: 10px; }
        .payment-type-desc { margin: 8px 0 10px 0; font-size: 14px; color: var(--text-dark);}

        /* Painel profissional — sidebar + área principal (paleta atual) */
        .admin-panel-root {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            text-align: left;
            overflow-x: clip;
        }
        .admin-layout {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        .admin-sidebar {
            flex-shrink: 0;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 14px;
            overflow: hidden;
            order: 1;
        }
        .admin-sidebar-inner {
            padding: 12px 14px 14px;
            box-sizing: border-box;
        }
        .admin-sidebar-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 10px;
        }
        .admin-sidebar-heading {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-dark);
            font-family: inherit;
        }
        .admin-sidebar-toggle {
            display: none;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;

            color: var(--text-dark);

        .admin-sidebar-toggle:hover {

            border-color: rgba(111, 76, 165, 0.28);
        }
        .admin-sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        .admin-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            text-align: left;
            justify-content: flex-start;
            white-space: normal;
            word-break: break-word;
            line-height: 1.35;
            min-height: 44px;
        }
        .admin-menu-item i.fas,
        .admin-menu-item i.far {
            flex-shrink: 0;
            width: 1.15em;
            text-align: center;
        }
        .admin-menu-item--exit {
            margin-top: 6px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            background: var(--card-bg);
            color: var(--text-dark);
            border-color: var(--border-color);
        }
        .admin-menu-item--exit:hover {
            background: rgba(111, 76, 165, 0.06);
        }
        .admin-content {
            flex: 1;
            min-width: 0;
            max-width: 100%;
            box-sizing: border-box;
            order: 2;
        }
        .admin-content-body {
            margin-top: 16px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        .admin-placeholder-panel {
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            text-align: center;

        .admin-placeholder-panel h3 {
            margin: 0 0 10px;

        }
        .admin-placeholder-panel p {
            margin: 0;
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        /* Mobile ≤768px: sem sidebar; navegação em grade (sem scroll horizontal) */
        @media (max-width: 768px) {
            .admin-panel-root .admin-layout {
                flex-direction: column;
                max-width: 100%;
                overflow-x: clip;
            }
            .admin-panel-root .admin-sidebar {
                display: none !important;
            }
            .admin-panel-root .admin-panel-head {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                margin-bottom: 10px;
            }
            .admin-panel-root .admin-panel-head h2 {
                margin: 0;

                width: 100%;
                min-width: 0;
                word-break: normal;
                overflow-wrap: anywhere;
            }

                align-self: flex-start;

            .admin-panel-root .admin-content-body {

        /* Desktop/tablet largo: sidebar a partir de 769px (mobile inclui 768px). */
        @media (min-width: 769px) {

                align-items: flex-start;
                gap: 16px;
            }
            .admin-sidebar {
                width: 240px;
                margin-bottom: 0;
                position: sticky;
                top: 12px;
                align-self: flex-start;
                max-height: calc(100vh - 88px);
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            .admin-sidebar-toggle {
                display: inline-flex;
            }
            .admin-sidebar--collapsed {
                width: 56px;

            .admin-sidebar--collapsed .admin-sidebar-heading {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }

                justify-content: center;
                margin-bottom: 8px;
            }
            .admin-sidebar--collapsed .admin-menu-item-label {
                display: none;
            }
            .admin-sidebar--collapsed .admin-menu-item {
                justify-content: center;
                padding-left: 10px;
                padding-right: 10px;

                padding-top: 10px;

            .admin-sidebar--collapsed .admin-sidebar-nav {
                gap: 6px;
            }

<body>
    <div id="root"></div>

    <script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:8080'
    : 'https://' + window.location.hostname;

const ADMIN_TOKEN_STORAGE_KEY = 'atelie_admin_token';
/** Dígitos do telefone usados em “Meus agendamentos” (sessão) para mesclar detalhes sem listar tudo. */
const MY_APPOINTMENTS_PHONE_STORAGE_KEY = 'atelie_my_appointments_phone_digits';

/** Endereço físico do ateliê e link de busca no Google Maps (mesmo padrão do painel profissional). */
const ATELIE_STUDIO_ADDRESS_TEXT = 'Ateliê da Pele — Rua Rio Jaguaribe, nº 274';
const ATELIE_STUDIO_GOOGLE_MAPS_URL =
    'https://www.google.com/maps/search/?api=1&query=Ateliê+da+Pele+Rua+Rio+Jaguaribe+274';

/** Fallback se `GET /config/public` → `adminWhatsApp` vier vazio (mesmo número já usado no projeto). */
const ATELIE_WHATSAPP_FALLBACK_DIGITS = '554184850169';
const ATELIE_WHATSAPP_DEFAULT_MESSAGE = 'Olá! Gostaria de falar com o Ateliê da Pele.';
/** Pré-preenchimento ao cliente abrir o WhatsApp do ateliê a partir de “Meus Agendamentos”. */
const MY_APPOINTMENTS_ATELIE_WA_MESSAGE = 'Olá! Gostaria de falar sobre meu agendamento no Ateliê da Pele.';

/** Somente dígitos para wa.me; se inválido ou curto demais, usa fallback (Railway: ADMIN_WHATSAPP). */
const sanitizePublicWhatsAppDigits = (raw) => {
    const d = String(raw ?? '').replace(/\D/g, '');
    return d.length >= 10 ? d : ATELIE_WHATSAPP_FALLBACK_DIGITS;
};

const buildAtelieWhatsAppHref = (adminWhatsAppFromApi, message = ATELIE_WHATSAPP_DEFAULT_MESSAGE) => {
    const waId = sanitizePublicWhatsAppDigits(adminWhatsAppFromApi);
    return `https://wa.me/${waId}?text=${encodeURIComponent(message)}`;
};

const AtelieWhatsAppFloatingButton = ({ adminWhatsApp }) => (
    <a
        href={buildAtelieWhatsAppHref(adminWhatsApp)}
        className="atelie-wa-float"
        target="_blank"
        rel="noopener noreferrer"
        title="Fale conosco pelo WhatsApp"
        aria-label="Fale conosco pelo WhatsApp"
    >
        <i className="fab fa-whatsapp" aria-hidden />
        <span className="atelie-wa-float__label">Fale conosco</span>
    </a>
);

const AtelieWhatsAppDiscreteLink = ({ adminWhatsApp }) => (
    <a
        href={buildAtelieWhatsAppHref(adminWhatsApp)}
        className="atelie-wa-discrete"
        target="_blank"
        rel="noopener noreferrer"
        title="Fale conosco pelo WhatsApp (opcional)"
    >
        <i className="fab fa-whatsapp" aria-hidden />
        Fale conosco pelo WhatsApp
    </a>
);

/**
 * Catálogo ativo (etapa 1). Com API, usar `GET /public/services`. Sem rede/DB, fallback local alinhado a `SERVICES_CATALOG` no servidor.
 * Pacotes promocionais de fallback: `FALLBACK_PROMO_SERVICES` (visíveis só com a flag global em `config/public`).
 * SERVICES_LEGACY: só para exibir agendamentos antigos já gravados no banco.
 */
const SERVICES = [
    {
        id: 'limpeza_pele_profunda',
        name: 'Limpeza de pele profunda',
        price: 119,
        category: 'Estética facial',
        duration: 60,
        summary: 'Protocolo completo com LED para pele equilibrada e luminosa.',
        detail:
            'Inclui limpeza profunda de cravos, peeling ultrassônico, revitalização facial com produto específico para seu tipo de pele e finalização com máscara de LED para estímulo de colágeno, equilíbrio da oleosidade e aceleração da cicatrização da acne.'
    },
    {
        id: 'limpeza_pele_mascara',
        name: 'Limpeza de pele profunda + máscara facial específica',
        price: 150,
        category: 'Estética facial',
        duration: 60,
        summary: 'Tudo da limpeza profunda e máscara facial sob medida.',
        detail:
            'Inclui limpeza profunda de cravos, peeling ultrassônico, revitalização facial com produto específico para seu tipo de pele, finalização com máscara de LED e máscara facial específica (antiacne, rejuvenescimento, lifting, colágeno ou vitamina C).'
    },
    {
        id: 'dep_intima_com_anus',
        name: 'Depilação íntima completa com ânus',
        cardTitle: 'Depilação íntima completa Premium',
        price: 95,
        category: 'Depilação',
        duration: 60,
        detail: 'Depilação completa da região íntima com acabamento incluindo a região anal.'
    },
    {
        id: 'dep_intima_sem_anus',
        name: 'Depilação íntima completa sem ânus',
        cardTitle: 'Depilação íntima Essencial',
        price: 85,
        category: 'Depilação',
        duration: 60,
        detail: 'Depilação completa da região íntima sem inclusão da região anal.'
    },

/** Agrupa pacotes promocionais em um card por campanha (tela inicial do cliente). */
const buildClientCampaignBundles = (promoList) => {
    const list = Array.isArray(promoList) ? promoList : [];
    const groups = new Map();
    for (const s of list) {
        const cid = String(s.promotionalCampaign || '').trim();
        const groupKey = cid || `__solo__:${s.id}`;
        if (!groups.has(groupKey)) groups.set(groupKey, []);
        groups.get(groupKey).push(s);
    }
    const bundles = [];
    for (const [groupKey, members] of groups) {
        members.sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'pt-BR'));
        const cid = groupKey.startsWith('__solo__') ? '' : groupKey;
        const price = Math.round(members.reduce((sum, m) => sum + (Number(m.price) || 0), 0) * 100) / 100;
        const duration = members.reduce((sum, m) => sum + (Number(m.duration) || DEFAULT_APPOINTMENT_DURATION_MIN), 0);
        const first = members[0];
        const campaignName =
            String(first.promotionalCampaignName || '').trim() ||
            (cid
                ? cid.replace(/_/g, ' ').replace(/\b\w/g, (ch) => ch.toUpperCase())
                : getClientServiceCardTitle(first));
        const cardId = cid ? `campaign:${cid}` : String(first.id);
        bundles.push({
            id: cardId,
            campaignId: cid || first.id,
            name: campaignName,
            cardTitle: campaignName,
            category: PROMO_CLIENT_FILTER_LABEL,
            price,
            duration,
            summary: first.summary || '',
            detail: first.detail || '',
            includedServices: members.map((m) => ({
                id: m.id,
                label: String(m.cardTitle || m.card_title || m.name || '').trim()
            })),
            memberServiceIds: members.map((m) => String(m.id)),
            isCampaignBundle: true,
            isPromotionalPackage: true,
            promotionalCampaign: cid || undefined,
            promotionalCampaignName: campaignName,
            sortOrder: Math.max(0, ...members.map((m) => Number(m.sortOrder) || 0))
        });
    }
    bundles.sort((a, b) => {
        const d = (Number(a.sortOrder) || 0) - (Number(b.sortOrder) || 0);
        if (d !== 0) return d;
        return String(a.name || '').localeCompare(String(b.name || ''), 'pt-BR');
    });
    return bundles;
};

    if (item.isCampaignBundle && Array.isArray(item.memberServiceIds) && item.memberServiceIds.length > 0) {
        return item.memberServiceIds.every((id) => sel.includes(id));
    }
    return sel.includes(item.id);
};

/** Linhas do resumo (step 3): campanhas agrupadas + serviços avulsos. */
const buildBookingProcedureSummaryLines = (selectedIds, catalog, campaignBundles) => {
    const ids = Array.isArray(selectedIds) ? [...selectedIds] : [];
    const used = new Set();
    const lines = [];
    const bundles = Array.isArray(campaignBundles) ? campaignBundles : [];
    for (const b of bundles) {
        const mids = b.memberServiceIds || [];
        if (!mids.length || !mids.every((id) => ids.includes(id))) continue;
        mids.forEach((id) => used.add(id));
        const includes = mids.map((id) => {
            const m = getServiceMeta(id, { clientCatalog: catalog });
            return m ? getClientServiceCardTitle(m) : id;
        });
        lines.push({
            key: `campaign:${b.campaignId || b.id}`,
            type: 'campaign',
            title: b.name || b.cardTitle || 'Campanha',
            includes,
            total: b.price
        });
    }
    for (const id of ids) {
        if (used.has(id)) continue;
        const m = getServiceMeta(id, { clientCatalog: catalog });
        lines.push({
            key: `svc:${id}`,
            type: 'service',
            title: m ? getClientServiceCardTitle(m) : id,
            total: Number(m?.price) || 0
        });
    }
    return lines;
};

const getAppointmentServiceIdsFromApp = (app) => {
    if (!app) return [];
    if (Array.isArray(app.serviceIds) && app.serviceIds.length > 0) {
        const out = [];
        const seen = new Set();
        for (const x of app.serviceIds) {
            const id = String(x || '').trim();
            if (!id || seen.has(id)) continue;
            seen.add(id);
            out.push(id);
        }
        if (out.length) return out;
    }
    const sid = app.serviceId || app.service_id;
    return sid ? [String(sid)] : [];
};

const APPOINTMENT_ITEM_STATUS_CANCELLED = 'cancelled';

const getServiceSlotsFromApp = (app, catalogOpt) => {
    if (!app) return [];
    if (Array.isArray(app.serviceSlots) && app.serviceSlots.length > 0) {
        return app.serviceSlots
            .map((s, idx) => ({
                slotIndex: s.slotIndex != null ? s.slotIndex : idx,
                serviceId: String(s.serviceId || s.service_id || '').trim(),
                date: String(s.date || '').trim(),
                time: normalizeSlotTimeLabel(s.time) || String(s.time || '').trim(),
                status: String(s.status || 'active').toLowerCase(),
                cancelledAt: s.cancelledAt || null,
                cancelReason: s.cancelReason || null,
                rescheduledAt: s.rescheduledAt || null,
                name: s.serviceName || s.name || null,
                price: s.price != null ? Number(s.price) : null
            }))
            .filter((s) => s.serviceId && s.date && s.time);
    }
    const ids = getAppointmentServiceIdsFromApp(app);
    const d = String(app.date || '').trim();
    const t = normalizeSlotTimeLabel(app.time) || String(app.time || '').trim();
    if (!d || !t || ids.length === 0) return [];
    if (ids.length === 1) return [{ serviceId: ids[0], date: d, time: t }];
    let cur = parseTimeToMinutes(t);
    if (cur == null) return [];
    const out = [];
    for (const id of ids) {
        const meta = getServiceMeta(id, { clientCatalog: catalogOpt });
        const mm =
            meta && typeof meta.duration === 'number' && Number.isFinite(meta.duration)
                ? meta.duration
                : DEFAULT_APPOINTMENT_DURATION_MIN;
        const hh = String(Math.floor(cur / 60)).padStart(2, '0');
        const mi = String(cur % 60).padStart(2, '0');
        const tStr = normalizeSlotTimeLabel(`${hh}:${mi}`);
        if (!tStr) return [];
        out.push({ serviceId: id, date: d, time: tStr });
        cur += mm;
    }
    return out;
};

const getTotalDurationMinutesForServiceIds = (ids, catalogOpt) => {
    const arr = Array.isArray(ids) ? ids : [];
    if (arr.length === 0) return DEFAULT_APPOINTMENT_DURATION_MIN;
    return arr.reduce((sum, id) => {
        const m = getServiceMeta(id, { clientCatalog: catalogOpt });
        const d = m && typeof m.duration === 'number' ? m.duration : DEFAULT_APPOINTMENT_DURATION_MIN;
        return sum + d;
    }, 0);
};

const formatAgendaServiceSummary = (app, catalogOpt) => {
    const lines = getActiveLineItemsFromAppointmentApp(app, catalogOpt);
    if (!lines.length) return { label: '—', total: null, scheduleHint: '' };
    const label = lines.map((l) => l.name || l.id).join(' + ');
    const total = lines.reduce((s, l) => s + (Number.isFinite(Number(l.price)) ? Number(l.price) : 0), 0);
    const slots = getActiveLineItemsFromAppointmentApp(app, catalogOpt).map((l) => ({
        serviceId: l.id,
        date: l.date,
        time: l.time
    }));
    const mode = String(app.scheduleMode || app.schedule_mode || '').toLowerCase();
    let scheduleHint = '';
    if (slots.length > 1) {
        const sameDay = slots.every((s) => s.date === slots[0].date);
        if (mode === 'sequential' && sameDay) {
            const sorted = [...slots].sort(
                (a, b) => (parseTimeToMinutes(a.time) || 0) - (parseTimeToMinutes(b.time) || 0)
            );
            const d0 = sorted[0].date;
            const last = sorted[sorted.length - 1];
            const lastStart = parseTimeToMinutes(last.time) || 0;
            const lastDur = getTotalDurationMinutesForServiceIds([last.serviceId], catalogOpt);
            const rangeEnd = formatMinutesAsHHMM(lastStart + lastDur);
            scheduleHint = `${new Date(d0 + 'T12:00:00').toLocaleDateString('pt-BR')} ${sorted[0].time}–${rangeEnd} (sequência)`;
        } else {
            scheduleHint = slots
                .map(
                    (s) =>
                        `${new Date(s.date + 'T12:00:00').toLocaleDateString('pt-BR')} ${s.time}`
                )
                .join(' · ');
        }
    }
    return { label, total: Math.round(total * 100) / 100, scheduleHint };
};

const FIXED_SIGNAL_AMOUNT = 30.00;

/** Ordem das abas de categoria na etapa 1 (só entram categorias que existem em serviços não promocionais). «Campanhas» é reservada à aba de pacotes. Chip «Geral» não é exibido — serviços em Geral aparecem em «Todos». */
const SERVICE_CATEGORY_ORDER = ['Estética facial', 'Depilação', 'Combo depilação', 'Bem-estar', 'Legado'];

/**
 * Categoria inferida pelo nome (cadastro novo de serviço comum no painel).
 * Ordem: campanha/vale → combo → estética facial → depilação → bem-estar → Geral.
 */
function inferServiceCategoryFromName(nameRaw) {
    const raw = String(nameRaw || '').trim();
    if (!raw) return 'Geral';
    const n = raw
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();

    if (/vale[\s_-]*presente|valepresente|\bcampanha\b/.test(n)) return 'Campanhas';
    if (/\bcombo\b/.test(n)) return 'Combo depilação';
    if (/\blimpeza\b|\bfacial\b|\bpele\b|mascara/.test(n)) return 'Estética facial';
    if (/depil|axil|buco|perna|coxa|anus|nariz/.test(n)) return 'Depilação';
    if (/reflexologia|massagem|relaxante|\bpes\b|bem[\s-]*estar|bemestar/.test(n)) return 'Bem-estar';
    return 'Geral';
}

const isValidEmailFormat = (s) => {
    const t = String(s || '').trim().toLowerCase();
    if (!t || t.length > 254) return false;
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t);
};

/** Valores financeiros já normalizados pela API (paidAmount, paymentSummary); só formatação para “Meus Agendamentos”. */
const resolveAppointmentPaidForDisplay = (app) => {
    const ps = app && app.paymentSummary;
    let paid = ps != null && ps.paidAmount != null ? Number(ps.paidAmount) : NaN;
    if (!Number.isFinite(paid)) {
        paid = Number(app.paidAmount ?? app.paid_amount);
    }
    if (!Number.isFinite(paid)) paid = null;

    const remRaw = app.remainingAmount ?? (ps && ps.remainingAmount);
    const rem = remRaw != null ? Number(remRaw) : NaN;
    const remaining = Number.isFinite(rem) ? rem : null;

    const pType = String(app.paymentType || '').toLowerCase();
    const showRemaining =
        (pType === 'partial' || pType === 'local') && remaining != null && remaining > 0.005;

    return { paid, remaining: showRemaining ? remaining : null, showRemaining };
};

/**
 * Só a modalidade de pagamento (sem status), para não duplicar o texto do `StatusBadge`
 * com `paymentSummary.paymentStatusLabel`.
 */
const getMyAppointmentsPaymentModeLabel = (app) => {
    const ps = app && app.paymentSummary;
    if (ps) {
        if (ps.isLocal) return 'Pagamento no local';
        if (ps.isFull) return 'Pagamento online';
        if (ps.isPartial) return 'Parcial (histórico)';
    }
    const pt = String(app?.paymentType || app?.payment_type || '').toLowerCase();
    const pm = String(app?.paymentMethod || app?.payment_method || '').toLowerCase();
    if (pt === 'local' || pm === 'local') return 'Pagamento no local';
    if (pt === 'full') return 'Pagamento online';
    if (pt === 'partial') return 'Parcial (histórico)';
    return null;
};

const formatBRLFromNumber = (n) => {
    if (n == null || !Number.isFinite(Number(n))) return null;
    return Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
};

/**
 * Bloco “Pagamento” só para o corpo do card em Meus Agendamentos (texto/layout).
 * Usa os mesmos números que `resolveAppointmentPaidForDisplay` e a mesma leitura de pendência local que `StatusBadge`.
 */
const buildMyAppointmentsPaymentBlock = (app, serviceTotal) => {
    const status = String(app?.status || '').trim();
    if (status === 'cancelled') return null;

    const { paid, remaining, showRemaining } = resolveAppointmentPaidForDisplay(app);
    const paidLabel =
        paid != null && Number.isFinite(Number(paid)) && Number(paid) > 0.005 ? formatBRLFromNumber(paid) : null;
    const remLabel = showRemaining && remaining != null ? formatBRLFromNumber(remaining) : null;

    const pt = String(app?.paymentType || app?.payment_type || '').toLowerCase();
    const pm = String(app?.paymentMethod || app?.payment_method || '').toLowerCase();
    const isLocalKind = pt === 'local' || pm === 'local';

    const remRaw = app?.remainingAmount ?? app?.remaining_amount ?? (app?.paymentSummary && app.paymentSummary.remainingAmount);
    const hadRemainingProp = remRaw !== undefined && remRaw !== null && remRaw !== '';
    const remNum = hadRemainingProp ? Number(remRaw) : null;
    const remPending = hadRemainingProp && remNum != null && Number.isFinite(remNum) && remNum > 0.005;

    const paidRaw = app?.paidAmount ?? app?.paid_amount ?? (app?.paymentSummary && app.paymentSummary.paidAmount);
    const paidNum = paidRaw !== undefined && paidRaw !== null && paidRaw !== '' ? Number(paidRaw) : NaN;
    const paidRecorded = Number.isFinite(paidNum) && paidNum > 0.005;
    const localPending = isLocalKind && (remPending || (!hadRemainingProp && !paidRecorded));

    const procedureTotalLabel =
        typeof serviceTotal === 'number' && Number.isFinite(serviceTotal) ? formatPrice(serviceTotal) : null;
    const valueDash = '—';

    const rowsFrom = (pairs) => pairs.filter((p) => p && p.value && p.value !== valueDash);

    if (pt === 'partial') {
        const rows = [];
        if (paidLabel) rows.push({ label: 'Valor pago', value: paidLabel });
        if (remLabel) rows.push({ label: 'Valor restante', value: remLabel });
        return { summaryLine: 'Parcial — histórico', rows };
    }

    if (status === 'pending_payment') {
        if (pt === 'full') {
            return {
                summaryLine: 'Online — aguardando pagamento',
                rows: [{ label: 'Valor', value: procedureTotalLabel || remLabel || paidLabel || valueDash }]
            };
        }
        return {
            summaryLine: isLocalKind ? 'No local — pendente' : 'Pagamento — pendente',
            rows: [{ label: 'Valor a pagar', value: remLabel || procedureTotalLabel || paidLabel || valueDash }]
        };
    }

    if (isLocalKind) {
        if ((status === 'confirmed' || status === 'completed') && localPending) {
            return {
                summaryLine: 'No local — pendente',
                rows: [{ label: 'Valor a pagar', value: remLabel || procedureTotalLabel || paidLabel || valueDash }]
            };
        }
        return {
            summaryLine: 'No local — confirmado',
            rows: rowsFrom([{ label: 'Valor pago', value: paidLabel || procedureTotalLabel || null }])
        };
    }

    if (pt === 'full' && (status === 'confirmed' || status === 'completed')) {
        return {
            summaryLine: 'Online — confirmado',
            rows: rowsFrom([{ label: 'Valor pago', value: paidLabel || procedureTotalLabel || null }])
        };
    }

    const mode = getMyAppointmentsPaymentModeLabel(app);
    if (!mode) return null;
    const rows = [];
    if (paidLabel) rows.push({ label: 'Valor pago', value: paidLabel });
    if (remLabel) rows.push({ label: 'Valor restante', value: remLabel });
    const short =
        mode.indexOf('local') !== -1
            ? 'No local'
            : mode.indexOf('online') !== -1
              ? 'Online'
              : mode.replace(/^Parcial.*/, 'Parcial — histórico');
    return { summaryLine: short, rows };
};

const getLocalTodayStr = () => {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    return new Date(now.getTime() - offset).toISOString().split('T')[0];
};

/** Alinhado ao backend: duração na grade e intervalo mínimo entre inícios. */
const DEFAULT_APPOINTMENT_DURATION_MIN = 60;
const MIN_START_GAP_MINUTES = 60;

const normalizeSlotTimeLabel = (t) => {
    if (t == null) return null;
    const s = String(t).trim();
    const m = s.match(/^(\d{1,2}):(\d{2})/);
    if (!m) return null;
    const hh = String(m[1]).padStart(2, '0');
    return `${hh}:${m[2]}`;
};

const parseTimeToMinutes = (timeStr) => {
    const n = normalizeSlotTimeLabel(timeStr);
    if (!n) return null;
    const [h, mm] = n.split(':').map(Number);
    if (!Number.isFinite(h) || !Number.isFinite(mm)) return null;
    return h * 60 + mm;
};

const formatMinutesAsHHMM = (totalMin) => {
    if (totalMin == null || !Number.isFinite(totalMin)) return '';
    const h = Math.floor(totalMin / 60) % 24;
    const m = Math.round(totalMin % 60);
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
};

/**
 * Grade em intervalos de 1 hora (só :00). Seg–sex 14h–20h; sáb 13h–18h; domingo fechado.
 * Considera bloqueio de dia inteiro (blocked_full_days), bloqueios por horário, ocupação e intervalo mínimo entre inícios.
 */
const generateTimeSlots = (
    dateString,
    existingAppointments,
    blockedSlotsList = [],
    blockedFullDaysList = [],
    selectedServiceIdsForPreview = [],
    catalogForMeta = null
) => {
    if (!dateString) return [];

    const dateObj = new Date(dateString + 'T12:00:00');
    const dayOfWeek = dateObj.getDay();

    const now = new Date();
    const todayStr = getLocalTodayStr();
    const isToday = dateString === todayStr;
    const currentTotalMinutes = now.getHours() * 60 + now.getMinutes();

    let slots = [];
    if (dayOfWeek === 0) return [];
    if (dayOfWeek === 6) {
        for (let hour = 13; hour <= 18; hour++) {
            slots.push(`${String(hour).padStart(2, '0')}:00`);
        }
    } else {
        for (let hour = 14; hour <= 20; hour++) {
            slots.push(`${String(hour).padStart(2, '0')}:00`);
        }
    }

    const fullDayBlocked = (blockedFullDaysList || []).some((b) => b.date === dateString);

    const blockedSet = new Set(
        (blockedSlotsList || [])
            .filter((b) => b.date === dateString)
            .map((b) => normalizeSlotTimeLabel(b.time))
            .filter(Boolean)
    );

    const activeApps = existingAppointments.filter((app) => {
        if (!['pending_payment', 'confirmed', 'completed'].includes(app.status)) return false;
        const slots = getServiceSlotsFromApp(app, catalogForMeta);
        if (slots.length) return slots.some((s) => s.date === dateString);
        return app.date === dateString;
    });

    const bookedIntervals = activeApps.flatMap((app) => {
        const slots = getServiceSlotsFromApp(app, catalogForMeta);
        const out = [];
        for (const sl of slots) {
            if (String(sl.status || 'active').toLowerCase() === APPOINTMENT_ITEM_STATUS_CANCELLED) continue;
            if (sl.date !== dateString) continue;
            const startMins = parseTimeToMinutes(sl.time);
            if (startMins == null) continue;
            const dur = getTotalDurationMinutesForServiceIds([sl.serviceId], catalogForMeta);
            out.push({ start: startMins, end: startMins + dur });
        }
        return out;
    });

    const previewIds = Array.isArray(selectedServiceIdsForPreview) ? selectedServiceIdsForPreview : [];
    const previewDuration = getTotalDurationMinutesForServiceIds(previewIds, catalogForMeta);

    return slots.map((time) => {
        const slotStartMins = parseTimeToMinutes(time);
        if (slotStartMins == null) {
            return {
                time,
                available: false,
                isPast: false,
                isBooked: true,
                isBlockedManual: false,
                hasAppointmentAtTime: false,
                isFullDayBlocked: fullDayBlocked
            };
        }
        const slotEndMins = slotStartMins + previewDuration;
        const isPast = isToday && slotStartMins <= currentTotalMinutes;
        const isBlockedManual = blockedSet.has(time);

        const isOverlapBooked = bookedIntervals.some(
            (booked) => slotStartMins < booked.end && slotEndMins > booked.start
        );

        const tooCloseToStart = activeApps.some((app) => {
            const slotList = getServiceSlotsFromApp(app, catalogForMeta);
            for (const sl of slotList) {
                if (sl.date !== dateString) continue;
                const S = parseTimeToMinutes(sl.time);
                if (S == null || slotStartMins == null) continue;
                if (Math.abs(slotStartMins - S) < MIN_START_GAP_MINUTES) return true;
            }
            return false;
        });

        const isBooked = isOverlapBooked || tooCloseToStart;
        const isUnavailable = fullDayBlocked || isPast || isBlockedManual || isBooked;

        return {
            time,
            available: !isUnavailable,
            isPast,
            isBooked,
            isBlockedManual,
            hasAppointmentAtTime: activeApps.some((a) =>
                getServiceSlotsFromApp(a, catalogForMeta).some(
                    (sl) => sl.date === dateString && normalizeSlotTimeLabel(sl.time) === time
                )
            ),
            isFullDayBlocked: fullDayBlocked
        };
    });
};

const PasswordModal = ({ onSuccess, onCancel }) => {
    const [pwd, setPwd] = useState('');
    const [showPwd, setShowPwd] = useState(false);
    const [errorMsg, setErrorMsg] = useState('');
    const [loading, setLoading] = useState(false);

    const submit = async () => {
        setErrorMsg('');
        setLoading(true);
        try {
            const res = await fetch(`${API_BASE_URL}/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setPwd('');
                setErrorMsg(data.error || 'Não foi possível acessar. Tente novamente.');
                return;
            }
            if (!data.token) {
                setErrorMsg('Resposta inválida do servidor.');
                return;
            }
            setPwd('');
            onSuccess(data.token);
        } catch {
            setPwd('');
            setErrorMsg('Falha de conexão. Verifique a internet e tente de novo.');
        } finally {
            setLoading(false);
        }
    };

    return (
        <div className="password-overlay">
            <div className="password-modal">
                <i className="fas fa-shield-alt" style={{fontSize: '40px', color: 'var(--primary-color)', marginBottom: '15px'}}></i>

                    <button type="button" className="password-toggle-eye" onClick={() => setShowPwd((v) => !v)} disabled={loading} aria-label={showPwd ? 'Ocultar senha' : 'Mostrar senha'} title={showPwd ? 'Ocultar senha' : 'Mostrar senha'}>

const StatusBadge = ({ status, paymentType, paymentMethod, remainingAmount, paidAmount: paidProp, captureMethod }) => {
    const pt = String(paymentType || '').toLowerCase();
    const pm = String(paymentMethod || '').toLowerCase();
    const isLocalKind = pt === 'local' || pm === 'local';
    const hadRemainingProp =
        remainingAmount !== undefined && remainingAmount !== null && remainingAmount !== '';
    const rem = hadRemainingProp ? Number(remainingAmount) : null;
    const remPending = hadRemainingProp && rem != null && Number.isFinite(rem) && rem > 0.005;
    const paidNum =
        paidProp !== undefined && paidProp !== null && paidProp !== '' ? Number(paidProp) : NaN;
    const paidRecorded = Number.isFinite(paidNum) && paidNum > 0.005;
    const localPending =
        isLocalKind && (remPending || (!hadRemainingProp && !paidRecorded));

    switch (status) {
        case 'pending_payment':
            if (pt === 'full') {
                return (
                    <span className="status-badge st-pending">
                        <i className="fas fa-clock"></i> Aguardando pagamento online
                    </span>
                );
            }
            return (
                <span className="status-badge st-pending">
                    <i className="fas fa-clock"></i> Aguardando pagamento
                </span>
            );
        case 'confirmed':
            if (isLocalKind && localPending) {
                return (
                    <span className="status-badge st-pending">
                        <i className="fas fa-store"></i> Pendente pagamento local
                    </span>
                );
            }
            if (isLocalKind) {
                return (
                    <span className="status-badge st-confirmed">
                        <i className="fas fa-check"></i> Pagamento confirmado
                    </span>
                );
            }
            if (pt === 'full') {
                const cap = String(captureMethod || '').toLowerCase();
                if (cap && cap !== 'manual' && cap !== 'manual_balance' && cap !== 'presencial') {
                    return (
                        <span className="status-badge st-confirmed">
                            <i className="fas fa-receipt"></i> Pago via InfinitePay
                        </span>
                    );
                }
                return (
                    <span className="status-badge st-confirmed">
                        <i className="fas fa-check"></i> Pagamento confirmado
                    </span>
                );
            }
            if (pt === 'partial' && remPending) {
                return (
                    <span className="status-badge st-pending">
                        <i className="fas fa-history"></i> Confirmado — valor histórico pendente
                    </span>
                );
            }
            if (pt === 'partial' && hadRemainingProp && !remPending) {
                return (
                    <span className="status-badge st-confirmed">
                        <i className="fas fa-check"></i> Pagamento confirmado
                    </span>
                );
            }
            return (
                <span className="status-badge st-confirmed">
                    <i className="fas fa-check"></i> Confirmado
                </span>
            );
        case 'cancelled':
            return (
                <span className="status-badge st-cancelled">
                    <i className="fas fa-times"></i> Cancelado
                </span>
            );
        case 'completed':
            if (isLocalKind && localPending) {
                return (
                    <span className="status-badge st-pending">
                        <i className="fas fa-store"></i> Pendente pagamento local
                    </span>
                );
            }
            if (isLocalKind || pt === 'full') {
                const cap = String(captureMethod || '').toLowerCase();
                if (pt === 'full' && cap && cap !== 'manual' && cap !== 'manual_balance' && cap !== 'presencial') {
                    return (
                        <span className="status-badge st-completed">
                            <i className="fas fa-receipt"></i> Pago via InfinitePay
                        </span>
                    );
                }
                return (
                    <span className="status-badge st-completed">
                        <i className="fas fa-flag-checkered"></i> Pagamento confirmado
                    </span>
                );
            }
            return (
                <span className="status-badge st-completed">
                    <i className="fas fa-flag-checkered"></i> Concluído
                </span>
            );
        default:
            return null;
    }
};

            if (nonPromoServiceList.some((s) => s.category === c) && !seen.has(c)) {

            const c = s.category;
            if (!c || c === 'Geral' || seen.has(c)) continue;
            /* Evita chip duplicado com a aba «Campanhas» dos pacotes promocionais. */
            if (c === PROMO_CLIENT_FILTER_LABEL) continue;
            seen.add(c);
            ordered.push(c);
        }
        const chips = ['Todos', ...ordered];
        if (promosVisibleOnClient) {
            chips.push(PROMO_CLIENT_FILTER_LABEL);
        }
        const deduped = [];
        const chipSeen = new Set();
        for (const x of chips) {
            if (!chipSeen.has(x)) {
                chipSeen.add(x);
                deduped.push(x);

        }

    }, [promosVisibleOnClient, nonPromoServiceList]);
    const servicesForGrid = useMemo(() => {

        }

    useEffect(() => {
        if (!bookingData.date) {
            setAvailableTimes([]);
            return;
        }
        if (selectedServiceIds.length <= 1) {
            setAvailableTimes(
                generateTimeSlots(
                    bookingData.date,
                    appointments,
                    blockedSlots || [],
                    blockedFullDays || [],
                    selectedServiceIds,
                    catalogMetaLookupList
                )
            );
            return;
        }
        if (scheduleMode === 'sequential') {
            setAvailableTimes(
                generateTimeSlots(
                    bookingData.date,
                    appointments,
                    blockedSlots || [],
                    blockedFullDays || [],
                    selectedServiceIds,
                    catalogMetaLookupList
                )
            );
            return;
        }
        setAvailableTimes([]);
    }, [bookingData.date, appointments, blockedSlots, blockedFullDays, selectedServiceIds, scheduleMode, catalogMetaLookupList]);

    const canProceedStep1 = useMemo(() => {
        if (selectedServiceIds.length === 0) return false;
        if (selectedServiceIds.length === 1) {
            return !!(bookingData.date && bookingData.time);
        }
        if (!scheduleMode) return false;
        if (scheduleMode === 'sequential') {
            return !!(bookingData.date && bookingData.time);
        }
        if (scheduleMode === 'per_service') {
            return (
                perServicePlan.length === selectedServiceIds.length &&
                perServicePlan.every((p) => p && p.date && p.time)
            );
        }
        return false;
    }, [selectedServiceIds, bookingData.date, bookingData.time, scheduleMode, perServicePlan]);

    const scheduleSummaryBlock = useMemo(() => {
        const n = selectedServiceIds.length;
        if (n === 0) return null;
        if (n === 1 && bookingData.date && bookingData.time) {
            return (
                <div style={{ marginBottom: '10px', fontSize: '15px' }}>
                    <strong style={{ color: 'var(--primary-color)' }}>Agendamento para:</strong>{' '}
                    {new Date(bookingData.date + 'T12:00:00').toLocaleDateString('pt-BR')} às {bookingData.time}
                </div>
            );
        }
        if (scheduleMode === 'sequential' && bookingData.date && bookingData.time) {
            const sm = parseTimeToMinutes(bookingData.time);
            const dur = getTotalDurationMinutesForServiceIds(selectedServiceIds, catalogMetaLookupList);
            const endLabel = sm != null ? formatMinutesAsHHMM(sm + dur) : '';
            return (
                <div style={{ marginBottom: '10px', fontSize: '15px' }}>
                    <strong style={{ color: 'var(--primary-color)' }}>Agendamento (sequência no mesmo dia):</strong>{' '}
                    {new Date(bookingData.date + 'T12:00:00').toLocaleDateString('pt-BR')}, de {bookingData.time} a {endLabel}
                </div>
            );
        }
        if (scheduleMode === 'per_service' && perServicePlan.length === n) {
            return (
                <div style={{ marginBottom: '10px', fontSize: '15px' }}>
                    <strong style={{ color: 'var(--primary-color)' }}>Horários por procedimento:</strong>
                    <ul style={{ margin: '8px 0 0', paddingLeft: '1.1rem', fontSize: '14px', lineHeight: 1.55 }}>
                        {selectedServiceIds.map((sid, i) => {
                            const m = getServiceMeta(sid, { clientCatalog: catalogMetaLookupList });
                            const p = perServicePlan[i] || {};
                            return (
                                <li key={`sum-${sid}-${i}`}>
                                    <strong>{m ? getClientServiceCardTitle(m) : sid}:</strong>{' '}
                                    {p.date
                                        ? `${new Date(p.date + 'T12:00:00').toLocaleDateString('pt-BR')} às ${p.time || '—'}`
                                        : '—'}
                                </li>
                            );
                        })}
                    </ul>
                </div>
            );
        }
        return null;
    }, [selectedServiceIds, bookingData.date, bookingData.time, scheduleMode, perServicePlan, catalogMetaLookupList]);

    useEffect(() => {
        setBookingData(prev => ({...prev, time: ''}));
    }, [bookingData.date]);

    useEffect(() => {
        if (selectedClient?.id) {
            setClientEmailForBooking(String(selectedClient.email || '').trim());
        }
    }, [selectedClient?.id]);

    useEffect(() => {
        if (!bookingRestoreOrderNsu) {
            lastBookingRestoreAppliedId.current = '';
            return;
        }
        const idStr = String(bookingRestoreOrderNsu).trim();
        if (!idStr) return;
        if (lastBookingRestoreAppliedId.current === idStr) return;

        const applyRestore = (appRow) => {
            if (!appRow) return;
            const sid = appRow.serviceId || appRow.service_id;
            const idsRestore = getAppointmentServiceIdsFromApp(appRow);
            const effectiveIds = idsRestore.length ? idsRestore : sid ? [String(sid)] : [];
            const metas = effectiveIds.map((id) => getServiceMeta(id, { clientCatalog: catalogMetaLookupList })).filter(Boolean);
            let mergedService;
            if (metas.length === 1) {
                mergedService = metas[0];
            } else if (metas.length > 1) {
                const tot = metas.reduce((s, m) => s + Number(m.price || 0), 0);
                mergedService = {
                    id: effectiveIds[0],
                    name: metas.map((m) => m.name).join(' + '),
                    cardTitle: metas.map((m) => getClientServiceCardTitle(m)).join(' + '),
                    price: Math.round(tot * 100) / 100,
                    category: '',
                    duration: getTotalDurationMinutesForServiceIds(effectiveIds, catalogMetaLookupList)
                };
            } else {
                mergedService = {
                    id: sid || 'servico',
                    name: appRow.serviceName || appRow.service_id || 'Serviço',
                    cardTitle: appRow.serviceName || appRow.service_id || 'Serviço',
                    price: Number(appRow.paymentAmount) || 0,
                    category: '',
                    duration: DEFAULT_APPOINTMENT_DURATION_MIN
                };
            }

            const cid = appRow.clientId || appRow.client_id;
            let clientRow = (clients || []).find((c) => String(c.id) === String(cid));
            if (!clientRow) {
                clientRow = {
                    id: cid || idStr,
                    name: appRow.clientName || appRow.client_name || 'Cliente',
                    phone: appRow.clientPhone || appRow.client_phone || '',
                    address: appRow.location || '',
                    email: String(appRow.clientEmail || '').trim()
                };
            }

            setSelectedServiceIds(effectiveIds);
            setSelectedClient(clientRow);
            setCompletedAppInfo({ app: appRow, client: clientRow, service: mergedService });
            setStep(4);
            setCheckedTerms(true);
            setApiError('');
            setLoginError('');

            try {
                const u = new URL(window.location.href);
                u.searchParams.delete('return');
                u.searchParams.delete('order_nsu');
                const qs = u.searchParams.toString();
                window.history.replaceState({}, '', `${u.pathname}${qs ? `?${qs}` : ''}${u.hash || ''}`);
            } catch (_) { /* ignore */ }

            if (typeof onBookingRestoreConsumed === 'function') {
                onBookingRestoreConsumed();
            }
            lastBookingRestoreAppliedId.current = idStr;
        };

        const local = (appointments || []).find((a) => String(a.id) === idStr);
        if (local && (local.clientPhone || local.client_phone || local.paymentUrl)) {
            applyRestore(local);
            return;
        }

        let cancelled = false;
        (async () => {
            try {
                const r = await fetch(`${API_BASE_URL}/public/appointment/${encodeURIComponent(idStr)}`, { cache: 'no-store' });
                if (!r.ok || cancelled) return;
                const fetched = await r.json().catch(() => null);
                if (!fetched || cancelled) return;
                if (typeof mergeAppointmentRow === 'function') {
                    mergeAppointmentRow(fetched);
                }
                applyRestore(fetched);
            } catch (_) { /* ignore */ }
        })();

        return () => {
            cancelled = true;
        };
    }, [bookingRestoreOrderNsu, appointments, clients, onBookingRestoreConsumed, mergeAppointmentRow, catalogMetaLookupList]);

    const handleCreateClient = async () => {
        setNewClientFormError('');
        if (!newClient.name || !newClient.phone) {
            setNewClientFormError('Nome e telefone são obrigatórios.');
            return;
        }
        if (!isValidEmailFormat(newClient.email)) {
            setNewClientFormError('Informe um e-mail válido. Usaremos para enviar a confirmação do agendamento.');
            return;
        }
        const cleanPhone = newClient.phone.replace(/\D/g, '');
        
        setIsLoading(true);
        try {
            const res = await fetch(`${API_BASE_URL}/clients`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: Date.now().toString(),
                    name: newClient.name,
                    phone: cleanPhone,
                    address: newClient.address,
                    email: newClient.email.trim().toLowerCase()
                })
            });
            const data = await res.json();
            if (!res.ok) {
                setNewClientFormError(data.error || 'Não foi possível salvar seu cadastro.');
                return;
            }
            
            setSelectedClient(data);
            setClientEmailForBooking(String(data.email || newClient.email.trim()).toLowerCase());
            setIsCreatingNew(false);
            setStep(3);
            refreshData();
        } catch (e) {
            setNewClientFormError('Falha de conexão ao registrar. Tente novamente.');
        }
        setIsLoading(false);
    };

    const handleConfirmBooking = async () => {
        const ids = [...selectedServiceIds];
        if (!checkedTerms) {
            return alert('Você precisa aceitar os termos para concluir o agendamento.');
        }

        const emailTrim = clientEmailForBooking.trim().toLowerCase();
        if (!isValidEmailFormat(emailTrim)) {
            setApiError('Informe um e-mail válido. Enviaremos a confirmação do agendamento para esse endereço.');
            return;
        }

        setIsLoading(true);
        setApiError('');
        
        try {
            if (ids.length === 0) {
                throw new Error('Selecione ao menos um procedimento.');
            }
            if (ids.length > 1 && !scheduleMode) {
                throw new Error('Escolha como deseja combinar os horários (sequência ou separados).');
            }

            const appointmentBody =
                ids.length === 1
                    ? {
                          serviceIds: ids,
                          clientId: selectedClient.id,
                          clientName: selectedClient.name,
                          clientPhone: selectedClient.phone,
                          clientEmail: emailTrim,
                          date: bookingData.date,
                          time: bookingData.time,
                          notes: bookingData.notes,
                          location: bookingData.location,
                          paymentMethod
                      }
                    : scheduleMode === 'sequential'
                      ? {
                            serviceIds: ids,
                            scheduleMode: 'sequential',
                            clientId: selectedClient.id,
                            clientName: selectedClient.name,
                            clientPhone: selectedClient.phone,
                            clientEmail: emailTrim,
                            date: bookingData.date,
                            time: bookingData.time,
                            notes: bookingData.notes,
                            location: bookingData.location,
                            paymentMethod
                        }
                      : {
                            serviceIds: ids,
                            scheduleMode: 'per_service',
                            slots: ids.map((id, i) => {
                                const row = perServicePlan[i] || {};
                                return {
                                    serviceId: id,
                                    date: String(row.date || '').trim(),
                                    time: normalizeSlotTimeLabel(row.time) || String(row.time || '').trim()
                                };
                            }),
                            clientId: selectedClient.id,
                            clientName: selectedClient.name,
                            clientPhone: selectedClient.phone,
                            clientEmail: emailTrim,
                            notes: bookingData.notes,
                            location: bookingData.location,
                            paymentMethod
                        };

            const response = await fetch(`${API_BASE_URL}/appointments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(appointmentBody)
            });

            const data = await response.json();
            
            if (!response.ok) {
                if (response.status === 409) {
                    throw new Error(
                        (data && data.error) ||
                            'Alguém reservou este mesmo horário há poucos segundos! Por favor, escolha outro.'
                    );
                }
                throw new Error(data.error || 'Falha no servidor ao agendar.');
            }

            const metas = ids.map((id) => getServiceMeta(id, { clientCatalog: catalogMetaLookupList })).filter(Boolean);
            const mergedForUi =
                metas.length === 1
                    ? metas[0]
                    : {
                          id: ids[0],
                          name: metas.map((m) => m.name).join(' + '),
                          cardTitle: metas.map((m) => getClientServiceCardTitle(m)).join(' + '),
                          price: selectionTotalPrice,
                          category: '',
                          duration: getTotalDurationMinutesForServiceIds(ids, catalogMetaLookupList)
                      };

            setCompletedAppInfo({ service: mergedForUi, app: data, client: selectedClient });
            refreshData();
            setStep(4);

        } catch (error) {
            setApiError(error.message);
        } finally {
            setIsLoading(false);
        }
    };
