<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ateliê da Pele - Agendamentos</title>
    <meta name="description" content="Agendamento online para os melhores tratamentos estéticos.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <style>
        .filter-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 8px 16px; border: 1px solid var(--border-color); background: var(--card-bg); border-radius: 8px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .tab-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .wa-btn { display: inline-flex; align-items: center; gap: 8px; background: #25D366; color: white; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 500; margin-top: 10px; transition: 0.2s; }
        .wa-btn:hover { background: #128C7E; transform: translateY(-2px); }
        .pay-btn { background: #00A676; color: white !important; font-weight: bold; border: none; }
        .pay-btn:hover { background: #00875F; }
        .past-slot { opacity: 0.4; text-decoration: line-through; pointer-events: none; background: #f3f4f6; border-color: #e5e7eb; }
        .step-container { animation: fadeIn 0.4s ease; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-left: 8px; text-transform: none; letter-spacing: 0.01em; }
        /* Contato WhatsApp oficial — opcional, fora do fluxo de confirmação */
        .atelie-wa-float {
            position: fixed;
            z-index: 50;
            bottom: max(16px, env(safe-area-inset-bottom, 0px));
            right: max(16px, env(safe-area-inset-right, 0px));
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: #334155;
            color: #f8fafc;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 6px 22px rgba(15, 23, 42, 0.2);
            max-width: min(calc(100vw - 28px), 280px);
            box-sizing: border-box;
            border: 1px solid rgba(148, 163, 184, 0.45);
        }
        .atelie-wa-float:hover { background: #1e293b; color: #fff; }
        .atelie-wa-float .fab { font-size: 22px; color: #25D366; flex-shrink: 0; }
        .atelie-wa-float__label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Desktop/tablet: alinhar ao bloco central (~mesma largura máx. do .container--wide), sem colar na borda da janela */
        @media (min-width: 900px) {
            .atelie-wa-float {
                right: calc(max(0px, (100vw - min(1220px, calc(100vw - 24px))) / 2) + 14px);
                bottom: max(20px, env(safe-area-inset-bottom, 0px));
            }
        }
        @media (min-width: 600px) and (max-width: 899px) {
            .atelie-wa-float {
                right: max(20px, env(safe-area-inset-right, 0px));
            }
        }
        @media (max-width: 768px) {
            .atelie-wa-float {
                padding: 11px 12px;
                bottom: max(12px, env(safe-area-inset-bottom, 0px));
                right: max(12px, env(safe-area-inset-right, 0px));
            }
            .atelie-wa-float__label { display: none; }
            .atelie-wa-float .fab { font-size: 20px; }
        }
        .atelie-wa-discrete {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .atelie-wa-discrete:hover { color: #475569; }
        .atelie-wa-discrete .fab { font-size: 16px; color: #25D366; }
        .report-table-wrap { width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; border: 1px solid var(--border-color); background: var(--card-bg); }
        .admin-report-table { min-width: 720px; }
        .admin-report-table th, .admin-report-table td { vertical-align: middle; }
        .report-col-nowrap { white-space: nowrap; }
        .report-col-service { min-width: 140px; max-width: 280px; white-space: normal; word-break: break-word; }
        .report-col-client { min-width: 120px; max-width: 220px; word-break: break-word; }
        .report-kpi-value { white-space: nowrap; }
        /* Filtros de período — Relatório de Faturamento (somente visual / mobile) */
        .report-filters-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 10px;
        }
        .report-date-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 0 1 auto;
            min-width: 0;
            max-width: 220px;
        }
        .report-date-field .report-date-label {
            font-size: 13px;
            color: var(--text-muted);
        }
        .report-date-input.form-control {
            width: 100%;
            min-width: 148px;
            min-height: 44px;
            padding: 10px 12px;
            font-size: 16px;
            line-height: 1.25;
            box-sizing: border-box;
        }
        .report-filters-row .report-filters-search {
            flex: 0 0 auto;
        }
        /* Explicação sequência vs separados — etapa de agendamento (somente leitura visual) */
        .schedule-mode-help {
            margin: 0 0 16px;
            text-align: left;
        }
        .schedule-mode-help__block {
            margin-bottom: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(111, 76, 165, 0.12);
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.55;
        }
        .schedule-mode-help__block:last-of-type {
            margin-bottom: 0;
        }
        .schedule-mode-help__title {
            display: block;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }
        @media (max-width: 520px) {
            .report-date-field {
                flex: 1 1 calc(50% - 8px);
                max-width: none;
                min-width: min(100%, 168px);
            }
            .report-date-input.form-control {
                min-width: 0;
                max-width: none;
            }
        }
        @media (max-width: 360px) {
            .report-date-field {
                flex: 1 1 100%;
                min-width: 100%;
            }
            .report-filters-row .report-filters-search {
                flex: 1 1 100%;
                width: 100%;
                box-sizing: border-box;
            }
        }
        .st-pending { background: #fff3cd; color: #856404; }
        .st-confirmed { background: #d4edda; color: #155724; }
        .st-cancelled { background: #f8d7da; color: #721c24; }
        .st-completed { background: #e2e3e5; color: #383d41; }
        /* Meus Agendamentos — card compacto, badge sem overflow horizontal */
        .my-app-card { overflow-wrap: anywhere; }
        .my-app-card__status .status-badge {
            margin-left: 0;
            max-width: 100%;
            white-space: normal;
            word-break: break-word;
            line-height: 1.35;
            box-sizing: border-box;
        }
        .my-app-procedures-box {
            margin-bottom: 14px;
            padding: 14px 14px 12px;
            border-radius: 14px;
            border: 1px solid rgba(111, 76, 165, 0.14);
            background: linear-gradient(165deg, rgba(243, 215, 231, 0.38) 0%, rgba(252, 248, 254, 0.95) 48%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 100%;
            box-sizing: border-box;
            overflow-x: hidden;
        }
        .my-app-procedures-box__title {
            margin: 0;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--brand-dark);
        }
        .my-app-procedure-row {
            padding: 14px 14px 12px;
            border-radius: 12px;
            border: 1px solid rgba(111, 76, 165, 0.1);
            background: var(--card-bg);
            max-width: 100%;
            box-sizing: border-box;
            box-shadow: 0 2px 12px rgba(75, 53, 110, 0.05);
        }
        .my-app-procedure-row--cancelled {
            border-color: rgba(196, 92, 106, 0.28);
            background: rgba(252, 238, 238, 0.55);
            opacity: 0.92;
        }
        .my-app-procedure-row__name {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 6px;
            line-height: 1.35;
            color: var(--text-dark);
            word-break: normal;
            overflow-wrap: break-word;
        }
        .my-app-procedure-row__meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .my-app-procedure-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.03em;
            line-height: 1.25;
        }
        .my-app-procedure-badge--confirmed {
            background: rgba(111, 76, 165, 0.12);
            color: var(--brand-dark);
            border: 1px solid rgba(111, 76, 165, 0.2);
        }
        .my-app-procedure-badge--pending {
            background: rgba(227, 168, 200, 0.35);
            color: var(--brand-dark);
            border: 1px solid rgba(111, 76, 165, 0.16);
        }
        .my-app-procedure-badge--cancelled {
            background: rgba(196, 92, 106, 0.14);
            color: #9b1c1c;
            border: 1px solid rgba(196, 92, 106, 0.32);
        }
        .my-app-procedure-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
        }
        .my-app-procedure-actions .btn-cancel,
        .my-app-procedure-actions .my-app-btn-secondary {
            width: auto;
            max-width: 100%;
            flex: 0 1 auto;
            padding: 7px 12px;
            font-size: 12px;
        }
        .my-app-card-footer-actions {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
            max-width: 100%;
            box-sizing: border-box;
        }
        .my-app-card-footer-actions .btn-cancel,
        .my-app-card-footer-actions .my-app-btn-secondary {
            width: auto;
            max-width: 100%;
            flex: 0 1 auto;
            padding: 8px 14px;
            font-size: 13px;
        }
        .my-app-card-footer-actions__hint {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.45;
        }
        .my-app-card-footer-actions__complete {
            font-size: 12px;
            padding: 6px 12px;
            border-color: rgba(180, 83, 9, 0.35);
            color: #9a3412;
        }
        @media (max-width: 520px) {
            .my-app-procedure-actions,
            .my-app-card-footer-actions {
                align-items: stretch;
            }
            .my-app-procedure-actions .btn-cancel,
            .my-app-procedure-actions .my-app-btn-secondary,
            .my-app-card-footer-actions .btn-cancel,
            .my-app-card-footer-actions .my-app-btn-secondary {
                width: 100%;
                flex: 1 1 100%;
            }
        }
        /* Local do ateliê + Google Maps — Agenda Geral (admin) e Meus Agendamentos */
        .appointment-location {
            font-size: 13px;
            max-width: 100%;
            box-sizing: border-box;
            overflow-wrap: anywhere;
        }
        .appointment-location__address {
            display: block;
        }
        .appointment-map-link {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 13px;
            color: #0ea5e9;
            text-decoration: none;
            max-width: 100%;
            width: 100%;
            box-sizing: border-box;
            flex-wrap: wrap;
            row-gap: 4px;
        }
        .appointment-map-link i {
            flex-shrink: 0;
        }
        .my-app-card__cancel {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            white-space: normal;
            word-break: break-word;
        }
        @media (min-width: 480px) {
            .my-app-card__cancel { width: auto; }
        }
        .refresh-btn { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .refresh-btn:hover { background: var(--secondary-color); }
        /* Adicionando um espacinho para o grupo de opção de pagamento, se precisar depois */
        .payment-type-group { margin-bottom: 20px; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; }
        .payment-type-radio { margin-right: 10px; }
        .payment-type-desc { margin: 8px 0 10px 0; font-size: 14px; color: var(--text-dark);}

        /* Painel profissional — sidebar + área principal (paleta atual) */
        .admin-panel-root {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            text-align: left;
            overflow-x: clip;
        }
        .admin-layout {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        .admin-sidebar {
            flex-shrink: 0;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 14px;
            overflow: hidden;
            order: 1;
        }
        .admin-sidebar-inner {
            padding: 12px 14px 14px;
            box-sizing: border-box;
        }
        .admin-sidebar-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }
        .admin-sidebar-heading {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-dark);
            font-family: inherit;
        }
        .admin-sidebar-toggle {
            display: none;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-dark);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .admin-sidebar-toggle:hover {
            background: rgba(111, 76, 165, 0.08);
            border-color: rgba(111, 76, 165, 0.28);
        }
        .admin-sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        .admin-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            text-align: left;
            justify-content: flex-start;
            white-space: normal;
            word-break: break-word;
            line-height: 1.35;
            min-height: 44px;
        }
        .admin-menu-item i.fas,
        .admin-menu-item i.far {
            flex-shrink: 0;
            width: 1.15em;
            text-align: center;
        }
        .admin-menu-item--exit {
            margin-top: 6px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            background: var(--card-bg);
            color: var(--text-dark);
            border-color: var(--border-color);
        }
        .admin-menu-item--exit:hover {
            background: rgba(111, 76, 165, 0.06);
        }
        .admin-content {
            flex: 1;
            min-width: 0;
            max-width: 100%;
            box-sizing: border-box;
            order: 2;
        }
        .admin-content-body {
            margin-top: 16px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        .admin-placeholder-panel {
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            text-align: center;
            box-sizing: border-box;
        }
        .admin-placeholder-panel h3 {
            margin: 0 0 10px;
            font-size: 1.1rem;
            color: var(--text-dark);
        }
        .admin-placeholder-panel p {
            margin: 0;
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        /* Mobile ≤768px: sem sidebar; navegação em grade (sem scroll horizontal) */
        @media (max-width: 768px) {
            .admin-panel-root .admin-layout {
                flex-direction: column;
                max-width: 100%;
                overflow-x: clip;
            }
            .admin-panel-root .admin-sidebar {
                display: none !important;
            }
            .admin-panel-root .admin-panel-head {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                margin-bottom: 10px;
            }
            .admin-panel-root .admin-panel-head h2 {
                margin: 0;
                flex: none;
                width: 100%;
                min-width: 0;
                word-break: normal;
                overflow-wrap: anywhere;
            }
            .admin-panel-root .admin-panel-head .btn-admin {
                align-self: flex-start;
                max-width: 100%;
            }
            .admin-panel-root .admin-content-body {
                margin-top: 0;
            }
        }
        /* Desktop/tablet largo: sidebar a partir de 769px (mobile inclui 768px). */
        @media (min-width: 769px) {
            .admin-layout {
                flex-direction: row;
                align-items: flex-start;
                gap: 16px;
            }
            .admin-sidebar {
                width: 240px;
                margin-bottom: 0;
                position: sticky;
                top: 12px;
                align-self: flex-start;
                max-height: calc(100vh - 88px);
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            .admin-sidebar-toggle {
                display: inline-flex;
            }
            .admin-sidebar--collapsed {
                width: 56px;
            }
            .admin-sidebar--collapsed .admin-sidebar-heading {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }
            .admin-sidebar--collapsed .admin-sidebar-title-row {
                justify-content: center;
                margin-bottom: 8px;
            }
            .admin-sidebar--collapsed .admin-menu-item-label {
                display: none;
            }
            .admin-sidebar--collapsed .admin-menu-item {
                justify-content: center;
                padding-left: 10px;
                padding-right: 10px;
            }
            .admin-sidebar--collapsed .admin-menu-item--exit {
                padding-top: 10px;
            }
            .admin-sidebar--collapsed .admin-sidebar-nav {
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- App React pré-compilado (app.bundle.js). Fonte: app.entry.jsx → npm run build:client -->
    <script src="app.bundle.js" defer></script>
    <script>
        window.addEventListener('error', function (e) {
            console.error('[Ateliê]', e.error || e.message);
        });
    </script>
</body>
</html>
