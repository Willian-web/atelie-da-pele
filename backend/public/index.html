const getServiceMeta = (serviceId) => {
    const sid = String(serviceId || '');
    return (
        SERVICES.find((s) => s.id === sid) ||
        PROMO_MAES_SERVICES.find((s) => s.id === sid) ||
        SERVICES_LEGACY.find((s) => s.id === sid) ||
        null
    );
};

const getAppointmentServiceIdsFromApp = (app) => {
    if (!app) return [];
    if (Array.isArray(app.serviceIds) && app.serviceIds.length > 0) {
        const out = [];
        const seen = new Set();
        for (const x of app.serviceIds) {
            const id = String(x || '').trim();
            if (!id || seen.has(id)) continue;
            seen.add(id);
            out.push(id);
        }
        if (out.length) return out;
    }
    const sid = app.serviceId || app.service_id;
    return sid ? [String(sid)] : [];
};

const getServiceSlotsFromApp = (app) => {
    if (!app) return [];
    if (Array.isArray(app.serviceSlots) && app.serviceSlots.length > 0) {
        return app.serviceSlots
            .map((s) => ({
                serviceId: String(s.serviceId || s.service_id || '').trim(),
                date: String(s.date || '').trim(),
                time: normalizeSlotTimeLabel(s.time) || String(s.time || '').trim()
            }))
            .filter((s) => s.serviceId && s.date && s.time);
    }
    const ids = getAppointmentServiceIdsFromApp(app);
    const d = String(app.date || '').trim();
    const t = normalizeSlotTimeLabel(app.time) || String(app.time || '').trim();
    if (!d || !t || ids.length === 0) return [];
    if (ids.length === 1) return [{ serviceId: ids[0], date: d, time: t }];
    let cur = parseTimeToMinutes(t);
    if (cur == null) return [];
    const out = [];
    for (const id of ids) {
        const meta = getServiceMeta(id);
        const mm =
            meta && typeof meta.duration === 'number' && Number.isFinite(meta.duration)
                ? meta.duration
                : DEFAULT_APPOINTMENT_DURATION_MIN;
        const hh = String(Math.floor(cur / 60)).padStart(2, '0');
        const mi = String(cur % 60).padStart(2, '0');
        const tStr = normalizeSlotTimeLabel(`${hh}:${mi}`);
        if (!tStr) return [];
        out.push({ serviceId: id, date: d, time: tStr });
        cur += mm;
    }
    return out;
};

const getTotalDurationMinutesForServiceIds = (ids) => {
    const arr = Array.isArray(ids) ? ids : [];
    if (arr.length === 0) return DEFAULT_APPOINTMENT_DURATION_MIN;
    return arr.reduce((sum, id) => {
        const m = getServiceMeta(id);
        const d = m && typeof m.duration === 'number' ? m.duration : DEFAULT_APPOINTMENT_DURATION_MIN;
        return sum + d;
    }, 0);
};

const buildLineItemsFromAppointmentApp = (app) => {
    if (Array.isArray(app?.serviceLineItems) && app.serviceLineItems.length) {
        return app.serviceLineItems;
    }
    return getAppointmentServiceIdsFromApp(app).map((id) => {
        const m = getServiceMeta(id);
        return {
            id,
            name: m ? getClientServiceCardTitle(m) : id,
            price: m && m.price != null ? Number(m.price) : 0
        };
    });
};

const formatAgendaServiceSummary = (app) => {
    const lines = buildLineItemsFromAppointmentApp(app);
    if (!lines.length) return { label: '—', total: null, scheduleHint: '' };
    const label = lines.map((l) => l.name || l.id).join(' + ');
    const total = lines.reduce((s, l) => s + (Number.isFinite(Number(l.price)) ? Number(l.price) : 0), 0);
    const slots = getServiceSlotsFromApp(app);
    const mode = String(app.scheduleMode || app.schedule_mode || '').toLowerCase();
    let scheduleHint = '';
    if (slots.length > 1) {
        const sameDay = slots.every((s) => s.date === slots[0].date);
        if (mode === 'sequential' && sameDay) {
            const sorted = [...slots].sort(
                (a, b) => (parseTimeToMinutes(a.time) || 0) - (parseTimeToMinutes(b.time) || 0)
            );
            const d0 = sorted[0].date;
            const last = sorted[sorted.length - 1];
            const lastStart = parseTimeToMinutes(last.time) || 0;
            const lastDur = getTotalDurationMinutesForServiceIds([last.serviceId]);
            const rangeEnd = formatMinutesAsHHMM(lastStart + lastDur);
            scheduleHint = `${new Date(d0 + 'T12:00:00').toLocaleDateString('pt-BR')} ${sorted[0].time}–${rangeEnd} (sequência)`;
        } else {
            scheduleHint = slots
                .map(
                    (s) =>
                        `${new Date(s.date + 'T12:00:00').toLocaleDateString('pt-BR')} ${s.time}`
                )
                .join(' · ');
        }
    }
    return { label, total: Math.round(total * 100) / 100, scheduleHint };
};

const isValidEmailFormat = (s) => {
    const t = String(s || '').trim().toLowerCase();
    if (!t || t.length > 254) return false;
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t);

/** Valores financeiros já normalizados pela API (paidAmount, paymentSummary); só formatação para “Meus Agendamentos”. */
const resolveAppointmentPaidForDisplay = (app) => {
    const ps = app && app.paymentSummary;
    let paid = ps != null && ps.paidAmount != null ? Number(ps.paidAmount) : NaN;
    if (!Number.isFinite(paid)) {
        paid = Number(app.paidAmount ?? app.paid_amount);
    }
    if (!Number.isFinite(paid)) paid = null;

    const remRaw = app.remainingAmount ?? (ps && ps.remainingAmount);
    const rem = remRaw != null ? Number(remRaw) : NaN;
    const remaining = Number.isFinite(rem) ? rem : null;

    const pType = String(app.paymentType || '').toLowerCase();
    const showRemaining = pType === 'partial' && remaining != null && remaining > 0.005;

    return { paid, remaining: showRemaining ? remaining : null, showRemaining };
};

const formatBRLFromNumber = (n) => {
    if (n == null || !Number.isFinite(Number(n))) return null;
    return Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
};

const getLocalTodayStr = () => {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    return new Date(now.getTime() - offset).toISOString().split('T')[0];
};

/** Alinhado ao backend: duração na grade e intervalo mínimo entre inícios. */
const DEFAULT_APPOINTMENT_DURATION_MIN = 60;
const MIN_START_GAP_MINUTES = 60;

const normalizeSlotTimeLabel = (t) => {
    if (t == null) return null;
    const s = String(t).trim();
    const m = s.match(/^(\d{1,2}):(\d{2})/);
    if (!m) return null;
    const hh = String(m[1]).padStart(2, '0');
    return `${hh}:${m[2]}`;
};

const parseTimeToMinutes = (timeStr) => {
    const n = normalizeSlotTimeLabel(timeStr);
    if (!n) return null;
    const [h, mm] = n.split(':').map(Number);
    if (!Number.isFinite(h) || !Number.isFinite(mm)) return null;
    return h * 60 + mm;
};

const formatMinutesAsHHMM = (totalMin) => {
    if (totalMin == null || !Number.isFinite(totalMin)) return '';
    const h = Math.floor(totalMin / 60) % 24;
    const m = Math.round(totalMin % 60);
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
};

/**
 * Grade em intervalos de 1 hora (só :00). Seg–sex 14h–20h; sáb 13h–18h; domingo fechado.
 * Considera bloqueio de dia inteiro (blocked_full_days), bloqueios por horário, ocupação e intervalo mínimo entre inícios.
 */
const generateTimeSlots = (
    dateString,
    existingAppointments,
    blockedSlotsList = [],
    blockedFullDaysList = [],
    selectedServiceIdsForPreview = []
) => {
    if (!dateString) return [];

    const dateObj = new Date(dateString + 'T12:00:00');
    const dayOfWeek = dateObj.getDay();

    const now = new Date();
    const todayStr = getLocalTodayStr();
    const isToday = dateString === todayStr;
    const currentTotalMinutes = now.getHours() * 60 + now.getMinutes();

    let slots = [];
    if (dayOfWeek === 0) return [];
    if (dayOfWeek === 6) {
        for (let hour = 13; hour <= 18; hour++) {
            slots.push(`${String(hour).padStart(2, '0')}:00`);
        }
    } else {
        for (let hour = 14; hour <= 20; hour++) {
            slots.push(`${String(hour).padStart(2, '0')}:00`);
        }
    }

    const fullDayBlocked = (blockedFullDaysList || []).some((b) => b.date === dateString);

    const blockedSet = new Set(
        (blockedSlotsList || [])
            .filter((b) => b.date === dateString)
            .map((b) => normalizeSlotTimeLabel(b.time))
            .filter(Boolean)
    );

    const activeApps = existingAppointments.filter((app) => {
        if (!['pending_payment', 'confirmed', 'completed'].includes(app.status)) return false;
        const slots = getServiceSlotsFromApp(app);
        if (slots.length) return slots.some((s) => s.date === dateString);
        return app.date === dateString;
    });

    const bookedIntervals = activeApps.flatMap((app) => {
        const slots = getServiceSlotsFromApp(app);
        const out = [];
        for (const sl of slots) {
            if (sl.date !== dateString) continue;
            const startMins = parseTimeToMinutes(sl.time);
            if (startMins == null) continue;
            const dur = getTotalDurationMinutesForServiceIds([sl.serviceId]);
            out.push({ start: startMins, end: startMins + dur });
        }
        return out;
    });

    const previewIds = Array.isArray(selectedServiceIdsForPreview) ? selectedServiceIdsForPreview : [];
    const previewDuration = getTotalDurationMinutesForServiceIds(previewIds);

    return slots.map((time) => {
        const slotStartMins = parseTimeToMinutes(time);
        if (slotStartMins == null) {
            return {
                time,
                available: false,
                isPast: false,
                isBooked: true,
                isBlockedManual: false,
                hasAppointmentAtTime: false,
                isFullDayBlocked: fullDayBlocked
            };
        }
        const slotEndMins = slotStartMins + previewDuration;
        const isPast = isToday && slotStartMins <= currentTotalMinutes;
        const isBlockedManual = blockedSet.has(time);

        const isOverlapBooked = bookedIntervals.some(
            (booked) => slotStartMins < booked.end && slotEndMins > booked.start
        );

        const tooCloseToStart = activeApps.some((app) => {
            const slotList = getServiceSlotsFromApp(app);
            for (const sl of slotList) {
                if (sl.date !== dateString) continue;
                const S = parseTimeToMinutes(sl.time);
                if (S == null || slotStartMins == null) continue;
                if (Math.abs(slotStartMins - S) < MIN_START_GAP_MINUTES) return true;
            }
            return false;
        });

        const isBooked = isOverlapBooked || tooCloseToStart;
        const isUnavailable = fullDayBlocked || isPast || isBlockedManual || isBooked;

        return {
            time,
            available: !isUnavailable,
            isPast,
            isBooked,
            isBlockedManual,
            hasAppointmentAtTime: activeApps.some((a) =>
                getServiceSlotsFromApp(a).some((sl) => sl.date === dateString && normalizeSlotTimeLabel(sl.time) === time)
            ),
            isFullDayBlocked: fullDayBlocked
        };
    });
};

const PasswordModal = ({ onSuccess, onCancel }) => {
    const [pwd, setPwd] = useState('');
    const [showPwd, setShowPwd] = useState(false);
    const [errorMsg, setErrorMsg] = useState('');
    const [loading, setLoading] = useState(false);

    const submit = async () => {
        setErrorMsg('');
        setLoading(true);
        try {
            const res = await fetch(`${API_BASE_URL}/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setPwd('');
                setErrorMsg(data.error || 'Não foi possível acessar. Tente novamente.');
                return;
            }
            if (!data.token) {
                setErrorMsg('Resposta inválida do servidor.');
                return;
            }
            setPwd('');
            onSuccess(data.token);
        } catch {
            setPwd('');
            setErrorMsg('Falha de conexão. Verifique a internet e tente de novo.');
        } finally {
            setLoading(false);
        }
    };

    return (
        <div className="password-overlay">
            <div className="password-modal">
                <i className="fas fa-shield-alt" style={{fontSize: '40px', color: 'var(--primary-color)', marginBottom: '15px'}}></i>
                <h3 style={{marginBottom: '20px'}}>Administração</h3>
                {errorMsg && <div className="alert alert-error" style={{padding: '8px', marginBottom: '15px', fontSize: '13px'}}>{errorMsg}</div>}
                <div className="password-field-wrap" style={{ width: '100%', marginBottom: '12px' }}>
                    <input type={showPwd ? 'text' : 'password'} className="form-control password-input" placeholder="Senha do painel" value={pwd} onChange={e => setPwd(e.target.value)} onKeyDown={e => e.key === 'Enter' && !loading && submit()} autoFocus disabled={loading} autoComplete="current-password" />
                    <button type="button" className="password-toggle-eye" onClick={() => setShowPwd((v) => !v)} disabled={loading} aria-label={showPwd ? 'Ocultar senha' : 'Mostrar senha'} title={showPwd ? 'Ocultar senha' : 'Mostrar senha'}>
                        <i className={`fas ${showPwd ? 'fa-eye-slash' : 'fa-eye'}`} aria-hidden />
                    </button>
                </div>
                <div className="modal-actions"><button className="btn-cancel" onClick={onCancel} disabled={loading}>Voltar</button><button className="btn-submit" style={{flex: 1}} onClick={submit} disabled={loading}>{loading ? 'Validando…' : 'Acessar'}</button></div>
            </div>
        </div>
    );
};

const StatusBadge = ({ status }) => {
    switch (status) {
        case 'pending_payment': return <span className="status-badge st-pending"><i className="fas fa-clock"></i> Aguardando Pagamento</span>;
        case 'confirmed': return <span className="status-badge st-confirmed"><i className="fas fa-check"></i> Confirmado</span>;
        case 'cancelled': return <span className="status-badge st-cancelled"><i className="fas fa-times"></i> Cancelado</span>;
        case 'completed': return <span className="status-badge st-completed"><i className="fas fa-flag-checkered"></i> Concluído</span>;
        default: return null;
    }
}

// ============== ÁREA NOVO AGENDAMENTO ==============

const ClientArea = ({
    appointments,
    refreshData,
    clients,
    adminWhatsApp,
    blockedSlots,
    blockedFullDays,
    promoPackagesEnabled,
    bookingRestoreOrderNsu,

    const [step, setStep] = useState(1);
    
    const [selectedServiceIds, setSelectedServiceIds] = useState([]);

    const [bookingData, setBookingData] = useState({ date: '', time: '', notes: '', location: '' });
    const [scheduleMode, setScheduleMode] = useState(null);
    const [perServicePlan, setPerServicePlan] = useState([]);
    const [availableTimes, setAvailableTimes] = useState([]);
    
    const [loginPhone, setLoginPhone] = useState('');
    const [loginError, setLoginError] = useState('');
    const [selectedClient, setSelectedClient] = useState(null);
    const [newClient, setNewClient] = useState({ name: '', phone: '', address: '', email: '' });
    const [isCreatingNew, setIsCreatingNew] = useState(false);
    const [newClientFormError, setNewClientFormError] = useState('');
    const [clientEmailForBooking, setClientEmailForBooking] = useState('');

    const [checkedTerms, setCheckedTerms] = useState(false);

    // Novo state: tipo de pagamento

    const [completedAppInfo, setCompletedAppInfo] = useState(null);
    const [isLoading, setIsLoading] = useState(false);
    const [apiError, setApiError] = useState('');

    const [serviceCatFilter, setServiceCatFilter] = useState('Todos');
    const serviceCategoryChips = useMemo(() => {
        const ordered = [];
        const seen = new Set();
        for (const c of SERVICE_CATEGORY_ORDER) {
            if (SERVICES.some((s) => s.category === c) && !seen.has(c)) {
                seen.add(c);
                ordered.push(c);
            }
        }
        for (const s of SERVICES) {
            const c = s.category;
            if (c && !seen.has(c)) {
                seen.add(c);
                ordered.push(c);
            }
        }
        const chips = ['Todos', ...ordered];
        if (promoPackagesEnabled) {
            chips.push(PROMO_CLIENT_FILTER_LABEL);
        }
        return chips;
    }, [promoPackagesEnabled]);
    const servicesForGrid = useMemo(() => {
        if (!promoPackagesEnabled) {
            if (serviceCatFilter === 'Todos') return SERVICES;
            return SERVICES.filter((s) => s.category === serviceCatFilter);
        }
        if (serviceCatFilter === PROMO_CLIENT_FILTER_LABEL) {
            return [...PROMO_MAES_SERVICES];
        }
        if (serviceCatFilter === 'Todos') {
            return [...SERVICES, ...PROMO_MAES_SERVICES];
        }
        return SERVICES.filter((s) => s.category === serviceCatFilter);
    }, [serviceCatFilter, promoPackagesEnabled]);

    const todayStr = getLocalTodayStr();

    const selectionTotalPrice = useMemo(() => {
        const t = selectedServiceIds.reduce((s, id) => s + Number(getServiceMeta(id)?.price || 0), 0);
        return Math.round(t * 100) / 100;
    }, [selectedServiceIds]);

    const selectionHasPromo = useMemo(
        () => selectedServiceIds.some((id) => PROMO_MAES_SERVICES.some((p) => p.id === id)),
        [selectedServiceIds]
    );

    const toggleServiceSelection = (rawId) => {
        const sid = String(rawId || '').trim();
        if (!sid) return;
        setSelectedServiceIds((prev) => {
            const i = prev.indexOf(sid);
            if (i >= 0) return prev.filter((_, j) => j !== i);
            return [...prev, sid];
        });
        setServiceDetailOpenId(null);
    };

    useEffect(() => {
        const n = selectedServiceIds.length;
        if (n <= 1) {
            setScheduleMode(null);
            setPerServicePlan([]);
            return;
        }
        setPerServicePlan((prev) =>
            selectedServiceIds.map((id, i) => {
                if (prev[i] && typeof prev[i] === 'object') {
                    return { date: prev[i].date || '', time: prev[i].time || '' };
                }
                return { date: '', time: '' };
            })
        );
    }, [selectedServiceIds]);

    useEffect(() => {
        const onPromoTab = serviceCatFilter === PROMO_CLIENT_FILTER_LABEL;
        const onTodosWithPromos = serviceCatFilter === 'Todos' && promoPackagesEnabled;
        if (
            !onPromoTab &&
            !onTodosWithPromos &&
            selectedServiceIds.some((id) => PROMO_MAES_SERVICES.some((p) => p.id === id))
        ) {
            setSelectedServiceIds((prev) => prev.filter((id) => !PROMO_MAES_SERVICES.some((p) => p.id === id)));
            setServiceDetailOpenId(null);
        }
    }, [serviceCatFilter, selectedServiceIds, promoPackagesEnabled]);

    useEffect(() => {
        if (!promoPackagesEnabled && serviceCatFilter === PROMO_CLIENT_FILTER_LABEL) {
            setServiceCatFilter('Todos');
        }
    }, [promoPackagesEnabled, serviceCatFilter]);

    useEffect(() => {
        if (!promoPackagesEnabled && selectedServiceIds.some((id) => PROMO_MAES_SERVICES.some((p) => p.id === id))) {
            setSelectedServiceIds((prev) => prev.filter((id) => !PROMO_MAES_SERVICES.some((p) => p.id === id)));
            setServiceDetailOpenId(null);
        }
    }, [promoPackagesEnabled, selectedServiceIds]);

    useEffect(() => {
        if (!bookingData.date) {
            setAvailableTimes([]);
            return;
        }
        if (selectedServiceIds.length <= 1) {
            setAvailableTimes(
                generateTimeSlots(
                    bookingData.date,
                    appointments,
                    blockedSlots || [],
                    blockedFullDays || [],
                    selectedServiceIds
                )
            );
            return;
        }
        if (scheduleMode === 'sequential') {
            setAvailableTimes(
                generateTimeSlots(
                    bookingData.date,
                    appointments,
                    blockedSlots || [],
                    blockedFullDays || [],
                    selectedServiceIds
                )
            );
            return;
        }
        setAvailableTimes([]);
    }, [bookingData.date, appointments, blockedSlots, blockedFullDays, selectedServiceIds, scheduleMode]);

    const canProceedStep1 = useMemo(() => {
        if (selectedServiceIds.length === 0) return false;
        if (selectedServiceIds.length === 1) {
            return !!(bookingData.date && bookingData.time);
        }
        if (!scheduleMode) return false;
        if (scheduleMode === 'sequential') {
            return !!(bookingData.date && bookingData.time);
        }
        if (scheduleMode === 'per_service') {
            return (
                perServicePlan.length === selectedServiceIds.length &&
                perServicePlan.every((p) => p && p.date && p.time)
            );
        }
        return false;
    }, [selectedServiceIds, bookingData.date, bookingData.time, scheduleMode, perServicePlan]);

    const scheduleSummaryBlock = useMemo(() => {
        const n = selectedServiceIds.length;
        if (n === 0) return null;
        if (n === 1 && bookingData.date && bookingData.time) {
            return (

                    <strong style={{ color: 'var(--primary-color)' }}>Agendamento para:</strong>{' '}
                    {new Date(bookingData.date + 'T12:00:00').toLocaleDateString('pt-BR')} às {bookingData.time}
                </div>
            );
        }
        if (scheduleMode === 'sequential' && bookingData.date && bookingData.time) {
            const sm = parseTimeToMinutes(bookingData.time);
            const dur = getTotalDurationMinutesForServiceIds(selectedServiceIds);

            return (
                <div style={{ marginBottom: '10px', fontSize: '15px' }}>

                    {new Date(bookingData.date + 'T12:00:00').toLocaleDateString('pt-BR')}, de {bookingData.time} a {endLabel}
                </div>

        }
        if (scheduleMode === 'per_service' && perServicePlan.length === n) {
            return (
                <div style={{ marginBottom: '10px', fontSize: '15px' }}>
                    <strong style={{ color: 'var(--primary-color)' }}>Horários por procedimento:</strong>
                    <ul style={{ margin: '8px 0 0', paddingLeft: '1.1rem', fontSize: '14px', lineHeight: 1.55 }}>
                        {selectedServiceIds.map((sid, i) => {
                            const m = getServiceMeta(sid);
                            const p = perServicePlan[i] || {};
                            return (
                                <li key={`sum-${sid}-${i}`}>
                                    <strong>{m ? getClientServiceCardTitle(m) : sid}:</strong>{' '}
                                    {p.date
                                        ? `${new Date(p.date + 'T12:00:00').toLocaleDateString('pt-BR')} às ${p.time || '—'}`
                                        : '—'}
                                </li>
                            );
                        })}
                    </ul>
                </div>
            );
        }
        return null;
    }, [selectedServiceIds, bookingData.date, bookingData.time, scheduleMode, perServicePlan]);

    useEffect(() => {
        setBookingData(prev => ({...prev, time: ''}));
    }, [bookingData.date]);

    useEffect(() => {
        if (selectedClient?.id) {
            setClientEmailForBooking(String(selectedClient.email || '').trim());
        }
    }, [selectedClient?.id]);

    useEffect(() => {
        if (!bookingRestoreOrderNsu) return;
        const idStr = String(bookingRestoreOrderNsu).trim();
        if (!idStr) return;
        const appRow = (appointments || []).find((a) => String(a.id) === idStr);
        if (!appRow) return;

        const sid = appRow.serviceId || appRow.service_id;

        const effectiveIds = idsRestore.length ? idsRestore : sid ? [String(sid)] : [];
        const metas = effectiveIds.map((id) => getServiceMeta(id)).filter(Boolean);

        if (metas.length === 1) {
            mergedService = metas[0];
        } else if (metas.length > 1) {
            const tot = metas.reduce((s, m) => s + Number(m.price || 0), 0);
            mergedService = {

                cardTitle: metas.map((m) => getClientServiceCardTitle(m)).join(' + '),

                category: '',
                duration: getTotalDurationMinutesForServiceIds(effectiveIds)
            };
        } else {
            mergedService = {
                id: sid || 'servico',
                name: appRow.serviceName || appRow.service_id || 'Serviço',
                cardTitle: appRow.serviceName || appRow.service_id || 'Serviço',
                price: Number(appRow.paymentAmount) || 0,
                category: '',
                duration: DEFAULT_APPOINTMENT_DURATION_MIN
            };
        }

        const cid = appRow.clientId || appRow.client_id;

        if (!clientRow) {

                email: String(appRow.clientEmail || '').trim()

        setSelectedServiceIds(effectiveIds);
        setSelectedClient(clientRow);
        setCompletedAppInfo({ app: appRow, client: clientRow, service: mergedService });
        setStep(4);
        setCheckedTerms(true);
        setApiError('');
        setLoginError('');

        try {
            const u = new URL(window.location.href);

            u.searchParams.delete('order_nsu');
            const qs = u.searchParams.toString();

        if (hasPromo || totalP <= FIXED_SIGNAL_AMOUNT) {
            setPaymentType('full');

            setNewClientFormError('Nome e telefone são obrigatórios.');

        setIsLoading(true);
        try {

            setSelectedClient(data);

            setStep(3);
            refreshData();

            setNewClientFormError('Falha de conexão ao registrar. Tente novamente.');

    const handleConfirmBooking = async () => {
        const ids = [...selectedServiceIds];
        const hasPromo = ids.some((id) => PROMO_MAES_SERVICES.some((p) => p.id === id));
        const totalP = ids.reduce((s, id) => s + Number(getServiceMeta(id)?.price || 0), 0);
        const forceFull = hasPromo || totalP <= FIXED_SIGNAL_AMOUNT;
        const payType = forceFull || paymentType === 'full' ? 'full' : 'partial';

        if (!checkedTerms) {
            return alert(

            );

        const emailTrim = clientEmailForBooking.trim().toLowerCase();
        if (!isValidEmailFormat(emailTrim)) {
            setApiError('Informe um e-mail válido. Enviaremos a confirmação do agendamento para esse endereço após o pagamento.');

        setIsLoading(true);
        setApiError('');
        
        try {
            if (ids.length === 0) {
                throw new Error('Selecione ao menos um procedimento.');

            if (ids.length > 1 && !scheduleMode) {
                throw new Error('Escolha como deseja combinar os horários (sequência ou separados).');
            }

            const appointmentBody =
                ids.length === 1
                    ? {
                          serviceIds: ids,
                          clientId: selectedClient.id,
                          clientName: selectedClient.name,
                          clientPhone: selectedClient.phone,
                          clientEmail: emailTrim,
                          date: bookingData.date,
                          time: bookingData.time,
                          notes: bookingData.notes,
                          location: bookingData.location,
                          paymentType: payType

                    : scheduleMode === 'sequential'
                      ? {
                            serviceIds: ids,
                            scheduleMode: 'sequential',
                            clientId: selectedClient.id,
                            clientName: selectedClient.name,
                            clientPhone: selectedClient.phone,
                            clientEmail: emailTrim,
                            date: bookingData.date,
                            time: bookingData.time,
                            notes: bookingData.notes,
                            location: bookingData.location,
                            paymentType: payType
                        }
                      : {
                            serviceIds: ids,
                            scheduleMode: 'per_service',
                            slots: ids.map((id, i) => {
                                const row = perServicePlan[i] || {};
                                return {
                                    serviceId: id,
                                    date: String(row.date || '').trim(),
                                    time: normalizeSlotTimeLabel(row.time) || String(row.time || '').trim()
                                };

                            clientId: selectedClient.id,
                            clientName: selectedClient.name,
                            clientPhone: selectedClient.phone,
                            clientEmail: emailTrim,
                            notes: bookingData.notes,
                            location: bookingData.location,
                            paymentType: payType
                        };

            const response = await fetch(`${API_BASE_URL}/appointments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(appointmentBody)
            });

            const data = await response.json();
            
            if (!response.ok) {
                if (response.status === 409) {
                    throw new Error(
                        (data && data.error) ||
                            'Alguém reservou este mesmo horário há poucos segundos! Por favor, escolha outro.'

                throw new Error(data.error || 'Falha no servidor ao agendar.');

            const metas = ids.map((id) => getServiceMeta(id)).filter(Boolean);

                          id: ids[0],
                          name: metas.map((m) => m.name).join(' + '),
                          cardTitle: metas.map((m) => getClientServiceCardTitle(m)).join(' + '),
                          price: Math.round(totalP * 100) / 100,
                          category: '',
                          duration: getTotalDurationMinutesForServiceIds(ids)
                      };

            setCompletedAppInfo({ service: mergedForUi, app: data, client: selectedClient });
            refreshData();
            setStep(4);

        } catch (error) {
            setApiError(error.message);

            setIsLoading(false);
        }
    };

    const adiantamento = formatPrice(FIXED_SIGNAL_AMOUNT);
    const forceFullPayment = selectionHasPromo || selectionTotalPrice <= FIXED_SIGNAL_AMOUNT;
    const effectiveFull = forceFullPayment || paymentType === 'full';

    return (
        <div>

                    <div className="service-category-chips" role="tablist" aria-label="Filtrar por categoria ou campanha">

                                {label}

                            const detailsOpen = serviceDetailOpenId === s.id;
                            return (

                                    key={s.id}
                                    role="button"
                                    tabIndex={0}

                                        selectedServiceIds.includes(s.id) ? ' selected' : ''
                                    }`}
                                    onClick={() => toggleServiceSelection(s.id)}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter' || e.key === ' ') {
                                            e.preventDefault();
                                            toggleServiceSelection(s.id);
                                        }
                                    }}
                                >
                                    {s.promotionalCampaign ? (
                                        <span className="service-card__promo-pill" title="Vales-presente Dia das Mães">

                                    <div className="service-card-header">

                                        <i className="fas fa-check-circle service-check" aria-hidden />

                                            fontSize: '11px',

                                        <button
                                            type="button"
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                setServiceDetailOpenId((prev) => (prev === s.id ? null : s.id));
                                            }}
                                            aria-expanded={detailsOpen}
                                            style={{
                                                border: 'none',
                                                background: 'transparent',
                                                padding: '4px 0',
                                                margin: 0,
                                                fontSize: '12px',
                                                fontWeight: 600,
                                                color: 'var(--brand-primary)',
                                                cursor: 'pointer',
                                                textDecoration: 'none',
                                                borderBottom: '1px solid rgba(166, 120, 180, 0.35)',
                                                fontFamily: 'inherit'
                                            }}
                                        >
                                            {detailsOpen ? 'Ocultar detalhes' : 'Ver detalhes'}
                                        </button>
                                        {detailsOpen && (s.detail || s.summary || (s.cardTitle && s.name && s.cardTitle !== s.name)) ? (
                                            <div
                                                style={{
                                                    marginTop: '10px',
                                                    fontSize: '13px',
                                                    color: 'var(--text-muted)',
                                                    lineHeight: 1.5,
                                                    textAlign: 'left'
                                                }}
                                            >
                                                {s.cardTitle && s.name && s.cardTitle !== s.name && (
                                                    <p style={{ margin: '0 0 10px', fontSize: '12px', color: 'var(--text-dark)' }}>
                                                        <strong>Procedimento:</strong> {s.name}
                                                    </p>
                                                )}
                                                {s.summary && <p style={{ margin: '0 0 8px' }}>{s.summary}</p>}
                                                {s.detail && <p style={{ margin: 0 }}>{s.detail}</p>}
                                            </div>
                                        ) : null}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                const svcPriceNum = Number(
                    liveApp?.paymentSummary?.totalServicePrice != null
                        ? liveApp.paymentSummary.totalServicePrice
                        : completedAppInfo?.service?.price
                );
                const checkoutIntegral =
                    String(paymentType || '').toLowerCase() === 'full' || isProcedurePriceAtOrBelowSignal(svcPriceNum);
                const dueNowDisplayBRL = amountChargedBRL || servicePriceBRL;

                const scheduleLineForWa = step4ScheduleHint
                    ? `Horários: ${step4ScheduleHint}`
                    : `Data: ${dateStr}\nHorário: ${liveApp.time}`;

                const baseLines = [
                    `Olá! Sou ${safeFirstName(clientName)} e fiz um agendamento no Ateliê da Pele. Gostaria de confirmar.`,
                    ``,
                    `Cliente: ${clientName}`,
                    `Serviço: ${serviceName}`,
                    scheduleLineForWa
                ];

                const paymentLines = (() => {
                    if (checkoutIntegral) {
                        return [
                            ``,
                            `Pagamento: integral (valor total do procedimento)`,
                            amountChargedBRL ? `Valor cobrado/pago: ${amountChargedBRL}` : null,
                            captureMethod ? `Registro: ${captureMethod}` : null
                        ].filter(Boolean);
                    }

                    if (paymentType === 'partial') {
                        return [
                            ``,
                            `Pagamento: parcial (sinal)`,
                            amountChargedBRL ? `Valor pago agora: ${amountChargedBRL}` : null,
                            remainingAmountBRL ? `Valor restante (para o dia do atendimento): ${remainingAmountBRL}` : null,
                            captureMethod ? `Forma de pagamento: ${captureMethod}` : null,
                            `O valor restante será acertado no atendimento, presencialmente.`
                        ].filter(Boolean);
                    }

                    if (paymentType === 'full') {
                        return [
                            ``,
                            `Pagamento: total`,
                            `Procedimento totalmente pago.`,
                            amountChargedBRL ? `Valor pago: ${amountChargedBRL}` : null,
                            captureMethod ? `Forma de pagamento: ${captureMethod}` : null
                        ].filter(Boolean);
                    }

                    // Fallback compatível com o comportamento atual
                    return [
                        ``,
                        servicePriceBRL ? `Valor: ${servicePriceBRL}` : null
                    ].filter(Boolean);
                })();

                const whatsappMsg = [...baseLines, ...paymentLines].join('\n');
                const adminWaDigits = String(adminWhatsApp || '').replace(/\D/g, '');
                const zapLink = adminWaDigits
                    ? `https://wa.me/${adminWaDigits}?text=${encodeURIComponent(whatsappMsg)}`
                    : null;

                return (
                <div className="booking-section step-container" style={{textAlign: 'center'}}>
                    {isPending && (
                        <>
                            <i className="fas fa-clock" style={{fontSize: '50px', color: '#f59e0b', margin: '0 auto 15px', display: 'block'}}></i>
                            <h2 style={{color: '#d97706', marginBottom: '10px'}}>Horário Bloqueado Aguardando Pagamento</h2>
                            <p style={{color: 'var(--text-muted)', marginBottom: '20px'}}>
                                {checkoutIntegral
                                    ? <>Finalize o <strong>pagamento integral</strong> ({dueNowDisplayBRL || '—'}) no InfinitePay dentro dos próximos 15 minutos.</>
                                    : <>Pague o sinal de {adiantamento} dentro dos próximos 15 minutos.</>}
                            </p>
                        </>
                    )}
                    {isConfirmed && (
                        <>
                            <i className="fas fa-check-circle" style={{fontSize: '50px', color: '#10b981', margin: '0 auto 15px', display: 'block'}}></i>
                            <h2 style={{color: '#059669', marginBottom: '10px'}}>Agendamento Confirmado!</h2>
                            <p style={{color: 'var(--text-muted)', marginBottom: '20px'}}>Pagamento aprovado. Seu agendamento foi confirmado com sucesso.</p>
                        </>
                    )}
                    {isCancelled && (
                        <>
                            <i className="fas fa-times-circle" style={{fontSize: '50px', color: '#ef4444', margin: '0 auto 15px', display: 'block'}}></i>
                            <h2 style={{color: '#dc2626', marginBottom: '10px'}}>Agendamento Cancelado</h2>
                            <p style={{color: 'var(--text-muted)', marginBottom: '20px'}}>O tempo limite esgotou ou houve falha no pagamento.</p>
                        </>
                    )}
                    
                    <div style={{background: '#fcfcfc', border: '1px solid #ddd', padding: '20px', borderRadius: '8px', textAlign: 'left', marginBottom: '25px', display: 'inline-block', maxWidth: '400px', width: '100%'}}>
                        <strong>{completedAppInfo.client.name}</strong><br/>
                        {lineItemsStep4.length > 0 ? (
                            <div style={{ marginBottom: '10px' }}>
                                {lineItemsStep4.map((li) => (
                                    <div key={li.id} style={{ fontSize: '14px', marginBottom: '4px' }}>
                                        • {(li.name && String(li.name)) || li.id} — {formatBRL(Number(li.price || 0))}
                                    </div>
                                ))}
                                <div style={{ fontSize: '15px', fontWeight: 700, marginTop: '8px', color: 'var(--text-dark)' }}>
                                    Total: {formatBRL(svcTotalFromApi)}
                                </div>
                            </div>
                        ) : (
                            <>
                                {getClientServiceCardTitle(completedAppInfo.service)} (
                                {formatBRL(Number(completedAppInfo.service?.price || 0))})<br/>
                            </>
                        )}
                        {step4ScheduleHint ? (
                            <div style={{ marginTop: '8px', fontSize: '14px', lineHeight: 1.5 }}>
                                <strong>Horários:</strong> {step4ScheduleHint}
                            </div>
                        ) : (
                            <>
                                Para: {dateStr} às {liveApp.time}
                                <br />
                            </>
                        )}
                        <div style={{marginTop: '10px'}}>
                            {liveApp.location && <span style={{display: 'block', marginBottom: '8px'}}><strong>Endereço Cliente:</strong><br/>{liveApp.location}</span>}
                            <div style={{display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: '8px'}}>
                                <span><strong>Local do atendimento:</strong><br/>Ateliê da Pele — Rua Rio Jaguaribe, nº 274</span>
                                <a href="https://www.google.com/maps/search/?api=1&query=Ateliê+da+Pele+Rua+Rio+Jaguaribe+274" target="_blank" rel="noreferrer" style={{display: 'inline-flex', alignItems: 'center', gap: '5px', fontSize: '13px', color: '#0ea5e9', textDecoration: 'none', background: '#f0f9ff', padding: '6px 12px', border: '1px solid #bae6fd', borderRadius: '20px'}}>
                                    <i className="fas fa-map-marked-alt"></i> Abrir no Google Maps
                                </a>
                            </div>
                        </div>
                    </div>

                    {isPending && (
                        <div style={{marginBottom: '30px', background: '#e0f2fe', padding: '20px', borderRadius: '8px', maxWidth: '350px', margin: '0 auto 30px', width: '100%', boxSizing: 'border-box'}}>
                            <p style={{fontWeight: 'bold', fontSize: '18px', color: '#0369a1', marginBottom: '15px'}}>
                                Valor a pagar agora: {dueNowDisplayBRL || adiantamento}
                                {checkoutIntegral && <span style={{ display: 'block', fontSize: '12px', fontWeight: 600, marginTop: '6px', opacity: 0.9 }}>(pagamento integral do procedimento)</span>}
                            </p>
                            <div
                                role="note"
                                style={{
                                    fontSize: '12px',
                                    lineHeight: 1.45,
                                    color: '#334155',
                                    background: 'rgba(255,255,255,0.75)',
                                    border: '1px solid #bae6fd',
                                    borderRadius: '8px',
                                    padding: '10px 12px',
                                    marginBottom: '14px',
                                    textAlign: 'left',
                                    maxWidth: '100%',
                                    boxSizing: 'border-box',
                                    wordBreak: 'break-word'
                                }}
                            >
                                <span style={{ display: 'block', color: '#0c4a6e', fontWeight: 600, marginBottom: '4px' }}>Informação</span>
                                <span style={{ display: 'block' }}>
                                    Política de cancelamento: pagamentos realizados como sinal ou valor integral poderão ser reembolsados integralmente caso o cancelamento seja solicitado com até 48 horas de antecedência. Após esse prazo, o valor poderá ser convertido em crédito para um novo agendamento, conforme disponibilidade.
                                </span>
                            </div>
                            <a href={liveApp.paymentUrl} target="_blank" rel="noreferrer" className="btn-submit pay-btn" style={{width: '100%', display: 'block', textDecoration: 'none', padding: '15px', boxSizing: 'border-box'}}>
                                <i className="fas fa-money-bill-wave"></i> Pagar via InfinitePay
                            </a>
                        </div>
                    )}

                    {isConfirmed && adminWaDigits && zapLink && (
                         <div style={{marginBottom: '30px', display: 'flex', justifyContent: 'center'}}>
                            <a href={zapLink} target="_blank" rel="noreferrer" className="btn-submit" style={{background: '#25D366', color: 'white', textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: '10px', padding: '15px 30px', borderRadius: '30px', fontWeight: 'bold'}}>
                                <i className="fab fa-whatsapp" style={{fontSize: '24px'}}></i> Enviar mensagem no WhatsApp
                            </a>
                        </div>
                    )}
                    {isConfirmed && !adminWaDigits && (
                        <div style={{marginBottom: '30px', textAlign: 'center', color: 'var(--text-muted)', fontSize: '14px', maxWidth: '420px', marginLeft: 'auto', marginRight: 'auto', lineHeight: 1.5}}>
                            O link automático do WhatsApp não está disponível. Defina a variável <strong>ADMIN_WHATSAPP</strong> no servidor (somente números, com DDI) e atualize a página.
                        </div>
                    )}

                    <div style={{display: 'flex', flexDirection: 'column', gap: '15px', alignItems: 'center'}}>
                        <button className="btn-admin" style={{margin: '0 auto'}} onClick={() => {
                            setStep(1);
                            setBookingData({date:'', time:'', notes:'', location:''});
                            setScheduleMode(null);
                            setPerServicePlan([]);
                            setSelectedServiceIds([]);
                            setServiceDetailOpenId(null);
                            setSelectedClient(null);
                            setCheckedTerms(false);
                            setCompletedAppInfo(null);
                        }}>Fazer novo ou Voltar ao início</button>
                    </div>
                </div>
                );
            })()}
        </div>
    );
};


// ============== ÁREA PROFISSIONAL e "MEUS AGENDAMENTOS" iguais ==============

const AdminArea = ({
    appointments,
    refreshData,
    clients,
    blockedSlots,
    blockedFullDays,
    adminToken,
    onAdminSessionInvalid,
    promoPackagesEnabled,
    onPromoPackagesChange
}) => {
    const [adminView, setAdminView] = useState('agenda'); // agenda | clients | report | blocks | campaigns
    const [filter, setFilter] = useState('today'); // today | next | all
    const [filterDate, setFilterDate] = useState('');
    const [agendaClientSearch, setAgendaClientSearch] = useState('');
    const [blockManageDate, setBlockManageDate] = useState(() => getLocalTodayStr());
    const [reportStartDate, setReportStartDate] = useState('');
    const [reportEndDate, setReportEndDate] = useState('');
    const [promoSaving, setPromoSaving] = useState(false);
    const [reportData, setReportData] = useState(null);
    const [reportLoading, setReportLoading] = useState(false);
    const [reportError, setReportError] = useState('');
    const [clientEditModal, setClientEditModal] = useState(null);
    const [clientEditError, setClientEditError] = useState('');
    const [clientEditSaving, setClientEditSaving] = useState(false);
    const [manualPayModal, setManualPayModal] = useState(null); // { id, clientName, serviceName, total, paymentType, paidAmount, note, saving, error }
    const [settleBalanceModal, setSettleBalanceModal] = useState(null); // { id, clientName, serviceName, total, paidSoFar, remaining, note, saving, error }

    const todayStr = getLocalTodayStr();

    const adminFetch = async (url, options = {}) => {
        const headers = { ...(options.headers || {}) };
        if (adminToken) headers.Authorization = `Bearer ${adminToken}`;
        const res = await fetch(url, { ...options, headers });
        if (res.status === 401 && typeof onAdminSessionInvalid === 'function') {
            onAdminSessionInvalid();
        }
        return res;
    };

    const openEditClient = (c) => {
        setClientEditError('');
        setClientEditModal({
            id: c.id,
            name: c.name || '',
            phone: c.phone || '',
            address: c.address || '',
            email: String(c.email || '').trim()
        });
    };

    const saveClientEdit = async () => {
        if (!clientEditModal) return;
        setClientEditError('');
        const em = String(clientEditModal.email || '').trim().toLowerCase();
        if (!isValidEmailFormat(em)) {
            setClientEditError('Informe um e-mail válido.');
            return;
        }
        const cleanPhone = String(clientEditModal.phone || '').replace(/\D/g, '');
        if (!cleanPhone) {
            setClientEditError('Telefone inválido.');
            return;
        }
        if (!(clientEditModal.name || '').trim()) {
            setClientEditError('Nome é obrigatório.');
            return;
        }
        setClientEditSaving(true);
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/clients/${encodeURIComponent(clientEditModal.id)}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: (clientEditModal.name || '').trim(),
                    phone: cleanPhone,
                    address: (clientEditModal.address || '').trim(),
                    email: em
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setClientEditError(data.error || 'Não foi possível salvar.');
                return;
            }
            setClientEditModal(null);
            await refreshData();
        } catch {
            setClientEditError('Falha de rede ao salvar.');
        } finally {
            setClientEditSaving(false);
        }
    };

    const handleDeleteClientRecord = async (c) => {
        if (!window.confirm(`Remover o cadastro de "${(c.name || '').trim() || 'esta pessoa'}"? Esta ação não pode ser desfeita.`)) return;
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/clients/${encodeURIComponent(c.id)}`, { method: 'DELETE' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                alert(data.error || 'Não foi possível remover.');
                return;
            }
            await refreshData();
        } catch {
            alert('Falha de rede ao remover.');
        }
    };

    const formatBRL = (value) => {
        const n = Number(value || 0);
        return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    const sortedApps = useMemo(() => {
        return [...(appointments || [])].sort((a, b) => {
            const da = a.date || '';
            const db = b.date || '';
            if (da !== db) return da.localeCompare(db);
            return (parseTimeToMinutes(a.time) ?? 0) - (parseTimeToMinutes(b.time) ?? 0);
        });
    }, [appointments]);

    const adminBlockSlots = useMemo(
        () => generateTimeSlots(blockManageDate, appointments, blockedSlots || [], blockedFullDays || []),
        [blockManageDate, appointments, blockedSlots, blockedFullDays]
    );

    const filteredApps = useMemo(() => {
        const base = sortedApps;

        let list;
        if (filterDate) {
            list = base.filter((app) => (app.date || '') === filterDate);
        } else if (filter === 'today') {
            list = base.filter((app) => (app.date || '') === todayStr);
        } else if (filter === 'next') {
            list = base.filter((app) => (app.date || '') > todayStr);
        } else {
            list = base;
        }

        const needle = String(agendaClientSearch || '').trim().toLowerCase();
        if (!needle) return list;

        return list.filter((app) => {
            const name = String(app.clientName || app.client_name || '').trim().toLowerCase();
            return name.includes(needle);
        });
    }, [sortedApps, filter, filterDate, todayStr, agendaClientSearch]);

    const handleDelete = async (appointmentId) => {
        if (!appointmentId) return;
        if (!window.confirm('Tem certeza que deseja apagar este agendamento? Esta ação não pode ser desfeita.')) return;

        try {
            const res = await adminFetch(`${API_BASE_URL}/appointments/${appointmentId}`, { method: 'DELETE' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Erro ao apagar agendamento.');
            await refreshData();
        } catch (e) {
            alert(e.message || 'Erro ao apagar agendamento.');
        }
    };

    const handleCancelByAdmin = async (appointmentId) => {
        if (!appointmentId) return;
        const reason = window.prompt('Motivo do cancelamento (opcional):', 'Cancelado pela profissional');
        if (reason === null) return;

        try {
            const res = await adminFetch(`${API_BASE_URL}/appointments/${appointmentId}/cancel`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cancelledBy: 'admin',
                    cancelReason: (reason || '').trim() || 'Cancelado pela profissional'
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Erro ao cancelar agendamento.');
            await refreshData();
        } catch (e) {
            alert(e.message || 'Erro ao cancelar agendamento.');
        }
    };

    const openManualPayment = (app, serviceName, servicePrice) => {
        if (!app || !app.id) return;
        const clientName = app.clientName || app.client_name || 'Cliente';
        const total = (typeof servicePrice === 'number' && Number.isFinite(servicePrice)) ? servicePrice : null;
        setManualPayModal({
            id: app.id,
            clientName,
            serviceName: serviceName || 'Serviço',
            total,
            paymentType: 'partial',
            paidAmount: '',
            note: '',
            saving: false,
            error: ''
        });
    };

    const submitManualPayment = async () => {
        if (!manualPayModal || !manualPayModal.id) return;
        const type = String(manualPayModal.paymentType || '').trim().toLowerCase();
        const paidStr = String(manualPayModal.paidAmount || '').replace(',', '.').trim();
        const paidNum = paidStr ? Number(paidStr) : null;

        if (!['partial', 'full'].includes(type)) {
            setManualPayModal((m) => ({ ...m, error: 'Selecione o tipo de pagamento.' }));
            return;
        }

        if (type === 'partial') {
            if (paidNum == null || !Number.isFinite(paidNum) || paidNum <= 0) {
                setManualPayModal((m) => ({ ...m, error: 'Informe um valor pago válido para pagamento parcial.' }));
                return;
            }
        }

        const summaryLines = [
            `Confirmar pagamento manual?`,
            ``,
            `Agendamento: ${manualPayModal.clientName} — ${manualPayModal.serviceName}`,
            `Tipo: ${type === 'full' ? 'integral' : 'parcial (sinal)'}`
        ];
        if (type === 'partial') summaryLines.push(`Valor pago: R$ ${paidNum.toFixed(2).replace('.', ',')}`);
        if ((manualPayModal.note || '').trim()) summaryLines.push(`Obs.: ${(manualPayModal.note || '').trim()}`);

        if (!window.confirm(summaryLines.join('\n'))) return;

        setManualPayModal((m) => ({ ...m, saving: true, error: '' }));
        try {
            const body = {
                paymentType: type,
                note: (manualPayModal.note || '').trim() || undefined
            };
            if (type === 'partial') body.paidAmount = paidNum;

            const res = await adminFetch(`${API_BASE_URL}/admin/appointments/${encodeURIComponent(manualPayModal.id)}/manual-payment`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Erro ao confirmar pagamento manual.');

            setManualPayModal(null);
            await refreshData();
        } catch (e) {
            setManualPayModal((m) => ({ ...m, saving: false, error: e.message || 'Erro ao confirmar pagamento manual.' }));
        }
    };

    const canSettleRemainingBalance = (app) => {
        if (!app) return false;
        const st = String(app.status || '').trim();
        if (st !== 'confirmed' && st !== 'completed') return false;
        const pt = String(app.paymentType || app.payment_type || '').trim().toLowerCase();
        if (pt !== 'partial') return false;
        const rem = Number(app.remainingAmount ?? app.remaining_amount);
        return Number.isFinite(rem) && rem > 0.005;
    };

    const openSettleBalance = (app, serviceName, servicePrice) => {
        if (!app || !app.id) return;
        const paidSoFar = Number(app.paidAmount ?? app.paid_amount);
        const remaining = Number(app.remainingAmount ?? app.remaining_amount);
        const total = (typeof servicePrice === 'number' && Number.isFinite(servicePrice)) ? servicePrice : null;
        setSettleBalanceModal({
            id: app.id,
            clientName: app.clientName || app.client_name || 'Cliente',
            serviceName: serviceName || 'Serviço',
            total,
            paidSoFar: Number.isFinite(paidSoFar) ? paidSoFar : null,
            remaining: Number.isFinite(remaining) ? remaining : null,
            note: '',
            saving: false,
            error: ''
        });
    };

    const submitSettleRemaining = async () => {
        if (!settleBalanceModal || !settleBalanceModal.id) return;
        const rem = settleBalanceModal.remaining;
        if (rem == null || !Number.isFinite(rem) || rem <= 0) {
            setSettleBalanceModal((m) => ({ ...m, error: 'Sem saldo restante para quitar.' }));
            return;
        }
        const lines = [
            'Quitar saldo restante manualmente?',
            '',
            `${settleBalanceModal.clientName} — ${settleBalanceModal.serviceName}`,
            `Saldo a registrar: R$ ${rem.toFixed(2).replace('.', ',')}`,
            '(será somado ao valor já pago; saldo pendente ficará R$ 0,00)'
        ];
        if ((settleBalanceModal.note || '').trim()) lines.push(`Obs.: ${(settleBalanceModal.note || '').trim()}`);
        if (!window.confirm(lines.join('\n'))) return;

        setSettleBalanceModal((m) => ({ ...m, saving: true, error: '' }));
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/appointments/${encodeURIComponent(settleBalanceModal.id)}/settle-remaining-balance`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    note: (settleBalanceModal.note || '').trim() || undefined
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Erro ao quitar saldo restante.');
            setSettleBalanceModal(null);
            await refreshData();
        } catch (e) {
            setSettleBalanceModal((m) => ({ ...m, saving: false, error: e.message || 'Erro ao quitar saldo restante.' }));
        }
    };

    const fetchReport = async () => {
        setReportError('');
        setReportData(null);

        if (!reportStartDate || !reportEndDate) {
            setReportError('Informe a data inicial e a data final para buscar o relatório.');
            return;
        }

        setReportLoading(true);
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/report?start=${encodeURIComponent(reportStartDate)}&end=${encodeURIComponent(reportEndDate)}`);
            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
                throw new Error(data.error || 'Erro ao buscar relatório.');
            }

            setReportData(data);
        } catch (e) {
            setReportError(e.message || 'Erro ao buscar relatório.');
        } finally {
            setReportLoading(false);
        }
    };

    const handleAdminBlockSlot = async (time) => {
        const reason = window.prompt('Motivo do bloqueio (opcional)?');
        if (reason === null) return;
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/blocked-slots`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date: blockManageDate, time, reason: reason || undefined })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                alert(data.error || 'Não foi possível bloquear este horário.');
                return;
            }
            await refreshData();
        } catch (e) {
            console.error(e);
            alert('Erro de rede ao bloquear.');
        }
    };

    const handleAdminUnblockSlot = async (slotId) => {
        if (!window.confirm('Remover este bloqueio e liberar o horário?')) return;
        try {
            const res = await adminFetch(`${API_BASE_URL}/admin/blocked-slots/${slotId}`, { method: 'DELETE' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                alert(data.error || 'Não foi possível remover o bloqueio.');
                return;
            }
            await refreshData();
        } catch (e) {
            console.error(e);
