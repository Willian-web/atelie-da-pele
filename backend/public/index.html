                                {servicesAdminLoading ? (
                                    <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Carregando catálogo…</div>
                                ) : assignableCampaignServices.length === 0 ? (
                                    <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Nenhum procedimento disponível para vincular.</div>
                                ) : (
                                    assignableCampaignServices.map((s) => (
                                        <label
                                            key={s.id}
                                            style={{
                                                display: 'flex',
                                                alignItems: 'flex-start',
                                                gap: '8px',
                                                fontSize: '13px',
                                                padding: '6px 4px',
                                                cursor: 'pointer'
                                            }}
                                        >
                                            <input
                                                type="checkbox"
                                                checked={(campaignModal.assignIds || []).indexOf(s.id) >= 0}
                                                onChange={() => toggleAssignServiceId(s.id)}
                                            />
                                            <span>
                                                <strong>{s.name}</strong>
                                                <span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>
                                                    {' '}
                                                    — {Number(s.price).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}
                                                </span>
                                            </span>
                                        </label>
                                    ))
                                )}
                            </div>
                        </div>

                        {campaignModal.error ? (
                            <div className="alert alert-error" style={{ marginBottom: '10px', fontSize: '13px' }}>
                                {campaignModal.error}
                            </div>
                        ) : null}

                        <div className="modal-actions" style={{ marginTop: '8px', paddingBottom: 'max(12px, env(safe-area-inset-bottom, 0px))' }}>
                            <button type="button" className="btn-cancel" onClick={() => setCampaignModal(null)} disabled={!!campaignModal.savingMeta}>
                                Fechar
                            </button>
                            <button type="button" className="btn-submit" style={{ flex: 1 }} onClick={saveCampaignMeta} disabled={!!campaignModal.savingMeta}>
                                {campaignModal.savingMeta ? 'Salvando…' : 'Salvar campanha'}
                            </button>
                        </div>
                    </div>
                </div>
            ) : null}
            </div>
        );
    };

    const renderAdminServices = () => {
        const fmtMoney = (p) => {
            const n = Number(p);
            if (!Number.isFinite(n)) return '—';
            return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        };

        const openCreate = () => {
            setServiceModal({
                mode: 'create',
                name: '',
                price: '',
                duration: 60,
                detail: '',
                active: true,
                saving: false,
                error: ''
            });
        };

        const openEdit = (row) => {
            setServiceModal({
                mode: 'edit',
                id: row.id,
                name: row.name || '',
                existingCategory: String(row.category || '').trim(),
                price: String(row.price != null ? row.price : ''),
                duration: row.duration != null ? Number(row.duration) : 60,
                detail: row.detail || '',
                active: row.active !== false,
                saving: false,
                error: ''
            });
        };

        const closeSvc = () => {
            setServiceModal(null);
        };

        const patchField = (key, val) => {
            setServiceModal((m) => (m ? { ...m, [key]: val, error: '' } : m));
        };

        const submitServiceModal = async () => {
            if (!serviceModal) return;
            const name = String(serviceModal.name || '').trim();
            if (!name) {
                setServiceModal((m) => (m ? { ...m, error: 'Informe o nome.' } : m));
                return;
            }
            const inferred = inferServiceCategoryFromName(name);
            const category =
                serviceModal.mode === 'edit'
                    ? String(serviceModal.existingCategory || '').trim() || inferred
                    : inferred;
            const priceNum = Number(String(serviceModal.price).replace(',', '.'));
            if (!Number.isFinite(priceNum) || priceNum < 0) {
                setServiceModal((m) => (m ? { ...m, error: 'Informe um preço válido.' } : m));
                return;
            }
            const duration = Math.round(Number(serviceModal.duration));
            if (!Number.isFinite(duration) || duration <= 0) {
                setServiceModal((m) => (m ? { ...m, error: 'Duração inválida (minutos).' } : m));
                return;
            }
            setServiceModal((m) => (m ? { ...m, saving: true, error: '' } : m));
            try {
                const bodyBase = {
                    name,
                    category,
                    price: priceNum,
                    duration,
                    detail: String(serviceModal.detail || ''),
                    cardTitle: name,
                    active: !!serviceModal.active,
                    /* Pacotes e campanhas: aba Campanhas. Modal desta grade só trata serviços comuns. */
                    isPromotionalPackage: false,
                    promotionalCampaign: null
                };
                const body =
                    serviceModal.mode === 'create' ? { ...bodyBase, summary: '' } : bodyBase;
                let res;
                if (serviceModal.mode === 'create') {
                    res = await adminFetch(`${API_BASE_URL}/admin/services`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                } else {
                    res = await adminFetch(`${API_BASE_URL}/admin/services/${encodeURIComponent(serviceModal.id)}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                }
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    setServiceModal((m) => (m ? { ...m, saving: false, error: data.error || 'Não foi possível salvar.' } : m));
                    return;
                }
                closeSvc();
                await loadAdminServices();
                await refreshData();
            } catch (e) {
                setServiceModal((m) => (m ? { ...m, saving: false, error: e.message || 'Erro de rede.' } : m));
            }
        };

        const toggleActiveRow = async (row) => {
            const msg = row.active
                ? 'Inativar este serviço? Ele deixará de aparecer para novas clientes no agendamento online.'
                : 'Reativar este serviço?';
            if (!window.confirm(msg)) return;
            try {
                const res = await adminFetch(`${API_BASE_URL}/admin/services/${encodeURIComponent(row.id)}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ active: !row.active })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    alert(data.error || 'Não foi possível atualizar.');
                    return;
                }
                await loadAdminServices();
                await refreshData();
            } catch (e) {
                alert('Erro de rede.');
            }
        };

        const deleteServiceRow = async (row) => {
            if (!row || !row.id) return;
            if (!window.confirm('Tem certeza que deseja apagar este serviço?')) return;
            try {
                const res = await adminFetch(`${API_BASE_URL}/admin/services/${encodeURIComponent(row.id)}`, {
                    method: 'DELETE'
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    alert(data.error || 'Não foi possível apagar.');
                    return;
                }
                if (serviceModal && serviceModal.mode === 'edit' && serviceModal.id === row.id) {
                    setServiceModal(null);
                }
                await loadAdminServices();
                await refreshData();
            } catch (e) {
                alert('Erro de rede.');
            }
        };

        const servicesMainGridRows = servicesAdminList.filter((row) => !row.isPromotionalPackage);

        return (
            <div className="admin-services-panel" style={{ textAlign: 'left', width: '100%', maxWidth: '100%', boxSizing: 'border-box' }}>
                <div
                    style={{
                        display: 'flex',
                        flexWrap: 'wrap',
                        justifyContent: 'space-between',
                        gap: '12px',
                        alignItems: 'flex-start',
                        marginBottom: '16px'
                    }}
                >
                    <div style={{ minWidth: 0, flex: '1 1 220px' }}>
                        <h3 style={{ margin: '0 0 6px', fontFamily: 'var(--font-heading, Georgia, serif)' }}>Serviços</h3>
                        <p style={{ margin: 0, fontSize: '13px', color: 'var(--text-muted)', lineHeight: 1.55 }}>
                            Catálogo dos <strong>procedimentos comuns</strong> do agendamento online. <strong>Inativar</strong> oculta para novas clientes;
                            <strong>Apagar</strong> remove do painel e da vitrine (arquivo seguro — histórico de agendamentos antigos continua intacto).
                            Pacotes, vales e campanhas ficam na aba <strong>Campanhas</strong>.
                        </p>
                    </div>
                    <button type="button" className="btn-submit" onClick={openCreate}>
                        <i className="fas fa-plus" aria-hidden="true" /> Novo serviço
                    </button>
                </div>

                {servicesAdminError && <div className="alert alert-error" style={{ marginBottom: '12px' }}>{servicesAdminError}</div>}

                {servicesAdminLoading ? (
                    <p style={{ color: 'var(--text-muted)' }}>Carregando…</p>
                ) : adminCatalogCardsLayout ? (
                    <div className="admin-catalog-card-list">
                        {servicesMainGridRows.length === 0 ? (
                            <p className="admin-catalog-empty">
                                Nenhum serviço comum cadastrado. Use «Novo serviço» ou gerencie vales e pacotes na aba Campanhas.
                            </p>
                        ) : (
                            servicesMainGridRows.map((row) => (
                                <article key={row.id} className="admin-catalog-card">
                                    <h4 className="admin-catalog-card__title">{row.name}</h4>
                                    <div className="admin-catalog-card__field">
                                        <span className="admin-catalog-card__label">Categoria</span>
                                        <div className="admin-catalog-card__value">{row.category || '—'}</div>
                                    </div>
                                    <div className="admin-catalog-card__field">
                                        <span className="admin-catalog-card__label">Preço</span>
                                        <div className="admin-catalog-card__value">{fmtMoney(row.price)}</div>
                                    </div>
                                    <div className="admin-catalog-card__field">
                                        <span className="admin-catalog-card__label">Status</span>
                                        <div className="admin-catalog-card__value">{row.active ? 'Ativo' : 'Inativo'}</div>
                                    </div>
                                    <div className="admin-catalog-card__actions">
                                        <button
                                            type="button"
                                            className="admin-campaigns-action-btn admin-campaigns-action-btn--edit"
                                            onClick={() => openEdit(row)}
                                        >
                                            Editar
                                        </button>
                                        {row.active ? (
                                            <button
                                                type="button"
                                                className="admin-campaigns-action-btn admin-campaigns-action-btn--inativar"
                                                onClick={() => toggleActiveRow(row)}
                                            >
                                                Inativar
                                            </button>
                                        ) : (
                                            <button
                                                type="button"
                                                className="admin-campaigns-action-btn admin-campaigns-action-btn--ativar"
                                                onClick={() => toggleActiveRow(row)}
                                            >
                                                Ativar
                                            </button>
                                        )}
                                        <button
                                            type="button"
                                            className="admin-campaigns-action-btn admin-campaigns-action-btn--apagar admin-catalog-card__btn-apagar"
                                            onClick={() => deleteServiceRow(row)}
                                        >
                                            Apagar
                                        </button>
                                    </div>
                                </article>
                            ))
                        )}
                    </div>
                ) : (
                    <div
                        className="admin-services-table-wrap"
                        style={{
                            overflowX: 'auto',
                            WebkitOverflowScrolling: 'touch',
                            borderRadius: '10px',
                            border: '1px solid var(--border-color)',
                            background: 'var(--card-bg)',
                            maxWidth: '100%'
                        }}
                    >
                        <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 'min(100%, 560px)' }}>
                            <thead>
                                <tr style={{ background: 'rgba(111, 76, 165, 0.08)', textAlign: 'left' }}>
                                    <th style={{ padding: '10px 12px', fontSize: '12px' }}>Nome</th>
                                    <th style={{ padding: '10px 12px', fontSize: '12px' }}>Categoria</th>
                                    <th style={{ padding: '10px 12px', fontSize: '12px' }}>Preço</th>
                                    <th style={{ padding: '10px 12px', fontSize: '12px' }}>Ativo</th>
                                    <th className="admin-campaigns-table-actions-col" style={{ padding: '10px 12px', fontSize: '12px' }}>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                {servicesMainGridRows.length === 0 ? (
                                    <tr>
                                        <td colSpan={5} style={{ padding: '14px 12px', color: 'var(--text-muted)', fontSize: '13px' }}>
                                            Nenhum serviço comum cadastrado. Use «Novo serviço» ou gerencie vales e pacotes na aba Campanhas.
                                        </td>
                                    </tr>
                                ) : (
                                    servicesMainGridRows.map((row) => (
                                        <tr key={row.id} style={{ borderTop: '1px solid var(--border-color)' }}>
                                            <td
                                                style={{
                                                    padding: '10px 12px',
                                                    fontSize: '13px',
                                                    wordBreak: 'normal',
                                                    overflowWrap: 'break-word'
                                                }}
                                            >
                                                <div style={{ fontWeight: 700 }}>{row.name}</div>
                                            </td>
                                            <td
                                                style={{
                                                    padding: '10px 12px',
                                                    fontSize: '13px',
                                                    wordBreak: 'normal',
                                                    overflowWrap: 'break-word'
                                                }}
                                            >
                                                {row.category || '—'}
                                            </td>
                                            <td style={{ padding: '10px 12px', fontSize: '13px', whiteSpace: 'nowrap' }}>{fmtMoney(row.price)}</td>
                                            <td style={{ padding: '10px 12px', fontSize: '13px' }}>{row.active ? 'Sim' : 'Não'}</td>
                                            <td className="admin-campaigns-actions-cell admin-campaigns-table-actions-col">
                                                <div className="admin-campaigns-actions-row">
                                                    <button
                                                        type="button"
                                                        className="admin-campaigns-action-btn admin-campaigns-action-btn--edit"
                                                        onClick={() => openEdit(row)}
                                                    >
                                                        Editar
                                                    </button>
                                                    {row.active ? (
                                                        <button
                                                            type="button"
                                                            className="admin-campaigns-action-btn admin-campaigns-action-btn--inativar"
                                                            onClick={() => toggleActiveRow(row)}
                                                        >
                                                            Inativar
                                                        </button>
                                                    ) : (
                                                        <button
                                                            type="button"
                                                            className="admin-campaigns-action-btn admin-campaigns-action-btn--ativar"
                                                            onClick={() => toggleActiveRow(row)}
                                                        >
                                                            Ativar
                                                        </button>
                                                    )}
                                                    <button
                                                        type="button"
                                                        className="admin-campaigns-action-btn admin-campaigns-action-btn--apagar"
                                                        onClick={() => deleteServiceRow(row)}
                                                    >
                                                        Apagar
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                )}

                {serviceModal && (
                    <div className="password-overlay" style={{ zIndex: 10060 }} role="dialog" aria-modal="true">
                        <div
                            className="password-modal"
                            style={{
                                maxWidth: '520px',
                                width: '100%',
                                overflow: 'visible',
                                boxSizing: 'border-box',
                                textAlign: 'left'
                            }}
                        >
                            <div
                                style={{
                                    maxHeight: 'min(90vh, 720px)',
                                    overflowY: 'auto',
                                    overflowX: 'hidden',
                                    WebkitOverflowScrolling: 'touch',
                                    boxSizing: 'border-box'
                                }}
                            >
                                <h3 style={{ marginBottom: '12px', textAlign: 'center' }}>
                                    {serviceModal.mode === 'create' ? 'Novo serviço' : 'Editar serviço'}
                                </h3>
                                <div className="form-group full-width">
                                    <label className="form-label">Nome *</label>
                                    <input
                                        className="form-control"
                                        style={{ minWidth: 0, width: '100%', boxSizing: 'border-box' }}
                                        value={serviceModal.name}
                                        onChange={(e) => patchField('name', e.target.value)}
                                    />
                                </div>
                                <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                                <div className="form-group full-width" style={{ flex: '1 1 140px', minWidth: 0 }}>
                                    <label className="form-label">Preço (R$) *</label>
                                    <input
                                        className="form-control"
                                        type="number"
                                        min="0"
                                        step="0.01"
                                        value={serviceModal.price}
                                        onChange={(e) => patchField('price', e.target.value)}
                                    />
                                </div>
                                <div className="form-group full-width" style={{ flex: '0 0 120px', minWidth: 0 }}>
                                    <label className="form-label">Duração (min) *</label>
                                    <input
                                        className="form-control"
                                        type="number"
                                        min="1"
                                        step="1"
                                        value={serviceModal.duration}
                                        onChange={(e) => patchField('duration', e.target.value)}
                                    />
                                </div>
                            </div>
                            <div className="form-group full-width">
                                <label className="form-label">Descrição Procedimento</label>
                                <textarea
                                    className="form-control"
                                    style={{ minWidth: 0, width: '100%', boxSizing: 'border-box' }}
                                    rows={3}
                                    value={serviceModal.detail}
                                    onChange={(e) => patchField('detail', e.target.value)}
                                />
                            </div>
                            <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '0 0 12px', lineHeight: 1.45 }}>
                                Vales, pacotes promocionais e vínculo com campanhas são geridos na aba <strong>Campanhas</strong>.
                            </p>
                            <label
                                style={{
                                    display: 'flex',
                                    alignItems: 'flex-start',
                                    gap: '10px',
                                    marginBottom: '12px',
                                    fontSize: '14px',
                                    lineHeight: 1.4,
                                    cursor: 'pointer'
                                }}
                            >
                                <input
                                    type="checkbox"
                                    checked={!!serviceModal.active}
                                    onChange={(e) => patchField('active', e.target.checked)}
                                    style={{ marginTop: '3px', flexShrink: 0, width: '18px', height: '18px', accentColor: 'var(--brand-primary)' }}
                                />
                                <span>
                                    <strong>Visível para clientes</strong>
                                    <span style={{ display: 'block', fontSize: '12px', color: 'var(--text-muted)', fontWeight: 500, marginTop: '4px' }}>
                                        Quando desmarcado, o serviço deixa de aparecer no agendamento online para novas clientes (agendamentos já feitos
                                        permanecem).
                                    </span>
                                </span>
                            </label>
                            {serviceModal.error && (
                                <div className="alert alert-error" style={{ marginBottom: '10px', fontSize: '13px' }}>
                                    {serviceModal.error}
                                </div>
                            )}
                            <div className="modal-actions" style={{ marginTop: '8px' }}>
                                <button type="button" className="btn-cancel" onClick={closeSvc} disabled={serviceModal.saving}>
                                    Cancelar
                                </button>
                                <button type="button" className="btn-submit" style={{ flex: 1 }} onClick={submitServiceModal} disabled={serviceModal.saving}>
                                    {serviceModal.saving ? 'Salvando…' : 'Salvar'}
                                </button>
                            </div>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    const renderReport = () => {
        const summary = reportData?.summary || null;
        const items = Array.isArray(reportData?.items) ? reportData.items : [];

        const Card = ({ title, value, hint }) => (
            <div style={{background: '#fcfcfc', border: '1px solid #ddd', padding: '14px', borderRadius: '10px', textAlign: 'left', minWidth: 0, boxSizing: 'border-box'}}>
                <div style={{fontSize: '12px', color: 'var(--text-muted)', marginBottom: '6px', lineHeight: 1.35}}>{title}</div>
                <div className="report-kpi-value" style={{fontSize: '18px', fontWeight: '800'}}>{value}</div>
                {hint && <div style={{fontSize: '12px', color: 'var(--text-muted)', marginTop: '8px', lineHeight: 1.4}}>{hint}</div>}
            </div>
        );

        return (
            <div style={{textAlign: 'left'}}>
                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', gap: '12px', flexWrap: 'wrap', marginBottom: '14px'}}>
                    <h3 style={{margin: 0}}>Relatório de Faturamento</h3>
                    <div className="report-filters-row">
                        <div className="report-date-field">
                            <label className="report-date-label" htmlFor="report-date-start">Data inicial</label>
                            <input
                                id="report-date-start"
                                type="date"
                                className="form-control report-date-input"
                                value={reportStartDate}
                                onChange={e => setReportStartDate(e.target.value)}
                            />
                        </div>
                        <div className="report-date-field">
                            <label className="report-date-label" htmlFor="report-date-end">Data final</label>
                            <input
                                id="report-date-end"
                                type="date"
                                className="form-control report-date-input"
                                value={reportEndDate}
                                onChange={e => setReportEndDate(e.target.value)}
                            />
                        </div>
                        <button type="button" className="btn-submit report-filters-search" onClick={fetchReport} style={{padding: '10px 14px', fontSize: '13px', minHeight: '44px'}}>
                            Buscar
                        </button>
                    </div>
                </div>

                {reportLoading && (
                    <div className="alert" style={{background: '#f8fafc', border: '1px solid #e2e8f0', color: '#334155'}}>
                        Carregando...
                    </div>
                )}

                {!!reportError && (
                    <div className="alert alert-error" style={{marginBottom: '12px'}}>
                        {reportError}
                    </div>
                )}

                {summary && (
                    <>
                        <div style={{display: 'grid', gap: '12px', marginBottom: '16px', width: '100%', boxSizing: 'border-box', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 200px), 1fr))'}}>
                            <Card title="Total recebido" value={formatBRL(summary.totalRevenue)} hint="Soma do que já entrou no caixa (InfinitePay integral, parcial legado, quitações ou recebimento no local confirmado no painel), apenas em confirmados ou concluídos." />
                            <Card title="Valor a receber" value={formatBRL(summary.totalRemainingToReceive)} hint="Inclui saldo pendente em confirmados (pagamento no local a confirmar, parcial legado, etc.) e valores ainda não pagos em agendamentos com pagamento online pendente no período." />
                            <Card title="Agendamentos no período" value={String(summary.totalAppointments || 0)} />
                            <Card title="Clientes únicos" value={String(summary.uniqueClients || 0)} />
                        </div>

                        <div className="report-table-wrap">
                            <table className="admin-report-table" style={{ width: '100%', borderCollapse: 'collapse' }}>
                                <thead>
                                    <tr style={{background: '#f8fafc'}}>
                                        <th className="report-col-client" style={{textAlign: 'left', padding: '12px 10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Cliente</th>
                                        <th className="report-col-service" style={{textAlign: 'left', padding: '12px 10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Serviço</th>
                                        <th className="report-col-nowrap" style={{textAlign: 'left', padding: '12px 10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px', minWidth: '104px'}}>Data</th>
                                        <th className="report-col-nowrap" style={{textAlign: 'left', padding: '12px 10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px', minWidth: '56px'}}>Hora</th>
                                        <th className="report-col-nowrap" style={{textAlign: 'left', padding: '12px 10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px', minWidth: '168px'}}>Status</th>
                                        <th className="report-col-nowrap" style={{textAlign: 'left', padding: '12px 10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px', minWidth: '132px'}} title="Tipo de pagamento">Tipo pagamento</th>
                                        <th className="report-col-nowrap" style={{textAlign: 'right', padding: '12px 10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px', minWidth: '118px'}} title="Valor total do procedimento">Total proced.</th>
                                        <th className="report-col-nowrap" style={{textAlign: 'right', padding: '12px 10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px', minWidth: '96px'}}>Valor pago</th>
                                        <th className="report-col-nowrap" style={{textAlign: 'right', padding: '12px 14px 12px 10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px', minWidth: '104px'}}>Valor restante</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {items.length === 0 ? (
                                        <tr>
                                            <td colSpan="9" style={{padding: '12px', fontSize: '13px', color: 'var(--text-muted)'}}>
                                                Nenhum item no período.
                                            </td>
                                        </tr>
                                    ) : items.map((it, idx) => {
                                        const dateLabel = it.date ? new Date(it.date + 'T12:00:00').toLocaleDateString('pt-BR') : '-';
                                        const effPaid = (it.effectiveReceivedPaid === null || it.effectiveReceivedPaid === undefined) ? null : Number(it.effectiveReceivedPaid);
                                        const remainingAmount = (it.remainingAmount === null || it.remainingAmount === undefined) ? null : Number(it.remainingAmount);
                                        const paymentTypeRaw = (it.paymentType || '').toString().toLowerCase();
                                        const paymentType =
                                            paymentTypeRaw === 'local'
                                                ? 'Pagamento no local'
                                                : paymentTypeRaw === 'partial'
                                                  ? 'Parcial (histórico)'
                                                  : paymentTypeRaw === 'full'
                                                    ? 'Total / online'
                                                    : '-';

                                        const procTotal = (it.procedureTotal === null || it.procedureTotal === undefined) ? null : Number(it.procedureTotal);

                                        return (
                                            <tr key={it.id || idx} style={{borderBottom: '1px solid #f1f5f9'}}>
                                                <td className="report-col-client" style={{padding: '12px 10px', fontSize: '13px'}}>{it.clientName || '-'}</td>
                                                <td className="report-col-service" style={{padding: '12px 10px', fontSize: '13px'}}>{it.serviceName || it.serviceId || '-'}</td>
                                                <td className="report-col-nowrap" style={{padding: '12px 10px', fontSize: '13px'}}>{dateLabel}</td>
                                                <td className="report-col-nowrap" style={{padding: '12px 10px', fontSize: '13px'}}>{it.time || '-'}</td>
                                                <td className="report-col-nowrap" style={{padding: '12px 10px', fontSize: '13px'}}>
                                                    <StatusBadge
                                                        status={it.status}
                                                        paymentType={it.paymentType}
                                                        paymentMethod={it.paymentMethod}
                                                        remainingAmount={it.remainingAmount ?? it.remaining_amount}
                                                        paidAmount={it.paidAmount}
                                                        captureMethod={it.captureMethod}
                                                    />
                                                </td>
                                                <td className="report-col-nowrap" style={{padding: '12px 10px', fontSize: '13px'}}>{paymentType}</td>
                                                <td className="report-col-nowrap" style={{padding: '12px 10px', fontSize: '13px', textAlign: 'right'}}>{procTotal != null && Number.isFinite(procTotal) ? formatBRL(procTotal) : '—'}</td>
                                                <td className="report-col-nowrap" style={{padding: '12px 10px', fontSize: '13px', textAlign: 'right'}}>{effPaid != null && Number.isFinite(effPaid) && effPaid > 0 ? formatBRL(effPaid) : '—'}</td>
                                                <td className="report-col-nowrap" style={{padding: '12px 14px 12px 10px', fontSize: '13px', textAlign: 'right'}}>{remainingAmount != null ? formatBRL(remainingAmount) : '-'}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </>
                )}
            </div>
        );

const MyAppointmentsArea = ({
    appointments,
    refreshData,
    clients,
    setView,
    adminWhatsApp,
    catalogServicesClient,
    blockedSlots,
    blockedFullDays
}) => {
    const readStoredMyAppointmentsDigits = () => {
        try {
            const d = String(sessionStorage.getItem(MY_APPOINTMENTS_PHONE_STORAGE_KEY) || '').replace(/\D/g, '');
            return d.length >= 10 ? d : '';
        } catch (_) {
            return '';
        }
    };

    const [phoneInput, setPhoneInput] = useState(() => readStoredMyAppointmentsDigits());
    const [filter, setFilter] = useState('next'); // next | all | past
    const [selfEditModal, setSelfEditModal] = useState(null);
    const [selfEditError, setSelfEditError] = useState('');
    const [selfEditSaving, setSelfEditSaving] = useState(false);
    const [selfEditBanner, setSelfEditBanner] = useState('');
    const [cancelBanner, setCancelBanner] = useState('');
    const [rescheduleModal, setRescheduleModal] = useState(null);
    const [rescheduleSaving, setRescheduleSaving] = useState(false);
    const [rescheduleError, setRescheduleError] = useState('');
    const [profileFromServer, setProfileFromServer] = useState(null);
    const [myAppsRefreshing, setMyAppsRefreshing] = useState(false);
    const myAppsRefreshDebounceRef = useRef(null);
    const myAppsRefreshInFlight = useRef(false);

    const myAppsCatalogLookup = useMemo(() => {
        if (Array.isArray(catalogServicesClient) && catalogServicesClient.length > 0) {
            return catalogServicesClient;
        }
        return null;
    }, [catalogServicesClient]);

    const cleanPhone = (p) => String(p || '').replace(/\D/g, '');
    const myPhone = cleanPhone(phoneInput);
    const todayStr = getLocalTodayStr();

    useEffect(() => {
        if (myPhone.length < 10) {
            try {
                sessionStorage.removeItem(MY_APPOINTMENTS_PHONE_STORAGE_KEY);
            } catch (_) { /* ignore */ }
        } else {
            try {
                sessionStorage.setItem(MY_APPOINTMENTS_PHONE_STORAGE_KEY, myPhone);
            } catch (_) { /* ignore */ }
        }
    }, [myPhone]);

    const runRefreshAppointmentsList = useCallback(async () => {
        if (myAppsRefreshInFlight.current) return;
        myAppsRefreshInFlight.current = true;
        setMyAppsRefreshing(true);
        try {
            await refreshData();
        } finally {
            myAppsRefreshInFlight.current = false;
            setMyAppsRefreshing(false);
        }
    }, [refreshData]);

    /** Telefone com ≥10 dígitos: recarrega lista após debounce (alinhado ao sessionStorage usado em refreshData). */
    useEffect(() => {
        if (myPhone.length < 10) {
            if (myAppsRefreshDebounceRef.current) {
                clearTimeout(myAppsRefreshDebounceRef.current);
                myAppsRefreshDebounceRef.current = null;
            }
            return undefined;
        }
        if (myAppsRefreshDebounceRef.current) {
            clearTimeout(myAppsRefreshDebounceRef.current);
        }
        myAppsRefreshDebounceRef.current = setTimeout(() => {
            myAppsRefreshDebounceRef.current = null;
            void runRefreshAppointmentsList();
        }, 450);
        return () => {
            if (myAppsRefreshDebounceRef.current) {
                clearTimeout(myAppsRefreshDebounceRef.current);
                myAppsRefreshDebounceRef.current = null;
            }
        };
    }, [myPhone, runRefreshAppointmentsList]);

    const handleMyAppsRefreshClick = useCallback(async () => {
        if (myAppsRefreshDebounceRef.current) {
            clearTimeout(myAppsRefreshDebounceRef.current);
            myAppsRefreshDebounceRef.current = null;
        }
        if (myPhone.length < 10) {
            await refreshData();
            return;
        }
        await runRefreshAppointmentsList();
    }, [myPhone, refreshData, runRefreshAppointmentsList]);

    useEffect(() => {
        if (myPhone.length < 10) {
            setProfileFromServer(null);
            return undefined;
        }
        let cancelled = false;
        (async () => {
            try {
                const r = await fetch(
                    `${API_BASE_URL}/public/clients?phoneDigits=${encodeURIComponent(myPhone)}`,
                    { cache: 'no-store' }
                );
                const arr = await r.json().catch(() => []);
                if (!cancelled) {
                    setProfileFromServer(Array.isArray(arr) && arr[0] ? arr[0] : null);
                }
            } catch {
                if (!cancelled) setProfileFromServer(null);
            }
        })();
        return () => {
            cancelled = true;
        };
    }, [myPhone]);

    const myApps = useMemo(() => {
        if (!myPhone || myPhone.length < 10) return [];

        const list = (appointments || []).filter(a => {
            const apPhone = cleanPhone(a.clientPhone || a.client_phone);
            return apPhone && apPhone === myPhone;
        });

        const sorted = list.slice().sort((a, b) => {
            const da = a.date || '';
            const db = b.date || '';
            if (da !== db) return da.localeCompare(db);
            const ta = (a.time || '').toString();
            const tb = (b.time || '').toString();
            return ta.localeCompare(tb);
        });

        if (filter === 'all') return sorted;
        if (filter === 'past') return sorted.filter(a => (a.date || '') < todayStr);
        return sorted.filter(a => (a.date || '') >= todayStr);
    }, [appointments, myPhone, filter, todayStr]);

    const matchedClient = useMemo(() => {
        if (!myPhone || myPhone.length < 10) return null;
        const list = clients || [];
        let c = list.find((cl) => cleanPhone(cl.phone) === myPhone);
        if (c) return c;
        if (profileFromServer && cleanPhone(profileFromServer.phone) === myPhone) {
            return profileFromServer;
        }
        if (myApps.length) {
            const cid = myApps[0].clientId || myApps[0].client_id;
            if (cid) {
                const byId = list.find((cl) => cl.id === cid);
                const apPh = cleanPhone(myApps[0].clientPhone || myApps[0].client_phone);
                if (byId && apPh === myPhone) return byId;
            }
            const apPh2 = cleanPhone(myApps[0].clientPhone || myApps[0].client_phone);
            if (apPh2 === myPhone) {
                return {
                    id: myApps[0].clientId || myApps[0].client_id || '',
                    name: myApps[0].clientName || myApps[0].client_name || 'Cliente',
                    phone: myApps[0].clientPhone || myApps[0].client_phone || '',
                    address: '',
                    email: ''
                };
            }
        }
        return null;
    }, [clients, myPhone, myApps, profileFromServer]);

    useEffect(() => {
        if (!selfEditBanner) return undefined;
        const t = setTimeout(() => setSelfEditBanner(''), 5000);
        return () => clearTimeout(t);
    }, [selfEditBanner]);

    useEffect(() => {
        if (!cancelBanner) return undefined;
        const t = setTimeout(() => setCancelBanner(''), 10000);
        return () => clearTimeout(t);
    }, [cancelBanner]);

    const canClientCancelAppointment = (app) => {
        const st = String(app?.status || '').trim();
        if (st === 'cancelled' || st === 'completed') return false;
        return st === 'pending_payment' || st === 'confirmed';
    };

    const handleCancelMyAppointment = async (app) => {
        if (!app?.id) return;
        if (!window.confirm('Deseja realmente cancelar este agendamento por completo?')) return;
        try {
            const res = await fetch(`${API_BASE_URL}/appointments/${encodeURIComponent(app.id)}/cancel`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cancelledBy: 'client',
                    cancelReason: 'Cancelado pelo cliente em Meus agendamentos',
                    verifyPhoneDigits: myPhone
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(data.error || 'Não foi possível cancelar o agendamento.');
            }
            setCancelBanner(
                'Agendamento cancelado com sucesso.\n\nSe precisar, você pode realizar um novo agendamento a qualquer momento.'
            );
            await refreshData();
        } catch (e) {
            alert(e.message || 'Erro ao cancelar o agendamento.');
        }
    };

    const canClientActOnAppointmentItem = (item, app) => {
        if (String(item.status || '').toLowerCase() === APPOINTMENT_ITEM_STATUS_CANCELLED) return false;
        const st = String(app?.status || '').trim();
        if (st === 'cancelled' || st === 'completed') return false;
        if (st !== 'pending_payment' && st !== 'confirmed') return false;
        if (!item.date || !item.time) return false;
        const apDateTimeStr = `${item.date}T${item.time}:00-03:00`;
        const diffHours = (new Date(apDateTimeStr).getTime() - Date.now()) / (1000 * 60 * 60);
        return diffHours >= 2;
    };

    const handleCancelMyAppointmentItem = async (app, item) => {
        if (!app?.id || item?.slotIndex == null) return;
        if (
            !window.confirm(
                `Cancelar somente «${item.name || 'este procedimento'}»?\n\nOs demais procedimentos deste agendamento permanecem ativos.`
            )
        ) {
            return;
        }
        try {
            const res = await fetch(
                `${API_BASE_URL}/appointments/${encodeURIComponent(app.id)}/slots/${encodeURIComponent(item.slotIndex)}/cancel`,
                {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cancelledBy: 'client',
                        cancelReason: 'Procedimento cancelado pelo cliente em Meus agendamentos',
                        verifyPhoneDigits: myPhone
                    })
                }
            );
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(data.error || 'Não foi possível cancelar este procedimento.');
            }
            setCancelBanner(`Procedimento «${item.name || 'selecionado'}» cancelado. Os demais itens do agendamento foram mantidos.`);
            await refreshData();
        } catch (e) {
            alert(e.message || 'Erro ao cancelar o procedimento.');
        }
    };

    const openRescheduleItem = (app, item, opts) => {
        if (!item) return;
        setRescheduleError('');
        setRescheduleModal({
            appId: app.id,
            slotIndex: item.slotIndex,
            serviceId: item.id,
            serviceName: item.name,
            date: item.date || '',
            time: normalizeSlotTimeLabel(item.time) || '',
            generalLabel: !!(opts && opts.generalLabel)
        });
    };

    const openRescheduleGeneral = (app) => {
        const item = getActiveLineItemsFromAppointmentApp(app, myAppsCatalogLookup)[0];
        if (!item) return;
        openRescheduleItem(app, item, { generalLabel: true });
    };

    const rescheduleSlotsForModal = useMemo(() => {
        if (!rescheduleModal?.date) return [];
        return generateTimeSlots(
            rescheduleModal.date,
            appointments || [],
            blockedSlots || [],
            blockedFullDays || [],
            rescheduleModal.serviceId ? [rescheduleModal.serviceId] : [],
            myAppsCatalogLookup
        );
    }, [rescheduleModal, appointments, blockedSlots, blockedFullDays, myAppsCatalogLookup]);

    const submitRescheduleItem = async () => {
        if (!rescheduleModal) return;
        setRescheduleError('');
        if (!rescheduleModal.date || !rescheduleModal.time) {
            setRescheduleError('Escolha data e horário.');
            return;
        }
        setRescheduleSaving(true);
        try {
            const res = await fetch(
                `${API_BASE_URL}/appointments/${encodeURIComponent(rescheduleModal.appId)}/slots/${encodeURIComponent(rescheduleModal.slotIndex)}/reschedule`,
                {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        date: rescheduleModal.date,
                        time: rescheduleModal.time,
                        verifyPhoneDigits: myPhone
                    })
                }
            );
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(data.error || 'Não foi possível reagendar este procedimento.');
            }
            setRescheduleModal(null);
            setCancelBanner(`Procedimento «${rescheduleModal.serviceName || 'selecionado'}» reagendado com sucesso.`);
            await refreshData();
        } catch (e) {
            setRescheduleError(e.message || 'Erro ao reagendar.');
        } finally {
            setRescheduleSaving(false);
        }
    };

    const openSelfEdit = () => {
        if (!matchedClient || !myPhone) return;
        setSelfEditError('');
        setSelfEditBanner('');
        setSelfEditModal({
            id: matchedClient.id,
            name: matchedClient.name || '',
            phone: matchedClient.phone || '',
            email: String(matchedClient.email || '').trim(),
            address: matchedClient.address || '',
            verifyDigits: myPhone
        });
    };

    const saveSelfEdit = async () => {
        if (!selfEditModal) return;
        setSelfEditError('');
        const em = String(selfEditModal.email || '').trim().toLowerCase();
        if (!isValidEmailFormat(em)) {
            setSelfEditError('Informe um e-mail válido.');
            return;
        }
        const newDigits = cleanPhone(selfEditModal.phone);
        if (!newDigits) {
            setSelfEditError('O telefone é obrigatório para localizar seus agendamentos.');
            return;
        }
        if (!(selfEditModal.name || '').trim()) {
            setSelfEditError('Nome é obrigatório.');
            return;
        }
        setSelfEditSaving(true);
        try {
            const res = await fetch(`${API_BASE_URL}/clients/${encodeURIComponent(selfEditModal.id)}/self`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    verifyPhoneDigits: selfEditModal.verifyDigits,
                    name: (selfEditModal.name || '').trim(),
                    phone: newDigits,
                    address: (selfEditModal.address || '').trim(),
                    email: em
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setSelfEditError(data.error || 'Não foi possível salvar.');
                return;
            }
            setSelfEditModal(null);
            if (newDigits !== myPhone) {
                setPhoneInput(newDigits);
            }
            setSelfEditBanner('Cadastro atualizado com sucesso.');
            await refreshData();
        } catch {
            setSelfEditError('Falha de rede ao salvar.');
        } finally {
            setSelfEditSaving(false);
        }
    };

    return (
        <div className="booking-section step-container" style={{textAlign: 'center'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', gap: '12px', alignItems: 'center', flexWrap: 'wrap', marginBottom: '20px'}}>
                <h2 style={{margin: 0}}>Meus Agendamentos</h2>
                <div style={{display: 'inline-flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap', justifyContent: 'flex-end'}}>
                    {matchedClient && myPhone && (
                        <button
                            type="button"
                            className="refresh-btn"
                            onClick={openSelfEdit}
                            style={{
                                padding: '7px 12px',
                                borderRadius: '999px',
                                width: 'fit-content',
                                maxWidth: '100%',
                                opacity: 0.92
                            }}
                            aria-label="Editar cadastro"
                        >
                            <i className="fas fa-pen" aria-hidden="true"></i>
                            Editar cadastro
                        </button>
                    )}
                    <button
                        type="button"
                        className="btn-admin"
                        onClick={() => void handleMyAppsRefreshClick()}
                        disabled={myAppsRefreshing}
                    >
                        <i className={`fas fa-sync-alt${myAppsRefreshing ? ' fa-spin' : ''}`} aria-hidden="true"></i>{' '}

                    </button>
                </div>
            </div>

            {myAppsRefreshing && (
                <p style={{ fontSize: '13px', color: 'var(--text-muted)', margin: '0 0 12px', textAlign: 'center' }}>
                    Atualizando…
                </p>
            )}

            <div style={{maxWidth: '520px', margin: '0 auto', textAlign: 'left', width: '100%', boxSizing: 'border-box', padding: '0 4px'}}>
                <label style={{fontSize: '13px', color: 'var(--text-muted)', display: 'block', marginBottom: '8px'}}>
                    Digite seu telefone para ver seus agendamentos
                </label>
                <input
                    type="text"
                    className="form-control"
                    value={phoneInput}
                    onChange={e => setPhoneInput(e.target.value)}
                    placeholder="Ex: (41) 99999-9999"
                    style={{ width: '100%', boxSizing: 'border-box' }}
                />

                <div className="filter-tabs" style={{marginTop: '18px', marginBottom: '18px', justifyContent: 'center'}}>
                    <button className={`tab-btn ${filter === 'next' ? 'active' : ''}`} onClick={() => setFilter('next')}>
                        Próximos
                    </button>
                    <button className={`tab-btn ${filter === 'past' ? 'active' : ''}`} onClick={() => setFilter('past')}>
                        Anteriores
                    </button>
                    <button className={`tab-btn ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>
                        Todos
                    </button>
                </div>
            </div>

            {selfEditBanner && (
                <div className="alert" style={{ background: '#ecfdf5', border: '1px solid #a7f3d0', color: '#065f46', maxWidth: '520px', margin: '0 auto 12px', fontSize: '14px' }}>
                    {selfEditBanner}
                </div>
            )}

            {cancelBanner && (
                <div
                    className="alert"
                    role="status"
                    style={{
                        background: '#ecfdf5',
                        border: '1px solid #a7f3d0',
                        color: '#065f46',
                        maxWidth: '520px',
                        margin: '0 auto 12px',
                        fontSize: '14px',
                        lineHeight: 1.55,
                        whiteSpace: 'pre-line',
                        textAlign: 'left'
                    }}
                >
                    {cancelBanner}
                </div>
            )}

            {myPhone.length < 10 && (
                <div className="alert" style={{background: '#f8fafc', border: '1px solid #e2e8f0', color: '#334155'}}>
                    Informe seu telefone acima para carregar seus agendamentos.
                </div>
            )}

            {myPhone.length >= 10 && myApps.length === 0 && (
                <div className="alert" style={{background: '#f8fafc', border: '1px solid #e2e8f0', color: '#334155'}}>
                    Nenhum agendamento encontrado para este telefone.
                </div>
            )}

            <div style={{display: 'flex', flexDirection: 'column', gap: '12px', marginTop: '10px', width: '100%', maxWidth: '100%', boxSizing: 'border-box'}}>
                {myApps.map(app => {
                    const clientName = app.clientName || app.client_name || 'Cliente';
                    const phone = app.clientPhone || app.client_phone || '';
                    const { label: serviceName, total: serviceTotal, scheduleHint } = formatAgendaServiceSummary(app, myAppsCatalogLookup);
                    const servicePriceStr =
                        typeof serviceTotal === 'number' && Number.isFinite(serviceTotal) ? formatPrice(serviceTotal) : null;
                    const dateLabel = app.date
                        ? new Date(app.date + 'T12:00:00').toLocaleDateString('pt-BR')
                        : 'Sem data';
                    const timeLabel = app.time || 'Sem horário';
                    const location = app.location || '';
                    const notes = app.notes || '';
                    const cancelReason = app.cancelReason || app.cancel_reason || '';
                    const paymentBlock = buildMyAppointmentsPaymentBlock(app, serviceTotal);
                    const appointmentItems = buildLineItemsFromAppointmentApp(app, myAppsCatalogLookup);
                    const activeItems = getActiveLineItemsFromAppointmentApp(app, myAppsCatalogLookup);
                    const actionMode = getMyAppointmentActionMode(app, myAppsCatalogLookup);
                    const showPerItemActions = actionMode === 'multi';
                    const canManage = canClientCancelAppointment(app);
                    const soleActiveItem = activeItems.length === 1 ? activeItems[0] : null;
                    const canRescheduleGeneral =
                        actionMode === 'single' && soleActiveItem && canClientActOnAppointmentItem(soleActiveItem, app);

                    return (
                        <AgendaAppointmentCard
                            key={app.id}
                            className="my-app-card"
                            headerMain={
                                <>
                                    <div
                                        style={{
                                            fontWeight: '700',
                                            marginBottom: '6px',
                                            fontSize: '16px',
                                            lineHeight: 1.35,
                                            color: 'var(--text-dark)'
                                        }}
                                    >
                                        {serviceName}
                                    </div>
                                    {servicePriceStr ? (
                                        <div style={{ fontSize: '13px', color: 'var(--text-muted)', marginBottom: '8px', lineHeight: 1.45 }}>
                                            Total do procedimento:{' '}
                                            <strong style={{ color: 'var(--text-dark)', fontWeight: 600 }}>{servicePriceStr}</strong>
                                        </div>
                                    ) : null}
                                    {scheduleHint ? (
                                        <div
                                            style={{
                                                fontSize: '13px',
                                                color: 'var(--text-dark)',
                                                marginTop: '4px',
                                                fontWeight: 600,
                                                lineHeight: 1.45
                                            }}
                                        >
                                            Horários: {scheduleHint}
                                        </div>
                                    ) : null}
                                </>
                            }
                            headerAside={
                                <>
                                    <div className="my-app-card__status">
                                        <StatusBadge
                                            status={app.status}
                                            paymentType={app.paymentType}
                                            paymentMethod={app.paymentMethod}
                                            remainingAmount={app.remainingAmount ?? app.remaining_amount}
                                            paidAmount={app.paidAmount ?? app.paid_amount}
                                            captureMethod={app.captureMethod ?? app.capture_method}
                                        />
                                    </div>
                                    <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
                                        {dateLabel} • {timeLabel}
                                    </div>
                                </>
                            }
                            footer={
                                canManage ? (
                                    <div className="my-app-card-footer-actions">
                                        {actionMode === 'single' ? (
                                            <>
                                                <button
                                                    type="button"
                                                    className="btn-cancel my-app-card__cancel"
                                                    onClick={() => handleCancelMyAppointment(app)}
                                                    style={{ borderColor: 'rgba(180, 83, 9, 0.45)', color: '#b45309' }}
                                                >
                                                    Cancelar agendamento
                                                </button>
                                                {canRescheduleGeneral ? (
                                                    <button
                                                        type="button"
                                                        className="my-app-btn-secondary btn-admin"
                                                        style={{
                                                            border: '1px solid var(--border-color)',
                                                            borderRadius: '8px',
                                                            background: '#fff'
                                                        }}
                                                        onClick={() => openRescheduleGeneral(app)}
                                                    >
                                                        Reagendar agendamento
                                                    </button>
                                                ) : null}
                                            </>
                                        ) : null}
                                        {actionMode === 'multi' ? (
                                            <button
                                                type="button"
                                                className="btn-cancel my-app-card-footer-actions__complete"
                                                onClick={() => handleCancelMyAppointment(app)}
                                            >
                                                Cancelar agendamento completo
                                            </button>
                                        ) : null}
                                    </div>
                                ) : null
                            }
                        >
                            <>
                                {appointmentItems.length > 0 ? (
                                    <div className="my-app-procedures-box">
                                        <div style={{ fontWeight: 700, fontSize: '13px', color: 'var(--text-dark)' }}>Procedimentos</div>
                                        {appointmentItems.map((item) => {
                                            const cancelled =
                                                String(item.status || '').toLowerCase() === APPOINTMENT_ITEM_STATUS_CANCELLED;
                                            const itemDate = item.date
                                                ? new Date(item.date + 'T12:00:00').toLocaleDateString('pt-BR')
                                                : '—';
                                            const itemTime = item.time || '—';
                                            const canActItem =
                                                showPerItemActions && canClientActOnAppointmentItem(item, app);
                                            return (
                                                <div
                                                    key={`${app.id}-${item.slotIndex}-${item.id}`}
                                                    className={`my-app-procedure-row${cancelled ? ' my-app-procedure-row--cancelled' : ''}`}
                                                >
                                                    <div style={{ fontWeight: 600, fontSize: '14px', marginBottom: '4px' }}>
                                                        {item.name || item.id}
                                                    </div>
                                                    <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '8px' }}>
                                                        {itemDate} • {itemTime}
                                                    </div>
                                                    <div style={{ fontSize: '12px', marginBottom: canActItem ? '6px' : 0 }}>
                                                        <strong>Status:</strong>{' '}
                                                        {cancelled ? 'Cancelado' : app.status === 'pending_payment' ? 'Pendente pagamento' : 'Confirmado'}
                                                    </div>
                                                    {canActItem ? (
                                                        <div className="my-app-procedure-actions">
                                                            <button
                                                                type="button"
                                                                className="btn-cancel"
                                                                style={{ borderColor: 'rgba(180, 83, 9, 0.45)', color: '#b45309' }}
                                                                onClick={() => handleCancelMyAppointmentItem(app, item)}
                                                            >
                                                                Cancelar este procedimento
                                                            </button>
                                                            <button
                                                                type="button"
                                                                className="my-app-btn-secondary btn-admin"
                                                                style={{
                                                                    border: '1px solid var(--border-color)',
                                                                    borderRadius: '8px',
                                                                    background: '#fff'
                                                                }}
                                                                onClick={() => openRescheduleItem(app, item)}
                                                            >
                                                                Reagendar este procedimento
                                                            </button>
                                                        </div>
                                                    ) : null}
                                                </div>
                                            );
                                        })}
                                    </div>
                                ) : null}
                                {paymentBlock && (
                                    <div
                                        style={{
                                            fontSize: '13px',
                                            lineHeight: 1.55,
                                            color: 'var(--text-dark)',
                                            maxWidth: '100%',
                                            boxSizing: 'border-box',
                                            display: 'flex',
                                            flexDirection: 'column',
                                            gap: '4px'
                                        }}
                                    >
                                        <div>
                                            <strong>Pagamento:</strong> {paymentBlock.summaryLine}
                                        </div>
                                        {paymentBlock.rows.map((row, idx) => (
                                            <div key={`${row.label}-${idx}`}>
                                                <strong>{row.label}:</strong> {row.value}
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div style={{ fontSize: '13px', lineHeight: 1.45 }}>
                                    <strong>Cliente:</strong> {clientName}
                                </div>

                                <div
                                    style={{
                                        fontSize: '13px',
                                        lineHeight: 1.45,
                                        display: 'flex',
                                        flexDirection: 'column',
                                        gap: '4px',
                                        maxWidth: '100%',
                                        boxSizing: 'border-box',
                                        overflowWrap: 'anywhere'
                                    }}
                                >
                                    <div>
                                        <strong>Telefone do cliente:</strong> {phone || 'N/A'}
                                    </div>
                                    <div>
                                        <strong>Fale com o Ateliê:</strong>{' '}
                                        <a
                                            href={buildAtelieWhatsAppHref(adminWhatsApp, MY_APPOINTMENTS_ATELIE_WA_MESSAGE)}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            style={{ color: '#0ea5e9', textDecoration: 'none' }}
                                        >
                                            Conversar pelo WhatsApp
                                        </a>
                                    </div>
                                </div>

                                {location && (
                                    <div style={{ fontSize: '13px' }}>
                                        <strong>Endereço Cliente:</strong>
                                        <br />
                                        {location}
                                    </div>
                                )}

                                <AgendaCardStudioAtelierBlock />

                                {notes && (
                                    <div style={{ fontSize: '13px' }}>
                                        <strong>Observações:</strong>
                                        <br />
                                        {notes}
                                    </div>
                                )}

                                {cancelReason && (
                                    <div style={{ fontSize: '13px', color: '#b91c1c' }}>
                                        <strong>Motivo do cancelamento:</strong>
                                        <br />
                                        {cancelReason}
                                    </div>
                                )}
                            </>
                        </AgendaAppointmentCard>
                    );
                })}
            </div>

            {rescheduleModal && (
                <div
                    className="password-overlay"
                    style={{ zIndex: 10055, padding: '12px', alignItems: 'center', justifyContent: 'center', boxSizing: 'border-box' }}
                    role="dialog"
                    aria-modal="true"
                >
                    <div className="password-modal" style={{ maxWidth: 'min(440px, calc(100vw - 24px))', width: '100%', textAlign: 'left', maxHeight: '90vh', overflowY: 'auto', boxSizing: 'border-box' }}>
                        <h3 style={{ marginBottom: '12px', textAlign: 'center' }}>
                            {rescheduleModal.generalLabel ? 'Reagendar agendamento' : 'Reagendar procedimento'}
                        </h3>
                        <p style={{ fontSize: '13px', color: 'var(--text-muted)', margin: '0 0 12px', lineHeight: 1.45 }}>
                            <strong>{rescheduleModal.serviceName}</strong> — escolha nova data e horário.

                        <div className="form-group full-width">
                            <label className="form-label">Nova data</label>
                            <input type="date" className="form-control" min={getLocalTodayStr()} value={rescheduleModal.date} onChange={(e) => setRescheduleModal((m) => (m ? { ...m, date: e.target.value, time: '' } : m))} style={{ width: '100%', boxSizing: 'border-box' }} />
                        </div>
                        {rescheduleModal.date ? (
                            <div className="form-group full-width">
                                <label className="form-label">Novo horário</label>
                                <div className="time-slots-grid" style={{ marginTop: '8px' }}>
                                    {rescheduleSlotsForModal.map((slot) => (
                                        <button key={slot.time} type="button" className={`time-slot${rescheduleModal.time === slot.time ? ' selected' : ''}${!slot.available ? ' disabled' : ''}`} disabled={!slot.available} onClick={() => slot.available && setRescheduleModal((m) => (m ? { ...m, time: slot.time } : m))}>{slot.time}</button>
