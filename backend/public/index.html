                                </div>
                            </div>
                        ) : null}
                        {rescheduleError ? <div className="alert alert-error" style={{ marginTop: '10px', fontSize: '13px' }}>{rescheduleError}</div> : null}
                        <div className="modal-actions" style={{ marginTop: '12px' }}>
                            <button type="button" className="btn-cancel" onClick={() => { setRescheduleModal(null); setRescheduleError(''); }} disabled={rescheduleSaving}>Voltar</button>
                            <button type="button" className="btn-submit" style={{ flex: 1 }} onClick={() => void submitRescheduleItem()} disabled={rescheduleSaving}>{rescheduleSaving ? 'Salvando…' : 'Confirmar reagendamento'}</button>
                        </div>
                    </div>
                </div>
            )}

            {selfEditModal && (
                <div className="password-overlay self-edit-overlay" style={{ zIndex: 10050, padding: '12px', alignItems: 'center', justifyContent: 'center', boxSizing: 'border-box' }} role="dialog" aria-modal="true" aria-labelledby="self-edit-title">
                    <div
                        className="password-modal"
                        style={{
                            maxWidth: 'min(420px, calc(100vw - 24px))',
                            width: '100%',
                            textAlign: 'left',
                            maxHeight: '90vh',
                            overflowY: 'auto',
                            boxSizing: 'border-box'
                        }}
                    >
                        <h3 id="self-edit-title" style={{ marginBottom: '16px', textAlign: 'center' }}>Editar cadastro</h3>
                        <div className="form-group full-width">
                            <label className="form-label">Nome</label>
                            <input type="text" className="form-control" value={selfEditModal.name} onChange={e => setSelfEditModal({ ...selfEditModal, name: e.target.value })} style={{ width: '100%', boxSizing: 'border-box' }} />
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">WhatsApp</label>
                            <input type="text" className="form-control" value={selfEditModal.phone} onChange={e => setSelfEditModal({ ...selfEditModal, phone: e.target.value })} style={{ width: '100%', boxSizing: 'border-box' }} />
                            <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '6px 0 0' }}>Necessário para buscar seus agendamentos; não pode ficar vazio.</p>
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">E-mail</label>
                            <input type="email" className="form-control" autoComplete="email" value={selfEditModal.email} onChange={e => setSelfEditModal({ ...selfEditModal, email: e.target.value })} style={{ width: '100%', boxSizing: 'border-box' }} />
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">Endereço</label>
                            <input type="text" className="form-control" value={selfEditModal.address} onChange={e => setSelfEditModal({ ...selfEditModal, address: e.target.value })} style={{ width: '100%', boxSizing: 'border-box' }} />
                        </div>
                        {selfEditError && <div className="alert alert-error" style={{ marginBottom: '12px', fontSize: '13px' }}>{selfEditError}</div>}
                        <div className="modal-actions" style={{ marginTop: '8px', flexWrap: 'wrap', gap: '8px' }}>
                            <button type="button" className="btn-cancel" onClick={() => { setSelfEditModal(null); setSelfEditError(''); }} disabled={selfEditSaving}>Cancelar</button>
                            <button type="button" className="btn-submit" style={{ flex: '1 1 140px', minWidth: 0 }} onClick={saveSelfEdit} disabled={selfEditSaving}>{selfEditSaving ? 'Salvando…' : 'Salvar'}</button>
                        </div>
                    </div>
                </div>
            )}

            <div style={{marginTop: '20px'}}>
                <button className="btn-admin" onClick={() => setView('client')}>
                    <i className="fas fa-arrow-left"></i> Voltar
                </button>
            </div>
        </div>
    );
};


// ============== ROOT APP ==============

function readBookingRestoreOrderNsu() {
    try {
        const u = new URL(window.location.href);
        if (u.searchParams.get('return') === 'booking') {
            return String(u.searchParams.get('order_nsu') || '').trim();
        }
    } catch (_) { /* ignore */ }
    return '';
}

const App = () => {
    const [view, setView] = useState('client');
    const [bookingRestoreOrderNsu, setBookingRestoreOrderNsu] = useState(() => readBookingRestoreOrderNsu());
    const clearBookingRestore = useCallback(() => {
        setBookingRestoreOrderNsu('');
    }, []);

    const [showPassword, setShowPassword] = useState(false);

    const readStoredAdminToken = () => {
        try {
            return sessionStorage.getItem(ADMIN_TOKEN_STORAGE_KEY) || '';
        } catch {
            return '';
        }
    };

    const [adminToken, setAdminToken] = useState(readStoredAdminToken);
    
    const [appointments, setAppointments] = useState([]);
    const [clients, setClients] = useState([]);
    const [blockedSlots, setBlockedSlots] = useState([]);
    const [blockedFullDays, setBlockedFullDays] = useState([]);
    const [adminWhatsApp, setAdminWhatsApp] = useState('');
    const [promoPackagesEnabled, setPromoPackagesEnabled] = useState(false);
    const [catalogServicesClient, setCatalogServicesClient] = useState(null);

    const handleAdminLoginSuccess = (token) => {
        try {
            sessionStorage.setItem(ADMIN_TOKEN_STORAGE_KEY, token);
        } catch (_) { /* ignore */ }
        setAdminToken(token);
        setShowPassword(false);
        setView('admin');
    };

    const handleAdminSessionInvalid = useCallback(() => {
        try {
            sessionStorage.removeItem(ADMIN_TOKEN_STORAGE_KEY);
        } catch (_) { /* ignore */ }
        setAdminToken('');
        setShowPassword(true);
    }, []);

    const mergeAppointmentRow = useCallback((row) => {
        if (!row || row.id == null) return;
        setAppointments((prev) => {
            const list = Array.isArray(prev) ? prev : [];
            const byId = new Map(list.map((a) => [String(a.id), a]));
            byId.set(String(row.id), row);
            return [...byId.values()].sort((a, b) => {
                const da = a.date || '';
                const db = b.date || '';
                if (da !== db) return da.localeCompare(db);
                return String(a.time || '').localeCompare(String(b.time || ''));
            });
        });
    }, []);

    const refreshData = useCallback(async () => {
        try {
            const authHeaders = adminToken ? { Authorization: `Bearer ${adminToken}` } : {};

            if (adminToken && view === 'admin') {
                const resAps = await fetch(`${API_BASE_URL}/appointments`, { headers: authHeaders });
                if (resAps.ok) {
                    const aps = await resAps.json();
                    if (Array.isArray(aps)) setAppointments(aps);
                }

                const resClis = await fetch(`${API_BASE_URL}/clients`, { headers: authHeaders });
                if (resClis.ok) {
                    const cls = await resClis.json();
                    if (Array.isArray(cls)) setClients(cls);
                }
            } else {
                const resOcc = await fetch(`${API_BASE_URL}/public/appointments?purpose=occupancy`, { cache: 'no-store' });
                let merged = resOcc.ok ? await resOcc.json().catch(() => []) : [];
                if (!Array.isArray(merged)) merged = [];

                let savedDigits = '';
                try {
                    savedDigits = String(sessionStorage.getItem(MY_APPOINTMENTS_PHONE_STORAGE_KEY) || '').replace(/\D/g, '');
                } catch (_) { /* ignore */ }
                if (savedDigits.length >= 10) {
                    const mRes = await fetch(
                        `${API_BASE_URL}/public/my-appointments?phoneDigits=${encodeURIComponent(savedDigits)}`,
                        { cache: 'no-store' }
                    );
                    if (mRes.ok) {
                        const myRows = await mRes.json().catch(() => []);
                        if (Array.isArray(myRows) && myRows.length) {
                            const byId = new Map(merged.map((a) => [String(a.id), a]));
                            for (const row of myRows) {
                                if (row && row.id != null) byId.set(String(row.id), row);
                            }
                            merged = [...byId.values()];
                        }
                    }
                }

                merged.sort((a, b) => {
                    const da = a.date || '';
                    const db = b.date || '';
                    if (da !== db) return da.localeCompare(db);
                    return String(a.time || '').localeCompare(String(b.time || ''));
                });
                setAppointments(merged);
                setClients([]);
            }

            const resSch = await fetch(`${API_BASE_URL}/public/schedule-blocks`, { cache: 'no-store' });
            if (resSch.ok) {
                const sch = await resSch.json().catch(() => ({}));
                setBlockedSlots(Array.isArray(sch.blockedSlots) ? sch.blockedSlots : []);
                setBlockedFullDays(Array.isArray(sch.blockedFullDays) ? sch.blockedFullDays : []);
            } else {
                setBlockedSlots([]);
                setBlockedFullDays([]);
            }

            const resCfg = await fetch(`${API_BASE_URL}/config/public`, { cache: 'no-store' });
            if (resCfg.ok) {
                const j = await resCfg.json().catch(() => ({}));
                setAdminWhatsApp(String(j.adminWhatsApp || '').replace(/\D/g, ''));
                const promoRaw = j.promotionalPackagesEnabled;
                setPromoPackagesEnabled(
                    promoRaw === true ||
                        promoRaw === 'true' ||
                        String(promoRaw || '')
                            .trim()
                            .toLowerCase() === 'on'
                );
            }

            const resSvc = await fetch(`${API_BASE_URL}/public/services`, { cache: 'no-store' });
            if (resSvc.ok) {
                const svcList = await resSvc.json().catch(() => null);
                setCatalogServicesClient(Array.isArray(svcList) ? svcList : null);
            } else {
                setCatalogServicesClient(null);
            }
        } catch (e) {
            console.error(e);
        }
    }, [adminToken, view]);

    useEffect(() => {
        refreshData();
        const intervalId = setInterval(refreshData, 10000);
        return () => clearInterval(intervalId);
    }, [refreshData]);

    useEffect(() => {
        if (bookingRestoreOrderNsu) {
            setView('client');
        }
    }, [bookingRestoreOrderNsu]);

    const navigateTo = (tView) => {
        if (tView === 'admin' && view !== 'admin') {
            const t = readStoredAdminToken();
            if (t) {
                setAdminToken(t);
                setView('admin');
            } else {
                setShowPassword(true);
            }
        } else {
            setView(tView);
        }
    };

    return (
        <div className={`container${view === 'admin' || view === 'client' || view === 'my_apps' ? ' container--wide' : ''}`}>
            <Header view={view} setView={navigateTo} />
            {showPassword && <PasswordModal onSuccess={handleAdminLoginSuccess} onCancel={() => setShowPassword(false)} />}
            <main>
                {view === 'client' && (
                    <ClientArea
                        appointments={appointments}
                        refreshData={refreshData}
                        clients={clients}
                        adminWhatsApp={adminWhatsApp}
                        blockedSlots={blockedSlots}
                        blockedFullDays={blockedFullDays}
                        promoPackagesEnabled={promoPackagesEnabled}
                        bookingRestoreOrderNsu={bookingRestoreOrderNsu}
                        onBookingRestoreConsumed={clearBookingRestore}
                        mergeAppointmentRow={mergeAppointmentRow}
                        catalogServicesClient={catalogServicesClient}
                    />
                )}
                {view === 'my_apps' && (
                    <MyAppointmentsArea
                        appointments={appointments}
                        refreshData={refreshData}
                        clients={clients}
                        setView={setView}
                        adminWhatsApp={adminWhatsApp}
                        catalogServicesClient={catalogServicesClient}
                        blockedSlots={blockedSlots}
                        blockedFullDays={blockedFullDays}
                    />
                )}
                {view === 'admin' && (
                    <AdminArea
                        appointments={appointments}
                        refreshData={refreshData}
                        clients={clients}
                        blockedSlots={blockedSlots}
                        blockedFullDays={blockedFullDays}
                        adminToken={adminToken}
                        onAdminSessionInvalid={handleAdminSessionInvalid}
                        onExitAdmin={() => setView('client')}
                        catalogServicesClient={catalogServicesClient}
                    />
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
