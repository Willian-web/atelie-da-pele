                                        <th style={{textAlign: 'left', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Cliente</th>
                                        <th style={{textAlign: 'left', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Serviço</th>
                                        <th style={{textAlign: 'left', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Data</th>
                                        <th style={{textAlign: 'left', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Hora</th>
                                        <th style={{textAlign: 'left', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Status</th>
                                        <th style={{textAlign: 'left', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Tipo pagamento</th>
                                        <th style={{textAlign: 'right', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Valor total procedimento</th>
                                        <th style={{textAlign: 'right', padding: '10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Valor pago</th>
                                        <th style={{textAlign: 'right', padding: '10px 18px 10px 10px', borderBottom: '1px solid #e2e8f0', fontSize: '13px'}}>Valor restante</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {items.length === 0 ? (
                                        <tr>
                                            <td colSpan="9" style={{padding: '12px', fontSize: '13px', color: 'var(--text-muted)'}}>
                                                Nenhum item no período.
                                            </td>
                                        </tr>
                                    ) : items.map((it, idx) => {
                                        const dateLabel = it.date ? new Date(it.date + 'T12:00:00').toLocaleDateString('pt-BR') : '-';
                                        const effPaid = (it.effectiveReceivedPaid === null || it.effectiveReceivedPaid === undefined) ? null : Number(it.effectiveReceivedPaid);
                                        const remainingAmount = (it.remainingAmount === null || it.remainingAmount === undefined) ? null : Number(it.remainingAmount);
                                        const paymentTypeRaw = (it.paymentType || '').toString().toLowerCase();
                                        const paymentType = paymentTypeRaw === 'partial'
                                            ? 'Parcial'
                                            : paymentTypeRaw === 'full'
                                                ? 'Total'
                                                : '-';

                                        const procTotal = (it.procedureTotal === null || it.procedureTotal === undefined) ? null : Number(it.procedureTotal);

                                        return (
                                            <tr key={it.id || idx} style={{borderBottom: '1px solid #f1f5f9'}}>
                                                <td style={{padding: '10px', fontSize: '13px'}}>{it.clientName || '-'}</td>
                                                <td style={{padding: '10px', fontSize: '13px'}}>{it.serviceName || it.serviceId || '-'}</td>
                                                <td style={{padding: '10px', fontSize: '13px'}}>{dateLabel}</td>
                                                <td style={{padding: '10px', fontSize: '13px'}}>{it.time || '-'}</td>
                                                <td style={{padding: '10px', fontSize: '13px'}}><StatusBadge status={it.status} /></td>
                                                <td style={{padding: '10px', fontSize: '13px'}}>{paymentType}</td>
                                                <td style={{padding: '10px', fontSize: '13px', textAlign: 'right'}}>{procTotal != null && Number.isFinite(procTotal) ? formatBRL(procTotal) : '—'}</td>
                                                <td style={{padding: '10px', fontSize: '13px', textAlign: 'right'}}>{effPaid != null && Number.isFinite(effPaid) && effPaid > 0 ? formatBRL(effPaid) : '—'}</td>
                                                <td style={{padding: '10px 18px 10px 10px', fontSize: '13px', textAlign: 'right'}}>{remainingAmount != null ? formatBRL(remainingAmount) : '-'}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </>
                )}
            </div>
        );
    };

    return (
        <div className="booking-section step-container" style={{textAlign: 'center'}}>
            <div className="admin-panel-head">
                <h2>Painel Profissional</h2>
                <button type="button" className="btn-admin" onClick={refreshData}>
                    <i className="fas fa-sync-alt"></i> Atualizar
                </button>
            </div>

            <div className="filter-tabs admin-main-tabs" style={{ justifyContent: 'center' }}>
                <button className={`tab-btn ${adminView === 'agenda' ? 'active' : ''}`} onClick={() => setAdminView('agenda')}>
                    Agenda Geral
                </button>
                <button className={`tab-btn ${adminView === 'clients' ? 'active' : ''}`} onClick={() => setAdminView('clients')}>
                    Radar de Clientes
                </button>
                <button className={`tab-btn ${adminView === 'report' ? 'active' : ''}`} onClick={() => setAdminView('report')}>
                    Relatório
                </button>
                <button className={`tab-btn ${adminView === 'blocks' ? 'active' : ''}`} onClick={() => setAdminView('blocks')}>
                    Bloquear horários
                </button>
                <button className={`tab-btn ${adminView === 'campaigns' ? 'active' : ''}`} onClick={() => setAdminView('campaigns')}>
                    Campanhas
                </button>
            </div>

            <div style={{marginTop: '18px'}}>
                {adminView === 'agenda' && renderAgenda()}
                {adminView === 'clients' && renderClients()}
                {adminView === 'report' && renderReport()}
                {adminView === 'blocks' && renderBlockedSlots()}
                {adminView === 'campaigns' && renderCampaigns()}
            </div>

            {settleBalanceModal && (
                <div className="password-overlay" style={{zIndex: 10045}} role="dialog" aria-modal="true">
                    <div className="password-modal manual-payment-modal" style={{maxWidth: '520px', width: '100%', textAlign: 'left'}}>
                        <h3 style={{marginBottom: '12px', textAlign: 'center'}}>Quitar saldo restante</h3>
                        <div style={{fontSize: '13px', color: 'var(--text-muted)', marginBottom: '12px', lineHeight: 1.4, textAlign: 'center'}}>
                            Registre o pagamento do saldo (presencial, Pix manual, dinheiro ou transferência). O valor já pago (ex.: sinal) não será apagado — apenas somado.
                        </div>

                        <div style={{background: '#fff', border: '1px solid var(--border-color)', borderRadius: '12px', padding: '12px 14px', marginBottom: '12px'}}>
                            <div style={{fontWeight: 700, marginBottom: '6px'}}>{settleBalanceModal.clientName}</div>
                            <div style={{fontSize: '13px', color: 'var(--text-muted)', marginBottom: '8px'}}>
                                {settleBalanceModal.serviceName}
                                {typeof settleBalanceModal.total === 'number' ? ` — total ${formatPrice(settleBalanceModal.total)}` : ''}
                            </div>
                            <div style={{fontSize: '13px', lineHeight: 1.5}}>
                                {settleBalanceModal.paidSoFar != null && (
                                    <div><strong>Já pago:</strong> R$ {settleBalanceModal.paidSoFar.toFixed(2).replace('.', ',')}</div>
                                )}
                                {settleBalanceModal.remaining != null && (
                                    <div><strong>Saldo a quitar agora:</strong> R$ {settleBalanceModal.remaining.toFixed(2).replace('.', ',')}</div>
                                )}
                            </div>
                        </div>

                        <div className="form-group full-width" style={{marginBottom: 0}}>
                            <label className="form-label">Observação (opcional)</label>
                            <input
                                className="form-control"
                                placeholder="Ex.: Pago em dinheiro no atendimento"
                                value={settleBalanceModal.note}
                                onChange={(e) => setSettleBalanceModal((m) => ({ ...m, note: e.target.value, error: '' }))}
                            />
                        </div>

                        {settleBalanceModal.error && (
                            <div className="alert alert-error" style={{marginTop: '12px', marginBottom: 0, fontSize: '13px'}}>
                                {settleBalanceModal.error}
                            </div>
                        )}

                        <div className="modal-actions" style={{marginTop: '12px'}}>
                            <button type="button" className="btn-cancel" onClick={() => setSettleBalanceModal(null)} disabled={settleBalanceModal.saving}>
                                Cancelar
                            </button>
                            <button type="button" className="btn-submit" style={{flex: 1}} onClick={submitSettleRemaining} disabled={settleBalanceModal.saving}>
                                {settleBalanceModal.saving ? 'Salvando…' : 'Confirmar quitação'}
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {manualPayModal && (
                <div className="password-overlay" style={{zIndex: 10040}} role="dialog" aria-modal="true">
                    <div className="password-modal manual-payment-modal" style={{maxWidth: '520px', width: '100%', textAlign: 'left'}}>
                        <h3 style={{marginBottom: '12px', textAlign: 'center'}}>Confirmar pagamento manual</h3>
                        <div style={{fontSize: '13px', color: 'var(--text-muted)', marginBottom: '12px', lineHeight: 1.4, textAlign: 'center'}}>
                            Use quando a cliente pagou fora da InfinitePay (Pix manual, dinheiro, transferência, presencial).
                        </div>

                        <div style={{background: '#fff', border: '1px solid var(--border-color)', borderRadius: '12px', padding: '12px 14px', marginBottom: '12px'}}>
                            <div style={{fontWeight: 700, marginBottom: '6px'}}>{manualPayModal.clientName}</div>
                            <div style={{fontSize: '13px', color: 'var(--text-muted)'}}>
                                {manualPayModal.serviceName}
                                {typeof manualPayModal.total === 'number' ? ` — ${formatPrice(manualPayModal.total)}` : ''}
                            </div>
                        </div>

                        <div className="form-grid" style={{gap: '12px'}}>
                            <div className="form-group" style={{marginBottom: 0}}>
                                <label className="form-label">Tipo</label>
                                <select
                                    className="form-control"
                                    value={manualPayModal.paymentType}
                                    onChange={(e) => setManualPayModal((m) => ({ ...m, paymentType: e.target.value, error: '' }))}
                                >
                                    <option value="partial">Parcial (sinal / pago fora)</option>
                                    <option value="full">Integral (procedimento pago)</option>
                                </select>
                            </div>

                            {String(manualPayModal.paymentType) === 'partial' && (
                                <div className="form-group" style={{marginBottom: 0}}>
                                    <label className="form-label">Valor pago (R$)</label>
                                    <input
                                        inputMode="decimal"
                                        className="form-control"
                                        placeholder="Ex.: 30,00"
                                        value={manualPayModal.paidAmount}
                                        onChange={(e) => setManualPayModal((m) => ({ ...m, paidAmount: e.target.value, error: '' }))}
                                    />
                                </div>
                            )}

                            <div className="form-group full-width" style={{marginBottom: 0}}>
                                <label className="form-label">Observação (opcional)</label>
                                <input
                                    className="form-control"
                                    placeholder="Ex.: Pago via Pix manual"
                                    value={manualPayModal.note}
                                    onChange={(e) => setManualPayModal((m) => ({ ...m, note: e.target.value }))}
                                />
                            </div>
                        </div>

                        {manualPayModal.error && (
                            <div className="alert alert-error" style={{marginTop: '12px', marginBottom: 0, fontSize: '13px'}}>
                                {manualPayModal.error}
                            </div>
                        )}

                        <div className="modal-actions" style={{marginTop: '12px'}}>
                            <button type="button" className="btn-cancel" onClick={() => setManualPayModal(null)} disabled={manualPayModal.saving}>
                                Cancelar
                            </button>
                            <button type="button" className="btn-submit" style={{flex: 1}} onClick={submitManualPayment} disabled={manualPayModal.saving}>
                                {manualPayModal.saving ? 'Salvando…' : 'Confirmar pagamento'}
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {clientEditModal && (
                <div className="password-overlay" style={{zIndex: 10050}}>
                    <div className="password-modal" style={{maxWidth: '420px', width: '100%', textAlign: 'left'}}>
                        <h3 style={{marginBottom: '16px', textAlign: 'center'}}>Editar cliente</h3>
                        <div className="form-group full-width">
                            <label className="form-label">Nome</label>
                            <input type="text" className="form-control" value={clientEditModal.name} onChange={e => setClientEditModal({ ...clientEditModal, name: e.target.value })} />
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">WhatsApp (somente números)</label>
                            <input type="text" className="form-control" value={clientEditModal.phone} onChange={e => setClientEditModal({ ...clientEditModal, phone: e.target.value })} />
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">E-mail</label>
                            <input type="email" className="form-control" autoComplete="email" value={clientEditModal.email} onChange={e => setClientEditModal({ ...clientEditModal, email: e.target.value })} />
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">Endereço</label>
                            <input type="text" className="form-control" value={clientEditModal.address} onChange={e => setClientEditModal({ ...clientEditModal, address: e.target.value })} />
                        </div>
                        {clientEditError && <div className="alert alert-error" style={{marginBottom: '12px', fontSize: '13px'}}>{clientEditError}</div>}
                        <div className="modal-actions" style={{marginTop: '8px'}}>
                            <button type="button" className="btn-cancel" onClick={() => { setClientEditModal(null); setClientEditError(''); }} disabled={clientEditSaving}>Cancelar</button>
                            <button type="button" className="btn-submit" style={{flex: 1}} onClick={saveClientEdit} disabled={clientEditSaving}>{clientEditSaving ? 'Salvando…' : 'Salvar'}</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

const MyAppointmentsArea = ({ appointments, refreshData, clients, setView }) => {
    const [phoneInput, setPhoneInput] = useState('');
    const [filter, setFilter] = useState('next'); // next | all | past
    const [selfEditModal, setSelfEditModal] = useState(null);
    const [selfEditError, setSelfEditError] = useState('');
    const [selfEditSaving, setSelfEditSaving] = useState(false);
    const [selfEditBanner, setSelfEditBanner] = useState('');

    const cleanPhone = (p) => String(p || '').replace(/\D/g, '');
    const myPhone = cleanPhone(phoneInput);
    const todayStr = getLocalTodayStr();

    const myApps = useMemo(() => {
        if (!myPhone) return [];

        const list = (appointments || []).filter(a => {
            const apPhone = cleanPhone(a.clientPhone || a.client_phone);
            return apPhone && apPhone === myPhone;
        });

        const sorted = list.slice().sort((a, b) => {
            const da = a.date || '';
            const db = b.date || '';
            if (da !== db) return da.localeCompare(db);
            const ta = (a.time || '').toString();
            const tb = (b.time || '').toString();
            return ta.localeCompare(tb);
        });

        if (filter === 'all') return sorted;
        if (filter === 'past') return sorted.filter(a => (a.date || '') < todayStr);
        return sorted.filter(a => (a.date || '') >= todayStr);
    }, [appointments, myPhone, filter, todayStr]);

    const matchedClient = useMemo(() => {
        if (!myPhone) return null;
        const list = clients || [];
        let c = list.find((cl) => cleanPhone(cl.phone) === myPhone);
        if (!c && myApps.length) {
            const cid = myApps[0].clientId || myApps[0].client_id;
            if (cid) {
                const byId = list.find((cl) => cl.id === cid);
                const apPh = cleanPhone(myApps[0].clientPhone || myApps[0].client_phone);
                if (byId && apPh === myPhone) c = byId;
            }
        }
        return c || null;
    }, [clients, myPhone, myApps]);

    useEffect(() => {
        if (!selfEditBanner) return undefined;
        const t = setTimeout(() => setSelfEditBanner(''), 5000);
        return () => clearTimeout(t);
    }, [selfEditBanner]);

    const openSelfEdit = () => {
        if (!matchedClient || !myPhone) return;
        setSelfEditError('');
        setSelfEditBanner('');
        setSelfEditModal({
            id: matchedClient.id,
            name: matchedClient.name || '',
            phone: matchedClient.phone || '',
            email: String(matchedClient.email || '').trim(),
            address: matchedClient.address || '',
            verifyDigits: myPhone
        });
    };

    const saveSelfEdit = async () => {
        if (!selfEditModal) return;
        setSelfEditError('');
        const em = String(selfEditModal.email || '').trim().toLowerCase();
        if (!isValidEmailFormat(em)) {
            setSelfEditError('Informe um e-mail válido.');
            return;
        }
        const newDigits = cleanPhone(selfEditModal.phone);
        if (!newDigits) {
            setSelfEditError('O telefone é obrigatório para localizar seus agendamentos.');
            return;
        }
        if (!(selfEditModal.name || '').trim()) {
            setSelfEditError('Nome é obrigatório.');
            return;
        }
        setSelfEditSaving(true);
        try {
            const res = await fetch(`${API_BASE_URL}/clients/${encodeURIComponent(selfEditModal.id)}/self`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    verifyPhoneDigits: selfEditModal.verifyDigits,
                    name: (selfEditModal.name || '').trim(),
                    phone: newDigits,
                    address: (selfEditModal.address || '').trim(),
                    email: em
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setSelfEditError(data.error || 'Não foi possível salvar.');
                return;
            }
            setSelfEditModal(null);
            if (newDigits !== myPhone) {
                setPhoneInput(newDigits);
            }
            setSelfEditBanner('Cadastro atualizado com sucesso.');
            await refreshData();
        } catch {
            setSelfEditError('Falha de rede ao salvar.');
        } finally {
            setSelfEditSaving(false);
        }
    };

    return (
        <div className="booking-section step-container" style={{textAlign: 'center'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', gap: '12px', alignItems: 'center', flexWrap: 'wrap', marginBottom: '20px'}}>
                <h2 style={{margin: 0}}>Meus Agendamentos</h2>
                <div style={{display: 'inline-flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap', justifyContent: 'flex-end'}}>
                    {matchedClient && myPhone && (
                        <button
                            type="button"
                            className="refresh-btn"
                            onClick={openSelfEdit}
                            style={{
                                padding: '7px 12px',
                                borderRadius: '999px',
                                width: 'fit-content',
                                maxWidth: '100%',
                                opacity: 0.92
                            }}
                            aria-label="Editar cadastro"
                        >
                            <i className="fas fa-pen" aria-hidden="true"></i>
                            Editar cadastro
                        </button>
                    )}
                    <button className="btn-admin" onClick={refreshData}>
                        <i className="fas fa-sync-alt"></i> Atualizar
                    </button>
                </div>
            </div>

            <div style={{maxWidth: '520px', margin: '0 auto', textAlign: 'left', width: '100%', boxSizing: 'border-box', padding: '0 4px'}}>
                <label style={{fontSize: '13px', color: 'var(--text-muted)', display: 'block', marginBottom: '8px'}}>
                    Digite seu telefone para ver seus agendamentos
                </label>
                <input
                    type="text"
                    className="form-control"
                    value={phoneInput}
                    onChange={e => setPhoneInput(e.target.value)}
                    placeholder="Ex: (41) 99999-9999"
                    style={{ width: '100%', boxSizing: 'border-box' }}
                />

                <div className="filter-tabs" style={{marginTop: '18px', marginBottom: '18px', justifyContent: 'center'}}>
                    <button className={`tab-btn ${filter === 'next' ? 'active' : ''}`} onClick={() => setFilter('next')}>
                        Próximos
                    </button>
                    <button className={`tab-btn ${filter === 'past' ? 'active' : ''}`} onClick={() => setFilter('past')}>
                        Anteriores
                    </button>
                    <button className={`tab-btn ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>
                        Todos
                    </button>
                </div>
            </div>

            {selfEditBanner && (
                <div className="alert" style={{ background: '#ecfdf5', border: '1px solid #a7f3d0', color: '#065f46', maxWidth: '520px', margin: '0 auto 12px', fontSize: '14px' }}>
                    {selfEditBanner}
                </div>
            )}

            {!myPhone && (
                <div className="alert" style={{background: '#f8fafc', border: '1px solid #e2e8f0', color: '#334155'}}>
                    Informe seu telefone acima para carregar seus agendamentos.
                </div>
            )}

            {myPhone && myApps.length === 0 && (
                <div className="alert" style={{background: '#f8fafc', border: '1px solid #e2e8f0', color: '#334155'}}>
                    Nenhum agendamento encontrado para este telefone.
                </div>
            )}

            <div style={{display: 'flex', flexDirection: 'column', gap: '12px', marginTop: '10px', width: '100%', maxWidth: '100%', boxSizing: 'border-box'}}>
                {myApps.map(app => {
                    const clientName = app.clientName || app.client_name || 'Cliente';
                    const { label: serviceName, scheduleHint } = formatAgendaServiceSummary(app);
                    const dateLabel = app.date ? new Date(app.date + 'T12:00:00').toLocaleDateString('pt-BR') : '-';
                    const timeLabel = app.time || '-';
                    const location = app.location || '';
                    const notes = app.notes || '';
                    const cancelReason = app.cancelReason || app.cancel_reason || '';
                    const { paid, remaining, showRemaining } = resolveAppointmentPaidForDisplay(app);
                    const paidLabel = formatBRLFromNumber(paid != null ? paid : 0);
                    const remLabel = showRemaining && remaining != null ? formatBRLFromNumber(remaining) : null;

                    return (
                        <div key={app.id} style={{background: '#fcfcfc', border: '1px solid #ddd', padding: '16px', borderRadius: '10px', textAlign: 'left', maxWidth: '100%', boxSizing: 'border-box', wordBreak: 'break-word'}}>
                            <div style={{display: 'flex', justifyContent: 'space-between', gap: '10px', alignItems: 'flex-start', flexWrap: 'wrap'}}>
                                <div style={{ minWidth: 0, flex: '1 1 auto' }}>
                                    <div style={{fontWeight: '700', marginBottom: '6px'}}>{serviceName}</div>
                                    {scheduleHint ? (
                                        <div style={{ fontSize: '13px', color: 'var(--text-dark)', marginBottom: '6px', fontWeight: 600, lineHeight: 1.45 }}>
                                            Horários: {scheduleHint}
                                        </div>
                                    ) : (
                                        <div style={{fontSize: '13px', color: 'var(--text-muted)'}}>{dateLabel} • {timeLabel}</div>
                                    )}
                                    {scheduleHint ? (
                                        <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '4px' }}>
                                            Referência no sistema: {dateLabel} • {timeLabel}
                                        </div>
                                    ) : null}
                                    <div style={{fontSize: '13px', color: 'var(--text-muted)', marginTop: '6px'}}><strong>Cliente:</strong> {clientName}</div>
                                    {paidLabel && (
                                        <div style={{ fontSize: '13px', marginTop: '8px', color: 'var(--text-dark)' }}>
                                            <strong>Valor pago:</strong> {paidLabel}
                                            {remLabel && (
                                                <span style={{ display: 'block', marginTop: '4px' }}><strong>Saldo restante:</strong> {remLabel}</span>
                                            )}
                                        </div>
                                    )}
                                </div>
                                <StatusBadge status={app.status} />
                            </div>

                            {location && (
                                <div style={{fontSize: '13px', marginTop: '10px'}}>
                                    <strong>Endereço informado:</strong><br />{location}
                                </div>
                            )}

                            <div style={{fontSize: '13px', marginTop: '10px'}}>
                                <strong>Local do atendimento:</strong><br />
                                Ateliê da Pele — Rua Rio Jaguaribe, nº 274
                            </div>

                            {notes && (
                                <div style={{fontSize: '13px', marginTop: '10px'}}>
                                    <strong>Observações:</strong><br />{notes}
                                </div>
                            )}

                            {cancelReason && (
                                <div style={{fontSize: '13px', marginTop: '10px', color: '#b91c1c'}}>
                                    <strong>Motivo do cancelamento:</strong><br />{cancelReason}
                                </div>
                            )}
                        </div>
                    );
                })}
            </div>

            {selfEditModal && (
                <div className="password-overlay self-edit-overlay" style={{ zIndex: 10050, padding: '12px', alignItems: 'center', justifyContent: 'center', boxSizing: 'border-box' }} role="dialog" aria-modal="true" aria-labelledby="self-edit-title">
                    <div
                        className="password-modal"
                        style={{
                            maxWidth: 'min(420px, calc(100vw - 24px))',
                            width: '100%',
                            textAlign: 'left',
                            maxHeight: '90vh',
                            overflowY: 'auto',
                            boxSizing: 'border-box'
                        }}
                    >
                        <h3 id="self-edit-title" style={{ marginBottom: '16px', textAlign: 'center' }}>Editar cadastro</h3>
                        <div className="form-group full-width">
                            <label className="form-label">Nome</label>
                            <input type="text" className="form-control" value={selfEditModal.name} onChange={e => setSelfEditModal({ ...selfEditModal, name: e.target.value })} style={{ width: '100%', boxSizing: 'border-box' }} />
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">WhatsApp</label>
                            <input type="text" className="form-control" value={selfEditModal.phone} onChange={e => setSelfEditModal({ ...selfEditModal, phone: e.target.value })} style={{ width: '100%', boxSizing: 'border-box' }} />
                            <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '6px 0 0' }}>Necessário para buscar seus agendamentos; não pode ficar vazio.</p>
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">E-mail</label>
                            <input type="email" className="form-control" autoComplete="email" value={selfEditModal.email} onChange={e => setSelfEditModal({ ...selfEditModal, email: e.target.value })} style={{ width: '100%', boxSizing: 'border-box' }} />
                        </div>
                        <div className="form-group full-width">
                            <label className="form-label">Endereço</label>
                            <input type="text" className="form-control" value={selfEditModal.address} onChange={e => setSelfEditModal({ ...selfEditModal, address: e.target.value })} style={{ width: '100%', boxSizing: 'border-box' }} />
                        </div>
                        {selfEditError && <div className="alert alert-error" style={{ marginBottom: '12px', fontSize: '13px' }}>{selfEditError}</div>}
                        <div className="modal-actions" style={{ marginTop: '8px', flexWrap: 'wrap', gap: '8px' }}>
                            <button type="button" className="btn-cancel" onClick={() => { setSelfEditModal(null); setSelfEditError(''); }} disabled={selfEditSaving}>Cancelar</button>
                            <button type="button" className="btn-submit" style={{ flex: '1 1 140px', minWidth: 0 }} onClick={saveSelfEdit} disabled={selfEditSaving}>{selfEditSaving ? 'Salvando…' : 'Salvar'}</button>
                        </div>
                    </div>
                </div>
            )}

            <div style={{marginTop: '20px'}}>
                <button className="btn-admin" onClick={() => setView('client')}>
                    <i className="fas fa-arrow-left"></i> Voltar
                </button>
            </div>
        </div>
    );
};


// ============== ROOT APP ==============

function readBookingRestoreOrderNsu() {
    try {
        const u = new URL(window.location.href);
        if (u.searchParams.get('return') === 'booking') {
            return String(u.searchParams.get('order_nsu') || '').trim();
        }
    } catch (_) { /* ignore */ }
    return '';
}

const App = () => {
    const [view, setView] = useState('client');
    const [bookingRestoreOrderNsu, setBookingRestoreOrderNsu] = useState(() => readBookingRestoreOrderNsu());
    const clearBookingRestore = useCallback(() => {
        setBookingRestoreOrderNsu('');
    }, []);

    const [showPassword, setShowPassword] = useState(false);

    const readStoredAdminToken = () => {
        try {
            return sessionStorage.getItem(ADMIN_TOKEN_STORAGE_KEY) || '';
        } catch {
            return '';
        }
    };

    const [adminToken, setAdminToken] = useState(readStoredAdminToken);
    
    const [appointments, setAppointments] = useState([]);
    const [clients, setClients] = useState([]);
    const [blockedSlots, setBlockedSlots] = useState([]);
    const [blockedFullDays, setBlockedFullDays] = useState([]);
    const [adminWhatsApp, setAdminWhatsApp] = useState('');
    const [promoPackagesEnabled, setPromoPackagesEnabled] = useState(false);

    const handleAdminLoginSuccess = (token) => {
        try {
            sessionStorage.setItem(ADMIN_TOKEN_STORAGE_KEY, token);
        } catch (_) { /* ignore */ }
        setAdminToken(token);
        setShowPassword(false);
        setView('admin');
    };

    const handleAdminSessionInvalid = useCallback(() => {
        try {
            sessionStorage.removeItem(ADMIN_TOKEN_STORAGE_KEY);
        } catch (_) { /* ignore */ }
        setAdminToken('');
        setShowPassword(true);
    }, []);

    const refreshData = useCallback(async () => {
        try {
            const resAps = await fetch(`${API_BASE_URL}/appointments`);
            if (resAps.ok) {
                const aps = await resAps.json();
                if (Array.isArray(aps)) {
                    setAppointments(aps);
                }
            }

            const resClis = await fetch(`${API_BASE_URL}/clients`);
            if (resClis.ok) {
                const cls = await resClis.json();
                if (Array.isArray(cls)) {
                    setClients(cls);
                }
            }

            const resSch = await fetch(`${API_BASE_URL}/public/schedule-blocks`, { cache: 'no-store' });
            if (resSch.ok) {
                const sch = await resSch.json().catch(() => ({}));
                setBlockedSlots(Array.isArray(sch.blockedSlots) ? sch.blockedSlots : []);
                setBlockedFullDays(Array.isArray(sch.blockedFullDays) ? sch.blockedFullDays : []);
            } else {
                setBlockedSlots([]);
                setBlockedFullDays([]);
            }

            const resCfg = await fetch(`${API_BASE_URL}/config/public`, { cache: 'no-store' });
            if (resCfg.ok) {
                const j = await resCfg.json().catch(() => ({}));
                setAdminWhatsApp(String(j.adminWhatsApp || '').replace(/\D/g, ''));
                const promoRaw = j.promotionalPackagesEnabled;
                setPromoPackagesEnabled(
                    promoRaw === true ||
                        promoRaw === 'true' ||
                        String(promoRaw || '')
                            .trim()
                            .toLowerCase() === 'on'
                );
            }
        } catch(e) { 
            console.error(e);
        }
    }, []);

    useEffect(() => {
        refreshData();
        const intervalId = setInterval(refreshData, 10000);
        return () => clearInterval(intervalId);
    }, [refreshData]);

    useEffect(() => {
        if (bookingRestoreOrderNsu) {
            setView('client');
        }
    }, [bookingRestoreOrderNsu]);

    const navigateTo = (tView) => {
        if (tView === 'admin' && view !== 'admin') {
            const t = readStoredAdminToken();
            if (t) {
                setAdminToken(t);
                setView('admin');
            } else {
                setShowPassword(true);
            }
        } else {
            setView(tView);
        }
    };

    return (
        <div className="container">
            <Header view={view} setView={navigateTo} />
            {showPassword && <PasswordModal onSuccess={handleAdminLoginSuccess} onCancel={() => setShowPassword(false)} />}
            <main>
                {view === 'client' && (
                    <ClientArea
                        appointments={appointments}
                        refreshData={refreshData}
                        clients={clients}
                        adminWhatsApp={adminWhatsApp}
                        blockedSlots={blockedSlots}
                        blockedFullDays={blockedFullDays}
                        promoPackagesEnabled={promoPackagesEnabled}
                        bookingRestoreOrderNsu={bookingRestoreOrderNsu}
                        onBookingRestoreConsumed={clearBookingRestore}
                    />
                )}
                {view === 'my_apps' && <MyAppointmentsArea appointments={appointments} refreshData={refreshData} clients={clients} setView={setView} />}
                {view === 'admin' && (
                    <AdminArea
                        appointments={appointments}
                        refreshData={refreshData}
                        clients={clients}
                        blockedSlots={blockedSlots}
                        blockedFullDays={blockedFullDays}
                        adminToken={adminToken}
                        onAdminSessionInvalid={handleAdminSessionInvalid}
                        promoPackagesEnabled={promoPackagesEnabled}
                        onPromoPackagesChange={setPromoPackagesEnabled}
                    />
                )}
            </main>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
